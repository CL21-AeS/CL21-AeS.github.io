  /* ══ Scheda persona ═══════════════════════════════════════════════════ */

  /* ══ Passare il prossimo passo al calendario ═══════════════════════════

     Una notifica vera l'app non può darla: per svegliarti fra cinque giorni
     servirebbe un server che sappia cosa dirti, e i nomi stanno solo su questo
     telefono. Il modo che funziona su Android e su iPhone è consegnare la data al
     calendario, che di notifiche se ne intende.

     Due strade: il collegamento a Google Calendar (un tocco, l'evento arriva già
     scritto) e il file `.ics` per qualunque altro calendario. Il secondo non
     compare dentro la cornice dell'artifact, dove i file non si possono salvare.
     Lo stesso impianto è nell'app «Clienti e Riordini».                      */

  const dentroCornice = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

  /* La rubrica si può chiedere al telefono, ma solo dove il telefono la offre:
     Chrome su Android (su iPhone questa funzione non esiste, e lì tutti i browser
     girano sul motore di Safari), pagina in https e fuori da una cornice. Il
     pulsante compare solo lì: meglio non mostrarlo che mostrarlo morto.

     Il permesso non è «leggi la rubrica»: si apre il selettore del telefono, si
     tocca un contatto, e all'app arriva solo quello. */
  const rubricaOk = !dentroCornice && "contacts" in navigator && "ContactsManager" in window;
  const FUSO = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) { return ""; } })();
  const soloCifre = d => String(d).replace(/-/g, "");
  /* Una sveglia nel passato non suona: un passo già scaduto va a domani, la prima
     mattina in cui puoi ancora farci qualcosa. Se scade oggi resta oggi. */
  const nonPassata = d => d < todayISO() ? iso(addDays(new Date(), 1)) : d;

  function eventoPasso(p) {
    if (!p.nextDate) return null;
    const fase = STAGES[clamp(p.reached, 0, STAGES.length - 1)];
    return {
      data: nonPassata(p.nextDate),
      titolo: `${p.name}${p.nextNote ? ": " + p.nextNote : " — prossimo passo"}`,
      nota: fase ? `A che punto siete: ${fase.label.toLowerCase()}.` : "",
    };
  }

  const dettaglioEvento = (p, e) => [e.nota, p.contact ? "Contatto: " + p.contact : "",
    "Da «Dalla Lista al Sì» — " + location.href].filter(Boolean).join("\n");

  function linkGoogleCal(p, e) {
    const d = soloCifre(e.data);
    const q = new URLSearchParams({ action: "TEMPLATE", text: e.titolo,
      dates: `${d}T090000/${d}T091500`, details: dettaglioEvento(p, e) });
    if (FUSO) q.set("ctz", FUSO);
    return "https://calendar.google.com/calendar/render?" + q.toString();
  }

  /* Le righe di un file .ics vanno piegate e le virgole protette: un calendario
     esigente rifiuta il file intero per una riga troppo lunga. */
  const icsRiga = (chiave, valore) => {
    const riga = chiave + ":" + String(valore).replace(/\\/g, "\\\\").replace(/([,;])/g, "\\$1").replace(/\n/g, "\\n");
    const pezzi = [];
    for (let i = 0; i < riga.length; i += 72) pezzi.push((i ? " " : "") + riga.slice(i, i + 72));
    return pezzi.join("\r\n");
  };

  function icsTesto(p, e) {
    const d = soloCifre(e.data);
    const stampa = nowISO().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
    return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//CumLaude21//Dalla Lista al Si//IT",
      "CALSCALE:GREGORIAN", "BEGIN:VEVENT",
      icsRiga("UID", `${p.id}-${e.data}@dalla-lista-al-si`),
      `DTSTAMP:${stampa}`, `DTSTART:${d}T090000`, `DTEND:${d}T091500`,
      icsRiga("SUMMARY", e.titolo), icsRiga("DESCRIPTION", dettaglioEvento(p, e)),
      "BEGIN:VALARM", "ACTION:DISPLAY", icsRiga("DESCRIPTION", e.titolo),
      "TRIGGER:-PT15M", "END:VALARM", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  }

  function scaricaIcs(p) {
    const e = eventoPasso(p);
    if (!e) return;
    const nome = `prossimo-passo-${e.data}.ics`;
    try {
      const url = URL.createObjectURL(new Blob([icsTesto(p, e)], { type: "text/calendar;charset=utf-8" }));
      const a = document.createElement("a");
      a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast("File del calendario scaricato: aprilo per aggiungerlo");
    } catch (err) { toast("Non riesco a creare il file"); }
  }

  function bottoniCalendario(p) {
    const e = eventoPasso(p);
    if (!e) return "";
    return `<a class="btn btn-sm" href="${esc(linkGoogleCal(p, e))}" target="_blank" rel="noopener">In calendario</a>
      ${dentroCornice ? "" : `<button class="btn btn-sm btn-quiet" data-act="ics" data-id="${p.id}">file .ics</button>`}`;
  }

  function renderSheet() {
    const layer = document.getElementById("layer");
    if (!openId) { if (!document.querySelector(".modal-box")) layer.innerHTML = ""; return; }
    const p = byId(openId);
    if (!p) { openId = null; layer.innerHTML = ""; return; }

    const events = p.events.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    const firstOf = t => p.events.filter(e => e.type === t).sort((a, b) => (a.date < b.date ? -1 : 1))[0];

    const path = STAGES.map((s, i) => {
      const done = i <= p.reached;
      const cur = i === p.reached && isOpen(p);
      const ev = i === 0 ? { date: p.createdAt } : firstOf(s.id);
      return `<div class="sp-item ${done ? "done" : ""} ${cur ? "cur" : ""}">
        <div class="sp-mark"><span class="sp-dot"></span><span class="sp-line"></span></div>
        <div class="sp-body">
          <span class="sp-label">${esc(s.label)}</span>
          ${done && ev ? `<span class="sp-when">${esc(dshort(ev.date))}</span>` : ""}
          ${done && ev && ev.plan ? `<span class="sp-note">${esc(planLabel(ev.plan))}</span>` : ""}
        </div>
      </div>`;
    }).join("");

    const closeStep = `<div class="sp-item ${p.outcome ? "done cur" : ""}">
      <div class="sp-mark"><span class="sp-dot"></span></div>
      <div class="sp-body"><span class="sp-label">${p.outcome ? outcomeOf(p.outcome).label : "Esito"}</span>
      ${p.outcome ? `<span class="sp-when">${esc(dshort((firstOf("esito") || {}).date || ""))}</span>` : ""}</div>
    </div>`;

    const due = relDue(p.nextDate);

    layer.innerHTML = `<div class="scrim" data-act="close-layer"></div>
      <aside class="sheet" role="dialog" aria-label="Scheda di ${esc(p.name)}">
        <div class="sheet-head">
          <button class="btn btn-sm btn-quiet sheet-x" data-act="close-layer" aria-label="Chiudi">Chiudi ✕</button>
          <div style="padding-right:80px">
            <div class="eyebrow">${esc(stageLabel(p))}</div>
            <h1 style="font-size:21px;margin-top:3px">${esc(p.name)}</h1>
          </div>
          <div class="btn-row">
            <button class="btn btn-primary" data-act="progress" data-id="${p.id}">Progressi</button>
            ${isOpen(p) ? "" : `<button class="btn" data-act="reopen" data-id="${p.id}">Riapri il percorso</button>`}
          </div>
        </div>
        <div class="sheet-body">
          <dl class="kv">
            ${p.contact ? `<dt>Contatto</dt><dd>${esc(p.contact)}</dd>` : ""}
            ${p.origine ? `<dt>Da dove</dt><dd>${esc(p.origine)}</dd>` : ""}
            <dt>In lista da</dt><dd>${esc(dshort(p.createdAt))}</dd>
            ${p.note ? `<dt>Note</dt><dd>${esc(p.note)}</dd>` : ""}
          </dl>

          <div class="next-box">
            <div class="eyebrow">Prossimo passo${due ? ` · ${esc(due.text)}` : ""}</div>
            <div class="field-2">
              <input id="np-date" type="date" value="${esc(p.nextDate)}" aria-label="Data del prossimo passo">
              <input id="np-note" type="text" value="${esc(p.nextNote)}" placeholder="Cosa devi fare" aria-label="Cosa devi fare">
            </div>
            <div class="btn-row">
              <button class="btn btn-sm" data-act="save-next" data-id="${p.id}">Salva</button>
              ${p.nextDate ? `<button class="btn btn-sm btn-quiet" data-act="clear-next" data-id="${p.id}">Togli</button>` : ""}
              ${p.nextDate ? bottoniCalendario(p) : ""}
            </div>
          </div>

          <div>
            <div class="eyebrow" style="margin-bottom:9px">Il percorso</div>
            <div class="stage-path">${path}${closeStep}</div>
          </div>

          <div>
            <div class="eyebrow" style="margin-bottom:9px">Cronologia · ${events.length}</div>
            <div class="rows">
              ${events.map(e => `<div class="row" style="cursor:default">
                <div class="row-main">
                  <span class="row-name" style="font-size:13.5px">${esc(typeLabel(e.type))}${e.plan ? ` — ${esc(planLabel(e.plan))}` : ""}${e.outcome ? ` — ${esc(outcomeOf(e.outcome).label)}` : ""}</span>
                  ${eventDetail(e) ? `<span class="row-sub">${esc(eventDetail(e))}</span>` : ""}
                  ${e.note ? `<span class="row-sub" style="white-space:normal">${esc(e.note)}</span>` : ""}
                </div>
                <div class="row-side"><span class="due">${esc(dshort(e.date))}</span>
                  <button class="btn btn-sm btn-quiet" data-act="del-event" data-id="${p.id}" data-eid="${e.id}" aria-label="Elimina">✕</button>
                </div>
              </div>`).join("")}
            </div>
          </div>

          <div class="btn-row">
            <button class="btn btn-sm" data-act="edit" data-id="${p.id}">Modifica dati</button>
            <button class="btn btn-sm btn-danger" data-act="del-person" data-id="${p.id}">Elimina persona</button>
          </div>
        </div>
      </aside>`;
  }

  /* ══ Modali ═══════════════════════════════════════════════════════════ */

  /* La finestra si aggiunge accanto alla scheda senza riscriverla: così una
     finestra può sostituirne un'altra (la scelta che apre il passo) e la scheda
     sotto resta intatta, con i valori che l'utente aveva già nei campi. */
  function openModal(html, onMount) {
    const layer = document.getElementById("layer");
    layer.querySelectorAll(".modal-box, .modal-scrim").forEach(n => n.remove());
    layer.insertAdjacentHTML("beforeend",
      `<div class="scrim modal-scrim" data-act="close-modal"></div>
       <div class="modal-box" role="dialog" aria-modal="true">${html}</div>`);
    const box = layer.querySelector(".modal-box");
    if (onMount) onMount(box);
    const f = box.querySelector("input, select, textarea, button");
    if (f) f.focus();
  }

  function closeModal() {
    const layer = document.getElementById("layer");
    layer.querySelectorAll(".modal-box, .modal-scrim").forEach(n => n.remove());
    if (!openId) layer.innerHTML = "";
  }

  function modalPerson(p) {
    const isNew = !p;
    openModal(`<div class="eyebrow">${isNew ? "Nuovo nome" : "Modifica"}</div>
      <h2>${isNew ? "Aggiungi una persona" : esc(p.name)}</h2>
      <form class="modal-form" id="f-person">
        <div class="field"><label for="p-name">Nome</label>
          <input id="p-name" type="text" required value="${esc(p ? p.name : "")}" placeholder="Nome e cognome"
            autocomplete="name" autocapitalize="words"></div>
        <div class="field-2">
          <div class="field"><label for="p-contact">Telefono o email</label>
            <input id="p-contact" type="text" value="${esc(p ? p.contact : "")}"
              autocomplete="tel" inputmode="tel"></div>
          <div class="field"><label for="p-origine">Da dove lo conosci</label>
            <input id="p-origine" type="text" value="${esc(p ? p.origine : "")}" placeholder="Palestra, lavoro, amico di…"></div>
        </div>
        ${rubricaOk ? `<div class="btn-row">
          <button type="button" class="btn btn-sm" id="p-rubrica">Prendi dalla rubrica</button>
          <span class="muted" style="font-size:12.5px;align-self:center">scegli tu il contatto: arriva solo quello</span>
        </div>` : ""}
        <div class="field"><label for="p-note">Note</label>
          <textarea id="p-note" placeholder="Cosa fa, cosa gli interessa, cosa ti ha detto">${esc(p ? p.note : "")}</textarea></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-quiet" data-act="close-modal">Annulla</button>
          <button type="submit" class="btn btn-primary">${isNew ? "Aggiungi" : "Salva"}</button>
        </div>
      </form>`, box => {
      const rub = box.querySelector("#p-rubrica");
      if (rub) rub.addEventListener("click", async () => {
        try {
          /* Si chiede solo quello che questo telefono dice di saper dare: se si
             chiede una proprietà che non conosce, rifiuta tutta la richiesta. */
          const disponibili = await navigator.contacts.getProperties();
          const voglio = ["name", "tel"].filter(x => disponibili.includes(x));
          if (!voglio.length) { toast("Questo telefono non condivide nome e numero"); return; }
          const scelti = await navigator.contacts.select(voglio, { multiple: false });
          if (!scelti || !scelti.length) return;
          const k = scelti[0];
          const nome = (k.name && k.name[0]) || "";
          const tel = (k.tel && k.tel[0]) || "";
          if (nome) box.querySelector("#p-name").value = nome;
          if (tel) box.querySelector("#p-contact").value = tel;
          toast(tel ? "Preso dalla rubrica" : "Quel contatto non ha un numero");
        } catch (e) {
          toast("La rubrica non si è aperta: scrivi il numero a mano");
        }
      });

      box.querySelector("#f-person").addEventListener("submit", ev => {
        ev.preventDefault();
        const name = box.querySelector("#p-name").value.trim();
        if (!name) return;
        const vals = {
          name,
          contact: box.querySelector("#p-contact").value.trim(),
          origine: box.querySelector("#p-origine").value.trim(),
          note: box.querySelector("#p-note").value.trim(),
        };
        if (isNew) {
          const np = {
            id: uid(), ...vals, reached: 0, outcome: null, nextDate: "", nextNote: "",
            createdAt: todayISO(), updatedAt: nowISO(),
            events: [{ id: uid(), type: "lista", date: todayISO(), note: "", plan: "", outcome: "" }],
          };
          state.people.push(np);
          toast(`${name} è in lista`);
        } else {
          const per = byId(p.id);
          Object.assign(per, vals);
          touch(per);
          toast("Salvato");
        }
        save(); closeModal(); render();
      });
    });
  }

  function modalBulk() {
    openModal(`<div class="eyebrow">Lista nomi</div>
      <h2>Aggiungi tanti nomi insieme</h2>
      <form class="modal-form" id="f-bulk">
        <div class="field">
          <label for="b-text">Un nome per riga</label>
          <textarea id="b-text" style="min-height:180px" placeholder="Marco Rossi
Giulia Bianchi, 333 1234567, palestra
Zio Franco"></textarea>
        </div>
        <p class="muted" style="font-size:13px">Se vuoi, dopo il nome puoi mettere una virgola e aggiungere
          il contatto e da dove lo conosci. Tutti entrano come <b>In lista</b>: nessuna decisione, solo nomi.</p>
        <div class="modal-actions">
          <button type="button" class="btn btn-quiet" data-act="close-modal">Annulla</button>
          <button type="submit" class="btn btn-primary">Aggiungi alla lista</button>
        </div>
      </form>`, box => {
      box.querySelector("#f-bulk").addEventListener("submit", ev => {
        ev.preventDefault();
        const lines = box.querySelector("#b-text").value.split("\n").map(l => l.trim()).filter(Boolean);
        let n = 0;
        for (const line of lines) {
          const [name, contact, origine] = line.split(",").map(s => (s || "").trim());
          if (!name) continue;
          state.people.push({
            id: uid(), name, contact: contact || "", origine: origine || "", note: "",
            reached: 0, outcome: null, nextDate: "", nextNote: "", createdAt: todayISO(), updatedAt: nowISO(),
            events: [{ id: uid(), type: "lista", date: todayISO(), note: "", plan: "", outcome: "" }],
          });
          n++;
        }
        save(); closeModal();
        if (view === "cruscotto") view = "nomi";
        render();
        toast(n === 1 ? "1 nome aggiunto" : `${n} nomi aggiunti`);
      });
    });
  }

  /* Prima finestra: si scegle il passo. Quella consigliata è la fase successiva a
     dove si trova la persona, così il pulsante unico non perde l'indicazione che
     davano i due pulsanti separati. */
  function modalProgress(p) {
    const suggested = isOpen(p) ? (p.reached < 4 ? STAGES[p.reached + 1].id : "followup") : null;
    const order = ["contatto", "invito", "piano", "followup", "esito", "nota"];
    const already = t => {
      const ev = p.events.filter(e => e.type === t).sort((a, b) => (a.date < b.date ? 1 : -1))[0];
      return ev ? `Ultimo: ${dshort(ev.date)}` : "";
    };
    openModal(`<div class="eyebrow">${esc(p.name)}</div>
      <h2>Progressi</h2>
      <p class="muted" style="margin-top:4px;font-size:13.5px">Cosa hai fatto?</p>
      <div class="choices">
        ${order.map(t => {
          const F = FORMS[t];
          const last = already(t);
          return `<button type="button" class="choice" data-choice="${t}" ${t === suggested ? "data-suggested" : ""}>
            <span class="choice-t">${esc(F.title)}
              ${t === suggested ? `<span class="chip t-accent"><i class="dot"></i>il prossimo passo</span>` : ""}</span>
            <span class="choice-d">${esc(F.lead)}${last ? ` · ${esc(last)}` : ""}</span>
          </button>`;
        }).join("")}
      </div>
      <div class="modal-actions" style="margin-top:14px">
        <button type="button" class="btn btn-quiet" data-act="close-modal">Annulla</button>
      </div>`, box => {
      box.querySelectorAll("[data-choice]").forEach(b =>
        b.addEventListener("click", () => modalStep(p, b.dataset.choice)));
    });
  }

  /* Seconda finestra: il passo scelto, con le sue domande e nient'altro. */
  function modalStep(p, type) {
    const F = FORMS[type];
    const sel = (id, label, opts) => `<div class="field"><label for="${id}">${esc(label)}</label>
      <select id="${id}"><option value="">—</option>
      ${opts.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join("")}</select></div>`;

    const middle = [
      F.how ? sel("s-how", F.how.label, F.how.opts) : "",
      F.react ? sel("s-react", F.react.label, F.react.opts) : "",
      F.plan ? `<div class="field"><label for="s-plan">Com'è andato</label><select id="s-plan">
          ${PLAN_RESULTS.map(r => `<option value="${r.id}">${esc(r.label)}</option>`).join("")}</select></div>` : "",
      F.outcome ? `<div class="field"><label>Che risposta hai avuto</label><div class="opts" id="s-out">
          ${OUTCOMES.map((o, i) => `<input type="radio" name="s-out" id="o-${o.id}" value="${o.id}" ${i === 0 ? "checked" : ""}>
            <label for="o-${o.id}">${esc(o.label)}</label>`).join("")}</div></div>` : "",
    ].join("");

    openModal(`<button type="button" class="btn btn-sm btn-quiet" data-back style="margin-bottom:10px;padding-left:0">‹ Tutti i passi</button>
      <div class="eyebrow">${esc(p.name)}</div>
      <h2>${esc(F.title)}</h2>
      <p class="muted" style="margin-top:4px;font-size:13.5px">${esc(F.lead)}</p>
      <form class="modal-form" id="f-step">
        <div class="field" style="max-width:190px"><label for="s-date">Quando</label>
          <input id="s-date" type="date" value="${todayISO()}"></div>
        ${middle}
        <div class="field"><label for="s-note" id="s-note-l">${esc(F.noteLabel)}</label>
          <textarea id="s-note"></textarea></div>
        <div class="next-box">
          <div class="eyebrow" id="s-next-l">${esc(F.nextLabel)}</div>
          <div class="field-2">
            <input id="s-ndate" type="date" value="${esc(p.nextDate)}" aria-label="Data">
            <input id="s-nnote" type="text" value="${esc(p.nextNote)}" placeholder="Cosa devi fare" aria-label="Cosa devi fare">
          </div>
          <p class="muted" id="s-next-h" style="font-size:12.5px">${esc(F.nextHint || "")}</p>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-quiet" data-back>Indietro</button>
          <button type="submit" class="btn btn-primary">Registra ${esc(F.title.toLowerCase())}</button>
        </div>
      </form>`, box => {
      box.querySelectorAll("[data-back]").forEach(b => b.addEventListener("click", () => modalProgress(p)));

      // La chiusura riscrive le domande che le stanno sotto in base alla risposta.
      const outBox = box.querySelector("#s-out");
      if (outBox) {
        const syncClose = () => {
          const v = (box.querySelector('input[name="s-out"]:checked') || {}).value;
          const c = CLOSE_COPY[v] || {};
          box.querySelector("#s-note-l").textContent = c.note || F.noteLabel;
          box.querySelector("#s-next-l").textContent = c.next || F.nextLabel;
          box.querySelector("#s-next-h").textContent = c.hint || "";
        };
        outBox.addEventListener("change", syncClose);
        syncClose();
      }

      box.querySelector("#f-step").addEventListener("submit", ev => {
        ev.preventDefault();
        const g = id => { const el = box.querySelector("#" + id); return el ? el.value : ""; };
        const e = {
          id: uid(), type,
          date: g("s-date") || todayISO(),
          note: box.querySelector("#s-note").value.trim(),
          how: g("s-how"),
          react: g("s-react"),
          plan: F.plan ? g("s-plan") : "",
          outcome: F.outcome ? (box.querySelector('input[name="s-out"]:checked') || {}).value || "" : "",
          reopen: false,
        };
        const per = byId(p.id);
        per.events.push(e);
        const si = stageIndexOf(type);
        if (si > 0) per.reached = Math.max(per.reached, si);
        if (type === "esito") per.outcome = e.outcome;
        per.nextDate = g("s-ndate");
        per.nextNote = box.querySelector("#s-nnote").value.trim();
        touch(per);
        save(); closeModal(); render();
        toast(type === "esito" ? `${per.name}: ${outcomeOf(e.outcome).label}` : `${F.title} registrato`);
      });
    });
  }

  function modalConfirm(title, body, label, onYes) {
    openModal(`<h2>${esc(title)}</h2>
      <p class="muted" style="margin-top:8px;font-size:13.5px">${esc(body)}</p>
      <div class="modal-actions" style="margin-top:18px">
        <button class="btn btn-quiet" data-act="close-modal">Annulla</button>
        <button class="btn btn-danger" id="c-yes">${esc(label)}</button>
      </div>`, box => {
      box.querySelector("#c-yes").addEventListener("click", () => { onYes(); closeModal(); render(); });
    });
  }

  /* ══ Toast ════════════════════════════════════════════════════════════ */

  let toastT = null;
  function toast(msg) {
    document.querySelectorAll(".toast").forEach(n => n.remove());
    const n = document.createElement("div");
    n.className = "toast"; n.setAttribute("role", "status"); n.textContent = msg;
    document.body.appendChild(n);
    clearTimeout(toastT);
    toastT = setTimeout(() => n.remove(), 2600);
  }

  /* ══ Backup ═══════════════════════════════════════════════════════════ */

  async function backupFile() {
    const data = JSON.stringify(state, null, 2);
    const name = `lista-nomi-${todayISO()}.json`;
    let dl = null;
    try { dl = window.claude && claude.use ? await claude.use("downloads") : null; } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename: name, data }); markBackup(); render(); toast("Copia salvata"); }
      catch (err) {
        if (err && err.code === "declined") return;
        toast("Non è stato possibile scaricare: copia il testo");
      }
      return;
    }
    try {
      const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
      const a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      markBackup(); render(); toast("Copia salvata");
    } catch (e) { toast("Download non disponibile: copia il testo"); }
  }

  async function copyJSON() {
    const el = document.getElementById("json-out");
    if (!el) return;
    el.select();
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(el.value);
      else document.execCommand("copy");
      markBackup();
      toast("Copiato");
    } catch (e) { toast("Seleziona il testo e copialo a mano"); }
  }

  /* L'unione non toglie niente, quindi si applica e poi si racconta cosa è
     cambiato: chiedere conferma prima costringerebbe a decidere alla cieca. */
  function applyIncoming(d, from) {
    if (!d || !Array.isArray(d.people)) { toast("Non è un backup valido"); return false; }
    const res = mergeStates(state, normalize(d));
    state = res.state;
    /* Aver caricato un archivio da un file dimostra che una copia esiste fuori da
       questo browser: vale come copia salvata, e il promemoria può tacere. */
    markBackup();
    save();
    render();
    reportMerge(res, from);
    return true;
  }

  function reportMerge(res, from) {
    const { nuovi, aggiornati, rimossi } = res.stats;
    const righe = [
      `${state.people.length} nomi in totale`,
      nuovi ? (nuovi === 1 ? "1 nome nuovo arrivato" : `${nuovi} nomi nuovi arrivati`) : "",
      aggiornati ? (aggiornati === 1 ? "1 scheda aggiornata" : `${aggiornati} schede aggiornate`) : "",
      rimossi ? (rimossi === 1 ? "1 cancellazione rispettata" : `${rimossi} cancellazioni rispettate`) : "",
    ].filter(Boolean);
    if (!nuovi && !aggiornati && !rimossi) righe.push("Era già tutto allineato");

    openModal(`<div class="eyebrow">${esc(from || "Unione")}</div>
      <h2>Archivi uniti</h2>
      <ul class="sum">${righe.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
      ${res.dupes.length ? `<div class="banner" style="margin-top:14px"><div>
        <b>${res.dupes.length === 1 ? "Un nome compare due volte" : "Alcuni nomi compaiono due volte"}:</b>
        ${esc(res.dupes.join(", "))}. Succede quando la stessa persona è stata scritta a mano su due
        dispositivi: hanno due schede separate e non le unisco da sola, per non fondere due omonimi.
        Aprine una, copia quello che ti serve e cancella l'altra.</div></div>` : ""}
      <div class="modal-actions" style="margin-top:16px">
        <button class="btn btn-primary" data-act="close-modal">Va bene</button>
      </div>`);
  }

  function importPasted() {
    const el = document.getElementById("json-in");
    const raw = (el && el.value || "").trim();
    if (!raw) { toast("Incolla prima il testo del backup"); return; }
    let d;
    try { d = JSON.parse(raw); } catch (e) { toast("Il testo non è un backup valido"); return; }
    if (applyIncoming(d, "Dal testo incollato")) el.value = "";
  }

  async function importPickedFile(input) {
    const f = input.files && input.files[0];
    if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      applyIncoming(d, f.name);
    } catch (e) { toast("Il file non è un backup valido"); }
    input.value = "";
  }

  /* ══ Esempio ══════════════════════════════════════════════════════════ */

  function demoData() {
    const t = new Date();
    const D = n => iso(addDays(t, -n));
    const P = (name, origine, reached, outcome, evs, nextDate, nextNote) => ({
      id: uid(), name, contact: "", origine, note: "", reached, outcome: outcome || null,
      nextDate: nextDate || "", nextNote: nextNote || "", createdAt: D(40),
      events: [{ id: uid(), type: "lista", date: D(40), note: "", plan: "", outcome: "" },
        ...evs.map(e => ({ id: uid(), plan: "", outcome: "", note: "", ...e }))],
    });
    return {
      v: 1,
      settings: { nome: "", goals: { ...DEFAULT_GOALS } },
      people: [
        P("Marco Rossi", "palestra", 4, "partner", [
          { type: "contatto", date: D(28), note: "Curioso, mi ha chiesto lui cosa faccio" },
          { type: "invito", date: D(24) },
          { type: "piano", date: D(20), plan: "molto", note: "Vuole partire dal consumo personale" },
          { type: "followup", date: D(14), note: "Ha parlato con la moglie" },
          { type: "esito", date: D(11), outcome: "partner", note: "Iscritto, primo ordine fatto" },
        ]),
        P("Giulia Bianchi", "collega di Ale", 4, "cliente", [
          { type: "contatto", date: D(26) },
          { type: "invito", date: D(22), note: "Non le interessa l'attività, solo i prodotti" },
          { type: "piano", date: D(18), plan: "interessato" },
          { type: "followup", date: D(9), note: "Ha provato il Nutrilite" },
          { type: "esito", date: D(6), outcome: "cliente", note: "Ordine mensile" },
        ]),
        P("Anna Ferri", "mamma all'asilo", 4, "cliente", [
          { type: "contatto", date: D(30) },
          { type: "invito", date: D(25) },
          { type: "piano", date: D(21), plan: "interessato", note: "Le interessa la linea casa" },
          { type: "followup", date: D(9), note: "Ha finito il campione" },
          { type: "esito", date: D(0), outcome: "cliente", note: "Primo ordine oggi" },
        ]),
        P("Zio Franco", "famiglia", 3, "non_ora", [
          { type: "contatto", date: D(19) },
          { type: "invito", date: D(16) },
          { type: "piano", date: D(12), plan: "pensarci", note: "Gli piace l'idea ma ha il cantiere aperto" },
          { type: "esito", date: D(10), outcome: "non_ora", note: "Ricontattare a lavori finiti" },
        ], iso(addDays(t, 2)), "Chiamare, dovrebbe aver finito"),
        P("Sara Conti", "corso di inglese", 3, null, [
          { type: "contatto", date: D(15) },
          { type: "invito", date: D(11) },
          { type: "piano", date: D(0), plan: "molto", note: "Ha preso appunti, vuole rivedere i numeri" },
        ], iso(addDays(t, 1)), "Rivedere i numeri con lei"),
        P("Davide Milani", "ex compagno di squadra", 2, null, [
          { type: "contatto", date: D(8) },
          { type: "invito", date: D(0), note: "Ci vediamo giovedì a casa loro" },
        ], iso(addDays(t, 3)), "Piano a casa loro"),
        P("Chiara Fumagalli", "vicina di casa", 1, null, [
          { type: "contatto", date: D(4), note: "Aperta, dice che ha poco tempo" },
        ], iso(addDays(t, -2)), "Richiamare per fissare"),
        P("Elena Sartori", "amica di Giulia", 1, null, [
          { type: "contatto", date: D(0), note: "Le ho raccontato cosa facciamo, incuriosita" },
        ], iso(addDays(t, 2)), "Mandarle il video"),
        P("Paolo Greco", "padel", 1, null, [
          { type: "contatto", date: D(0), note: "Dopo la partita, molto alla mano" },
        ], "", ""),
        P("Luca Perego", "lavoro", 1, "no", [
          { type: "contatto", date: D(21) },
          { type: "esito", date: D(20), outcome: "no", note: "Non è il suo mondo, chiuso senza forzare" },
        ]),
        P("Martina Riva", "ex università", 0, null, [], "", ""),
        P("Simone Ferraro", "vicino di ombrellone", 0, null, [], "", ""),
      ],
    };
  }

  /* ══ Rail ═════════════════════════════════════════════════════════════ */

  function renderRail() {
    const t = todo();
    const dueN = t.late.length + t.now.length;
    const items = [
      { id: "cruscotto", label: "Cruscotto", icon: "◧", tally: dueN ? String(dueN) : "" },
      { id: "nomi", label: "Nomi", icon: "☰", tally: String(state.people.length) },
      { id: "piani", label: "Piani", icon: "◈", tally: String(allPlans().length) },
      { id: "dati", label: "Dati", icon: "⚙", tally: "" },
    ];
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    document.getElementById("rail").innerHTML = `
      <div class="brand"><b>Dalla Lista al Sì</b><span class="eyebrow">il tuo registro</span></div>
      ${items.map(i => `<button class="rail-btn" data-act="nav" data-view="${i.id}"
        ${view === i.id ? 'aria-current="page"' : ""}>
        <span aria-hidden="true" style="font-size:13px;width:14px;text-align:center">${i.icon}</span>
        <span>${i.label}</span>${i.tally ? `<span class="tally">${i.tally}</span>` : ""}</button>`).join("")}
      <div class="rail-foot">
        <button class="btn btn-sm btn-quiet" data-act="theme">${dark ? "☀ Chiaro" : "☾ Scuro"}</button>
        <span class="eyebrow" style="line-height:1.4">I dati restano su questo dispositivo</span>
      </div>`;
  }

  /* ══ Render ═══════════════════════════════════════════════════════════ */

  /* Ridisegnare rifà il contenuto da capo, e un contenuto nuovo riparte dall'alto:
     registrando qualcosa in fondo a una scheda si finiva rispediti all'inizio. Si
     tengono le due posizioni: quella della pagina e quella della scheda, che
     scorre per conto suo. Il cambio di sezione torna in cima dopo, di proposito. */
  function render() {
    const yPagina = window.scrollY;
    const corpo = document.querySelector(".sheet-body");
    const yScheda = corpo ? corpo.scrollTop : 0;

    renderRail();
    const body = view === "nomi" ? viewNomi() : view === "piani" ? viewPiani() : view === "dati" ? viewDati() : viewCruscotto();
    /* Resta il solo avviso che segnala un guasto in corso: il browser che rifiuta
       di salvare. Quello sull'indirizzo temporaneo è stato tolto su richiesta —
       il percorso previsto è il link, dove non si presenta. */
    const banner = (!storageOk && view !== "dati")
      ? `<div class="banner"><div><b>Questo browser non salva i dati.</b>
         Chiudendo la pagina perdi tutto — vai in <b>Dati</b> e salva una copia, o apri l'app da un file sul tuo
         computer.</div></div>` : "";
    document.getElementById("main").innerHTML = `<div class="wrap">${banner}${body}</div>`;
    renderSheet();
    const corpo2 = document.querySelector(".sheet-body");
    if (corpo2 && yScheda) corpo2.scrollTop = yScheda;
    if (yPagina) window.scrollTo(0, yPagina);
    if (view === "nomi") {
      const q = document.getElementById("q");
      if (q && query) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    }
    if (view === "dati") bindDati();
  }

  function bindDati() {
    const fi = document.getElementById("file-in");
    if (fi) fi.addEventListener("change", () => importPickedFile(fi));
    const nome = document.getElementById("s-nome");
    if (nome) nome.addEventListener("change", () => { state.settings.nome = nome.value.trim(); save(); renderRail(); });
    for (const k of Object.keys(DEFAULT_GOALS)) {
      const el = document.getElementById("g-" + k);
      if (el) el.addEventListener("change", () => {
        state.settings.goals[k] = clamp(parseInt(el.value, 10) || 0, 0, 999);
        el.value = state.settings.goals[k]; save();
      });
    }
  }

  /* ══ Eventi ═══════════════════════════════════════════════════════════ */

  document.addEventListener("click", ev => {
    const el = ev.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    const p = el.dataset.id ? byId(el.dataset.id) : null;

    switch (act) {
      case "nav": view = el.dataset.view; query = ""; render(); window.scrollTo(0, 0); break;
      case "filter": filter = el.dataset.f; render(); break;
      case "open": if (p) { openId = p.id; renderSheet(); } break;
      case "close-layer": openId = null; document.getElementById("layer").innerHTML = ""; break;
      case "close-modal": closeModal(); break;
      case "add-one": modalPerson(null); break;
      case "add-bulk": modalBulk(); break;
      case "edit": if (p) modalPerson(p); break;
      case "progress": if (p) modalProgress(p); break;
      case "reopen":
        if (p) {
          p.outcome = null;
          p.events.push({ id: uid(), type: "nota", date: todayISO(), note: "Percorso riaperto", plan: "", outcome: "", reopen: true });
          touch(p); save(); render(); toast("Percorso riaperto");
        }
        break;
      case "save-next": {
        if (!p) break;
        p.nextDate = document.getElementById("np-date").value || "";
        p.nextNote = document.getElementById("np-note").value.trim();
        touch(p); save(); render(); toast("Prossimo passo salvato"); break;
      }
      case "clear-next": if (p) { p.nextDate = ""; p.nextNote = ""; touch(p); save(); render(); } break;
      case "del-event":
        if (p) { p.events = p.events.filter(e => e.id !== el.dataset.eid); recompute(p); touch(p); save(); render(); }
        break;
      case "del-person":
        if (p) modalConfirm(`Eliminare ${p.name}?`, "Sparisce la persona e tutta la sua cronologia. Non si torna indietro.",
          "Elimina", () => {
            state.people = state.people.filter(x => x.id !== p.id);
            state.deleted.push({ id: p.id, at: nowISO() });
            openId = null; save(); toast("Eliminato");
          });
        break;
      case "demo":
        modalConfirm("Caricare i dati di esempio?", "Sostituisce quello che c'è ora con dodici nomi inventati, utili per capire come funziona.",
          "Carica esempio", () => { state = normalize(demoData()); view = "cruscotto"; save(); toast("Esempio caricato"); });
        break;
      case "reset":
        modalConfirm("Cancellare tutto?", "Tutti i nomi e tutta la cronologia. Salva prima una copia se non sei sicuro.",
          "Cancella tutto", () => { state = emptyState(); openId = null; save(); toast("Tutto cancellato"); });
        break;
      case "ics": if (p) scaricaIcs(p); break;
      case "backup-file": backupFile(); break;
      case "copy-json": copyJSON(); break;
      case "import": importPasted(); break;
      case "pick-import": document.getElementById("file-in").click(); break;
      case "snooze-backup":
        state.settings.snoozeBackup = nowISO(); saveLocal(); render();
        toast("Te lo richiedo fra tre giorni"); break;
      case "theme": {
        const root = document.documentElement;
        const cur = root.getAttribute("data-theme");
        const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const next = cur ? (cur === "dark" ? "light" : "dark") : (sysDark ? "light" : "dark");
        root.setAttribute("data-theme", next);
        try { localStorage.setItem(KEY + ".theme", next); } catch (e) {}
        renderRail();
        if (view === "dati") render();
        break;
      }
    }
  });

  document.addEventListener("input", ev => {
    if (ev.target.id === "q") {
      query = ev.target.value;
      const card = document.querySelector("main .card");
      const list = (() => { const saved = view; view = "nomi"; const h = viewNomi(); view = saved; return h; })();
      const tmp = document.createElement("div"); tmp.innerHTML = list;
      const fresh = tmp.querySelector(".card");
      if (card && fresh) card.replaceWith(fresh);
      const chips = tmp.querySelector(".fchips");
      const cur = document.querySelector("main .fchips");
      if (chips && cur) cur.replaceWith(chips);
    }
  });

  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape") {
      if (document.querySelector(".modal-box")) closeModal();
      else if (openId) { openId = null; document.getElementById("layer").innerHTML = ""; }
    }
    if (ev.key === "Enter" || ev.key === " ") {
      const r = ev.target.closest && ev.target.closest('.row[data-act="open"]');
      if (r) { ev.preventDefault(); openId = r.dataset.id; renderSheet(); }
    }
  });

  /* ══ Avvio ════════════════════════════════════════════════════════════ */

  try {
    const th = localStorage.getItem(KEY + ".theme");
    if (th === "dark" || th === "light") document.documentElement.setAttribute("data-theme", th);
  } catch (e) {}

  load();
  render();

  /* Chiede al browser di trattare questi dati come persistenti. Serve contro la
     sparizione involontaria: senza, il browser può buttare i dati dei siti quando
     il dispositivo è a corto di spazio, o dopo mesi di inutilizzo. Contro la
     cancellazione manuale non protegge — niente lo fa — e per questo resta il
     promemoria della copia. Il browser concede o nega da sé, senza chiedere. */
  (async () => {
    try {
      if (!navigator.storage || !navigator.storage.persist) return;
      persistent = await navigator.storage.persisted();
      if (!persistent) persistent = await navigator.storage.persist();
      if (view === "dati") render();
    } catch (e) { /* funzione assente: si continua senza */ }
  })();

})();
</script>
