<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dalla Lista al Sì</title>
<style>
  /* ── Tokens: light is the base set ─────────────────────────────────── */
  :root {
    --ground: #EDF0EC;
    --surface: #FFFFFF;
    --surface-2: #F6F8F5;
    --ink: #131A16;
    --ink-2: #4C5852;
    --ink-3: #66726B;
    --rule: #DBE1DA;
    --rule-soft: #E8ECE6;
    --accent: #1D6A52;
    --accent-ink: #FFFFFF;
    --accent-wash: #E2EDE6;
    --good: #0F7A45;
    --warn: #8A6410;
    --crit: #9E2B25;
    --off: #66726B;
    --focus: #1D6A52;
    --shadow: 0 1px 2px rgba(19, 26, 22, .05), 0 8px 24px rgba(19, 26, 22, .07);

    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

    --r: 8px;
    --gap: 16px;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0E1310;
      --surface: #161D19;
      --surface-2: #1D2621;
      --ink: #E6EBE6;
      --ink-2: #A3AEA7;
      --ink-3: #8A968F;
      --rule: #29332D;
      --rule-soft: #222B26;
      --accent: #63BF9B;
      --accent-ink: #0E1310;
      --accent-wash: #1B2E26;
      --good: #4FB477;
      --warn: #C79A3E;
      --crit: #D9756B;
      --off: #8A968F;
      --focus: #63BF9B;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .45);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --ground: #0E1310;
    --surface: #161D19;
    --surface-2: #1D2621;
    --ink: #E6EBE6;
    --ink-2: #A3AEA7;
    --ink-3: #8A968F;
    --rule: #29332D;
    --rule-soft: #222B26;
    --accent: #63BF9B;
    --accent-ink: #0E1310;
    --accent-wash: #1B2E26;
    --good: #4FB477;
    --warn: #C79A3E;
    --crit: #D9756B;
    --off: #8A968F;
    --focus: #63BF9B;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }

  :root[data-theme="light"] { color-scheme: light; }

  /* ── Base ──────────────────────────────────────────────────────────── */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.015em; text-wrap: balance; }
  h1 { font-size: 25px; }
  h2 { font-size: 17px; }
  h3 { font-size: 15px; }
  p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }

  /* I campi si vestono da soli: appoggiarsi a un contenitore lasciava i campi
     fuori da esso con l'aspetto di default del browser — fondo bianco e sopra
     il testo chiaro del tema scuro, cioè illeggibili. */
  input[type="text"], input[type="search"], input[type="date"], input[type="number"],
  input:not([type]), select, textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    outline: none;
    appearance: none;
    -webkit-appearance: none;
  }
  input[type="date"] { -webkit-appearance: textfield; appearance: auto; }
  select { -webkit-appearance: menulist; appearance: auto; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  ::placeholder { color: var(--ink-3); opacity: 1; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--ink-3);
    font-weight: 500;
  }
  .muted { color: var(--ink-3); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

  /* ── Shell ─────────────────────────────────────────────────────────── */
  .app { display: flex; min-height: 100vh; }

  .rail {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 208px;
    flex: none;
    padding: 22px 14px;
    border-right: 1px solid var(--rule);
    background: var(--surface);
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand { padding: 0 8px 18px; display: flex; flex-direction: column; gap: 2px; }
  .brand b { font-size: 15px; font-weight: 650; letter-spacing: -.02em; }
  .rail-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--ink-2);
    text-align: left;
    cursor: pointer;
    font-size: 14px;
  }
  .rail-btn:hover { background: var(--surface-2); color: var(--ink); }
  .rail-btn[aria-current="page"] { background: var(--accent-wash); color: var(--accent); font-weight: 600; }
  .rail-btn .tally { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 4px; }

  main { flex: 1; min-width: 0; padding: 26px 28px 48px; }
  .wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .page-head .lede { color: var(--ink-2); font-size: 14px; margin-top: 3px; }

  /* ── Cards ─────────────────────────────────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--r);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .cols { display: grid; grid-template-columns: 1.35fr 1fr; gap: var(--gap); align-items: start; }

  /* ── Buttons ───────────────────────────────────────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 8px 13px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  /* Un pulsante che è un collegamento non deve sembrare un collegamento. */
  a.btn { text-decoration: none; }
  .btn:hover { border-color: var(--ink-3); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn-primary:hover { filter: brightness(1.08); border-color: var(--accent); }
  .btn-sm { padding: 5px 10px; font-size: 12.5px; }
  .btn-quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
  .btn-quiet:hover { background: var(--surface-2); border-color: transparent; color: var(--ink); }
  .btn-danger { color: var(--crit); border-color: var(--rule); }
  .btn-danger:hover { border-color: var(--crit); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ── KPI tiles ─────────────────────────────────────────────────────── */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
  .kpi { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 15px; display: flex; flex-direction: column; gap: 9px; }
  .kpi-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .kpi-val { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 30px; line-height: 1; font-weight: 550; letter-spacing: -.03em; }
  .kpi-goal { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .kpi-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; }
  .delta { font-family: var(--mono); font-size: 11px; display: inline-flex; align-items: center; gap: 3px; }
  .delta.up { color: var(--good); }
  .delta.down { color: var(--warn); }
  .delta.flat { color: var(--ink-3); }

  /* ── Bars ──────────────────────────────────────────────────────────── */
  .track { height: 8px; background: var(--rule-soft); border-radius: 4px; overflow: hidden; }
  .track > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
  .track.thin { height: 5px; border-radius: 3px; }
  .track.thin > i { border-radius: 3px; }

  /* ── Funnel ────────────────────────────────────────────────────────── */
  .funnel { display: flex; flex-direction: column; gap: 2px; }
  .fstep { display: flex; flex-direction: column; gap: 5px; padding: 7px 0; }
  .fstep-top { display: flex; align-items: baseline; gap: 8px; }
  .fstep-top .fl { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); }
  .fstep-top .fn { margin-left: auto; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 550; }
  .fstep-top .fhere { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
  .fconv { display: flex; align-items: center; gap: 6px; padding-left: 2px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
  .fconv::before { content: ""; width: 1px; height: 11px; background: var(--rule); }

  /* ── Chips ─────────────────────────────────────────────────────────── */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    background: var(--surface-2);
    font-family: var(--mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink-2);
    white-space: nowrap;
  }
  .chip .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--ink-3); flex: none; }
  .chip.t-accent { color: var(--accent); border-color: var(--accent); background: var(--accent-wash); }
  .chip.t-accent .dot { background: var(--accent); }
  .chip.t-good { color: var(--good); border-color: var(--good); background: transparent; }
  .chip.t-good .dot { background: var(--good); }
  .chip.t-warn { color: var(--warn); border-color: var(--warn); background: transparent; }
  .chip.t-warn .dot { background: var(--warn); }
  .chip.t-crit { color: var(--crit); border-color: var(--crit); background: transparent; }
  .chip.t-crit .dot { background: var(--crit); }
  .chip.t-off { color: var(--off); }

  /* ── Person rows ───────────────────────────────────────────────────── */
  .rows { display: flex; flex-direction: column; }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 4px;
    border-top: 1px solid var(--rule-soft);
    cursor: pointer;
  }
  .rows > .row:first-child { border-top: 0; }
  .row:hover { background: var(--surface-2); }
  .row-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .row-name { font-weight: 550; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-sub { font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-side { display: flex; align-items: center; gap: 8px; flex: none; }
  .stepper { display: flex; gap: 3px; align-items: center; }
  .stepper i { width: 13px; height: 3px; border-radius: 2px; background: var(--rule); display: block; }
  .stepper i.on { background: var(--accent); }
  .due { font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
  .due.late { color: var(--crit); }
  .due.now { color: var(--warn); }

  /* ── Filters / search ──────────────────────────────────────────────── */
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .search { flex: 1; min-width: 180px; display: flex; align-items: center; gap: 8px; padding: 7px 11px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; }
  .search input { border: 0; padding: 0; background: transparent; width: 100%; outline: none; }
  .search input:focus { border: 0; }
  .fchips { display: flex; gap: 6px; flex-wrap: wrap; }
  .fchip {
    padding: 5px 10px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface);
    font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--ink-2); cursor: pointer;
  }
  .fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* ── Table ─────────────────────────────────────────────────────────── */
  .tscroll { overflow-x: auto; margin: 0 -4px; }
  .solo-stretti { display: none; }
  @media (max-width: 560px) {
    .solo-larghi { display: none; }
    .solo-stretti { display: flex; }
  }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 10px; border-top: 1px solid var(--rule-soft); vertical-align: top; }
  thead th { border-top: 0; font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 500; white-space: nowrap; }
  td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  tbody tr:hover { background: var(--surface-2); }

  /* ── Sheet (person detail) ─────────────────────────────────────────── */
  .scrim { position: fixed; inset: 0; background: rgba(10, 16, 13, .42); z-index: 40; }
  .sheet {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 41;
    width: min(460px, 100%);
    background: var(--surface);
    border-left: 1px solid var(--rule);
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
  }
  .sheet-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 10px; }
  .sheet-body { padding: 18px 20px 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
  .sheet-x { position: absolute; top: 14px; right: 14px; }
  .kv { display: grid; grid-template-columns: 92px 1fr; gap: 5px 12px; font-size: 13.5px; }
  .kv dt { color: var(--ink-3); font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
  .kv dd { margin: 0; }

  .stage-path { display: flex; flex-direction: column; gap: 0; }
  .sp-item { display: grid; grid-template-columns: 22px 1fr; gap: 10px; }
  .sp-mark { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .sp-dot { width: 9px; height: 9px; border-radius: 999px; border: 1.5px solid var(--rule); background: var(--surface); margin-top: 5px; flex: none; }
  .sp-item.done .sp-dot { background: var(--accent); border-color: var(--accent); }
  .sp-item.cur .sp-dot { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
  .sp-line { flex: 1; width: 1.5px; background: var(--rule); min-height: 14px; }
  .sp-item.done .sp-line { background: var(--accent); }
  .sp-body { padding-bottom: 12px; display: flex; flex-direction: column; gap: 3px; }
  .sp-label { font-size: 13.5px; font-weight: 500; }
  .sp-item:not(.done):not(.cur) .sp-label { color: var(--ink-3); font-weight: 400; }
  .sp-when { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .sp-note { font-size: 13px; color: var(--ink-2); }

  .next-box { background: var(--surface-2); border: 1px solid var(--rule); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 9px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > label { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
  .field textarea { min-height: 68px; resize: vertical; font-size: 14px; }
  .field-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* ── Modal ─────────────────────────────────────────────────────────── */
  .modal-scrim { z-index: 45; }
  .modal-box {
    position: fixed; z-index: 46; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(520px, calc(100% - 24px));
    max-height: calc(100vh - 40px); overflow-y: auto;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
    box-shadow: var(--shadow); padding: 20px;
  }
  .modal-box h2 { margin-bottom: 2px; }
  .modal-form { display: flex; flex-direction: column; gap: 13px; margin-top: 14px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; flex-wrap: wrap; }

  /* Scelta del passo: righe cliccabili, quella consigliata bordata d'accento. */
  .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .choice {
    display: flex; flex-direction: column; gap: 3px; align-items: flex-start; text-align: left;
    padding: 11px 13px; border: 1px solid var(--rule); border-radius: 7px;
    background: var(--surface); cursor: pointer; width: 100%;
  }
  .choice:hover { border-color: var(--accent); background: var(--surface-2); }
  .choice[data-suggested] { border-color: var(--accent); background: var(--accent-wash); }
  .choice-t { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 550; font-size: 14.5px; }
  .choice-d { font-size: 12.5px; color: var(--ink-3); }

  /* Scelta secca fra poche risposte: pastiglie, non un menù a tendina. */
  .opts { display: flex; flex-wrap: wrap; gap: 7px; }
  .opts input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .opts label {
    padding: 7px 13px; border: 1px solid var(--rule); border-radius: 999px;
    background: var(--surface); cursor: pointer; font-size: 13.5px;
  }
  .opts label:hover { border-color: var(--ink-3); }
  .opts input:checked + label { border-color: var(--accent); background: var(--accent-wash); color: var(--accent); font-weight: 600; }
  .opts input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ── Misc ──────────────────────────────────────────────────────────── */
  .empty { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; padding: 8px 0; }
  .empty p { color: var(--ink-2); max-width: 52ch; }
  .banner {
    display: flex; gap: 10px; align-items: flex-start;
    border: 1px solid var(--warn); border-radius: var(--r);
    background: var(--surface); padding: 12px 14px; font-size: 13.5px; color: var(--ink-2);
  }
  .banner b { color: var(--ink); }
  .toast {
    position: fixed; z-index: 60; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--ink); color: var(--ground); padding: 9px 16px; border-radius: 999px;
    font-size: 13.5px; box-shadow: var(--shadow);
  }
  .grp-label { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .grp-label::after { content: ""; flex: 1; height: 1px; background: var(--rule-soft); }
  .outcomes { display: flex; flex-direction: column; gap: 11px; }
  .orow { display: flex; flex-direction: column; gap: 5px; }
  .orow-top { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; }
  .orow-top .on { margin-left: auto; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  /* Un suggerimento, non un allarme: prende i colori dell'accento come le altre
     cose consigliate dell'app, non quelli dell'avviso. */
  .nudge {
    border: 1px solid var(--accent); background: var(--accent-wash);
    border-radius: var(--r); padding: 14px 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .nudge-t { font-weight: 600; font-size: 14.5px; }
  .nudge-d { font-size: 13px; color: var(--ink-2); max-width: 62ch; }

  .sum { margin: 12px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
  .fold { border-top: 1px solid var(--rule-soft); padding-top: 12px; }
  .fold > summary { cursor: pointer; font-size: 13.5px; color: var(--ink-2); width: fit-content; }
  .fold > summary:hover { color: var(--ink); }
  .fold-body { display: flex; flex-direction: column; gap: 11px; padding-top: 12px; }
  .backup-json { width: 100%; min-height: 110px; font-family: var(--mono); font-size: 11px; padding: 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface-2); resize: vertical; }

  @media (prefers-reduced-motion: no-preference) {
    .btn, .row, .rail-btn { transition: background-color .12s ease, border-color .12s ease, color .12s ease; }
  }

  /* ── Narrow ────────────────────────────────────────────────────────── */
  @media (max-width: 900px) {
    .app { flex-direction: column; }
    .rail {
      position: fixed; bottom: 0; left: 0; right: 0; top: auto;
      width: auto; height: auto; flex-direction: row; gap: 2px;
      padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
      border-right: 0; border-top: 1px solid var(--rule);
      z-index: 30;
    }
    .brand, .rail-foot { display: none; }
    .rail-btn { flex: 1; flex-direction: column; gap: 3px; justify-content: center; font-size: 11px; padding: 6px 2px; }
    .rail-btn .tally { display: none; }
    main { padding: 20px 16px 92px; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .cols { grid-template-columns: 1fr; }
    h1 { font-size: 22px; }
    .sheet { width: 100%; border-left: 0; }
  }
  /* Su uno schermo di telefono nome e informazioni di stato non stanno sulla
     stessa riga: il nome si strozza e la pastiglia della fase finisce fuori
     schermo. Vanno a capo. Le tacche di avanzamento spariscono: sono un doppione
     della pastiglia, che dice la fase a parole. */
  @media (max-width: 560px) {
    .row { flex-wrap: wrap; gap: 6px 10px; }
    .row-main { flex: 1 1 100%; }
    .row-side { width: 100%; justify-content: flex-start; flex-wrap: wrap; row-gap: 6px; }
    .stepper { display: none; }
    .fstep-top { flex-wrap: wrap; }
    .fstep-top .fn { margin-left: auto; }

    /* Un dito non è un puntatore: sotto i 44px si sbaglia bersaglio, e qui si
       sbaglia su cose come «Elimina». Tutto ciò che si tocca cresce. */
    /* Titolo e indicazione si spezzavano male l'uno accanto all'altro: impilati
       si leggono, e l'indicazione resta legata al titolo che qualifica. */
    .card > header { flex-direction: column; align-items: flex-start; gap: 3px; }

    .btn { min-height: 44px; padding: 10px 16px; }
    .btn-sm { min-height: 40px; padding: 8px 14px; font-size: 13.5px; }
    .fchip { min-height: 40px; padding: 9px 14px; display: inline-flex; align-items: center; }
    .opts label { min-height: 44px; padding: 11px 16px; display: inline-flex; align-items: center; }
    .choice { padding: 14px; }
    .fold > summary { min-height: 40px; display: flex; align-items: center; }
    /* La riga della cronologia ha un ✕ che cancella: va preso solo di proposito,
       quindi grande da colpire ma visivamente discreto. */
    .row .btn-sm { min-width: 44px; justify-content: center; }
    .sheet-body, .sheet-head { padding-left: 16px; padding-right: 16px; }

    /* Le finestre diventano fogli ancorati in basso: dove arriva il pollice, e
       dove la tastiera non le spinge fuori schermo. */
    .modal-box {
      top: auto; bottom: 0; left: 0; right: 0;
      transform: none; width: auto;
      max-height: 88vh;
      border-radius: 14px 14px 0 0;
      border-bottom: 0;
      padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
    }
    .modal-actions { flex-direction: column-reverse; align-items: stretch; gap: 10px; }
    .modal-actions .btn { width: 100%; }
  }

  @media (max-width: 440px) {
    .field-2 { grid-template-columns: 1fr; }
  }

<div id="layer"></div>

<script>
(() => {
  "use strict";

  /* ══ Modello ══════════════════════════════════════════════════════════ */

  const STAGES = [
    { id: "lista",    label: "In lista",    action: null },
    { id: "contatto", label: "Contattato",  action: "Registra contatto" },
    { id: "invito",   label: "Invitato",    action: "Registra invito" },
    { id: "piano",    label: "Piano fatto", action: "Registra piano" },
    { id: "followup", label: "Follow-up",   action: "Registra follow-up" },
  ];
  const FUNNEL_LABELS = ["In lista", "Contattati", "Invitati", "Piano fatto", "Follow-up", "Chiusi"];

  const OUTCOMES = [
    { id: "partner", label: "Partner",  tone: "good", positive: true },
    { id: "cliente", label: "Cliente",  tone: "good", positive: true },
    { id: "non_ora", label: "Non ora",  tone: "warn", positive: false },
    { id: "no",      label: "No",       tone: "crit", positive: false },
  ];

  const PLAN_RESULTS = [
    { id: "molto",       label: "Molto interessato" },
    { id: "interessato", label: "Interessato" },
    { id: "pensarci",    label: "Deve pensarci" },
    { id: "freddo",      label: "Poco interessato" },
    { id: "assente",     label: "Non si è presentato" },
  ];

  const EVENT_TYPES = [
    { id: "contatto", label: "Contatto" },
    { id: "invito",   label: "Invito" },
    { id: "piano",    label: "Piano" },
    { id: "followup", label: "Follow-up" },
    { id: "nota",     label: "Nota" },
    { id: "esito",    label: "Chiusura" },
    { id: "lista",    label: "Inserito in lista" },
  ];

  /* Ogni passo ha la sua finestra, con le domande che hanno senso per quel passo
     e non per gli altri: "dove hai fatto il piano" non serve a una nota, "ha
     accettato?" non serve a una chiusura. `how` e `react` sono le due domande
     ricorrenti — con che mezzo, e come è andata — riempite con parole diverse. */
  const FORMS = {
    contatto: {
      title: "Contatto", lead: "Ti sei fatto sentire.",
      how: { label: "Come l'hai contattato", opts: ["Telefono", "Messaggio", "Di persona", "Social"] },
      react: { label: "Come ha reagito", opts: ["Aperto, incuriosito", "Gentile ma tiepido", "Dice che ha poco tempo", "Non ha risposto"] },
      noteLabel: "Cosa vi siete detti",
      nextLabel: "Quando ci ritorni sopra",
    },
    invito: {
      title: "Invito", lead: "Gli hai proposto di vedere il piano.",
      how: { label: "A cosa l'hai invitato", opts: ["Piano a casa", "Videochiamata", "Uno-a-uno, al bar", "Evento"] },
      react: { label: "Ha accettato?", opts: ["Sì, appuntamento fissato", "Deve confermare", "Ha rimandato", "No"] },
      noteLabel: "Note sull'invito",
      nextLabel: "Data dell'appuntamento",
      nextHint: "Se avete fissato, mettila qui: te la ritrovi nel «Da fare».",
    },
    piano: {
      title: "Piano", lead: "Gli hai mostrato il piano.",
      how: { label: "Dove", opts: ["A casa sua", "A casa mia", "Videochiamata", "Al bar", "Evento"] },
      plan: true,
      noteLabel: "Cosa l'ha colpito, che obiezioni ha fatto",
      nextLabel: "Quando lo risenti",
    },
    followup: {
      title: "Follow-up", lead: "Ci sei tornato sopra dopo il piano.",
      how: { label: "Come", opts: ["Telefono", "Messaggio", "Di persona", "Videochiamata"] },
      react: { label: "Dove siamo", opts: ["Vuole partire", "Ha ancora dubbi", "Deve parlarne in famiglia", "Ha rimandato", "Non ha risposto"] },
      noteLabel: "Cosa vi siete detti",
      nextLabel: "Quando lo risenti",
    },
    esito: {
      title: "Chiusura", lead: "Il percorso arriva a una risposta.",
      outcome: true,
      noteLabel: "Com'è andata",
      nextLabel: "Prossimo passo",
    },
    nota: {
      title: "Nota", lead: "Qualcosa da ricordare, senza cambiare fase.",
      noteLabel: "Nota",
      nextLabel: "Prossimo passo",
    },
  };

  /* La chiusura è l'unico passo in cui la scelta cambia le domande che seguono:
     a un «non ora» serve sapere quando riprovare, a un «no» il perché. */
  const CLOSE_COPY = {
    partner: { note: "Come è andata la chiusura", next: "Primo passo insieme", hint: "Primo ordine, presentazione al gruppo…" },
    cliente: { note: "Cosa gli serve, cosa ha ordinato", next: "Quando risentirlo", hint: "Di solito quando finisce il prodotto." },
    non_ora: { note: "Perché non è il momento", next: "Quando riprovare", hint: "Mettila: è l'unica cosa che ti fa tornare da lui." },
    no: { note: "Perché ha detto no", next: "Prossimo passo", hint: "Puoi lasciarlo vuoto." },
  };

  const DEFAULT_GOALS = { contatto: 10, invito: 6, piano: 3, chiusura: 1 };
  const KEY = "dalla-lista-al-si.v1";

  const emptyState = () => ({ v: 1, people: [], deleted: [], settings: { nome: "", goals: { ...DEFAULT_GOALS }, lastBackup: "", snoozeBackup: "" } });

  let state = emptyState();
  let view = "cruscotto";
  let persistent = null;
  let filter = "tutti";
  let query = "";
  let openId = null;
  let storageOk = true;

  /* ══ Persistenza ══════════════════════════════════════════════════════ */

  function load() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); }
    catch (e) { storageOk = false; return; }
    if (!raw) return;
    try {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.people)) state = normalize(d);
    } catch (e) { /* dato illeggibile: si riparte vuoti, il backup resta l'unica via */ }
  }

  function saveLocal() {
    if (!storageOk) return;
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { storageOk = false; render(); }
  }

  const save = saveLocal;


  function normalize(d) {
    const s = d.settings || {};
    /* Le pietre tombali tengono memoria delle persone cancellate: senza di loro
       l'unione con l'archivio dell'altro dispositivo le farebbe tornare in vita. */
    const cutoff = new Date(Date.now() - 180 * 86400000).toISOString();
    return {
      v: 1,
      deleted: (Array.isArray(d.deleted) ? d.deleted : [])
        .filter(x => x && x.id && (x.at || "") > cutoff)
        .map(x => ({ id: x.id, at: x.at })),
      people: d.people.map(p => ({
        updatedAt: p.updatedAt || nowISO(),
        id: p.id || uid(),
        name: String(p.name || "").trim() || "Senza nome",
        contact: p.contact || "",
        origine: p.origine || "",
        note: p.note || "",
        reached: clamp(Number(p.reached) || 0, 0, 4),
        outcome: OUTCOMES.some(o => o.id === p.outcome) ? p.outcome : null,
        nextDate: p.nextDate || "",
        nextNote: p.nextNote || "",
        createdAt: p.createdAt || todayISO(),
        events: Array.isArray(p.events) ? p.events.map(e => ({
          id: e.id || uid(),
          type: EVENT_TYPES.some(t => t.id === e.type) ? e.type : "nota",
          date: e.date || todayISO(),
          note: e.note || "",
          plan: e.plan || "",
          outcome: e.outcome || "",
          how: e.how || "",
          react: e.react || "",
          reopen: !!e.reopen,
        })) : [],
      })),
      settings: {
        nome: s.nome || "",
        goals: { ...DEFAULT_GOALS, ...(s.goals || {}) },
        lastBackup: s.lastBackup || "",
        snoozeBackup: s.snoozeBackup || "",
      },
    };
  }

  /* ══ Unione di due archivi ════════════════════════════════════════════

     Sostituire distrugge: se importi il telefono sul Mac perdi il lavoro fatto
     sul Mac. Qui invece i due archivi si sommano. I passi registrati sono
     aggiunte con un identificativo proprio, quindi si uniscono senza conflitto;
     sui dati della scheda (nome, note, prossimo passo) vince chi è stato
     modificato più tardi; la fase e l'esito si ricavano dai passi uniti, così il
     risultato è lo stesso da qualunque parte si faccia l'unione.            */

  function mergeStates(local, incoming) {
    const tombs = new Map();
    for (const t of [...(local.deleted || []), ...(incoming.deleted || [])]) {
      if (!tombs.has(t.id) || t.at > tombs.get(t.id)) tombs.set(t.id, t.at);
    }

    const pairs = new Map();
    for (const p of local.people) pairs.set(p.id, { a: p });
    for (const p of incoming.people) pairs.set(p.id, { ...(pairs.get(p.id) || {}), b: p });

    const people = [];
    const stats = { nuovi: 0, aggiornati: 0, rimossi: 0 };

    for (const [id, { a, b }] of pairs) {
      const winner = !a ? b : !b ? a : ((b.updatedAt || "") > (a.updatedAt || "") ? b : a);
      const tomb = tombs.get(id);
      if (tomb && tomb > (winner.updatedAt || "")) { stats.rimossi++; continue; }

      if (!a || !b) {
        people.push(winner);
        if (!a) stats.nuovi++;
        continue;
      }

      const loser = winner === b ? a : b;
      const evs = new Map();
      for (const e of [...loser.events, ...winner.events]) evs.set(e.id, e);
      const merged = {
        ...winner,
        events: [...evs.values()].sort((x, y) => (x.date < y.date ? -1 : x.date > y.date ? 1 : 0)),
      };
      recompute(merged);
      people.push(merged);
      if (winner === b || merged.events.length !== a.events.length) stats.aggiornati++;
    }

    /* Lo stesso nome inserito a mano su due dispositivi ha due identificativi
       diversi: unirli d'ufficio rischierebbe di fondere due persone omonime, per
       cui li segnalo e lascio decidere. */
    const seen = new Set(), dupes = [];
    for (const p of people) {
      const k = p.name.trim().toLowerCase();
      if (seen.has(k)) { if (!dupes.includes(p.name)) dupes.push(p.name); } else seen.add(k);
    }

    return {
      state: {
        v: 1,
        people,
        deleted: [...tombs].map(([id, at]) => ({ id, at })),
        settings: local.settings,
      },
      stats, dupes,
    };
  }

  /* ══ Utilità ══════════════════════════════════════════════════════════ */

  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  /* Una sola fonte dell'ora, così i timestamp scritti e i confronti fra date
     leggono sempre lo stesso orologio. */
  const nowISO = () => new Date(Date.now()).toISOString();
  const touch = p => { if (p) p.updatedAt = nowISO(); };
  const daysSince = stamp => stamp ? Math.floor((Date.now() - new Date(stamp).getTime()) / 86400000) : null;

  /* Il browser è una memoria buona per l'uso quotidiano ma non è un backup: chi
     svuota i dati di navigazione perde la lista, e non c'è niente da cui
     recuperarla. Il promemoria sposta questa disciplina dalla buona volontà
     dell'utente all'app. Tace quando c'è un file collegato che scrive bene: quel
     file è già una copia fuori dal browser. */
  function backupNudge() {
    if (!state.people.length) return null;
    const snooze = daysSince(state.settings.snoozeBackup);
    if (snooze !== null && snooze < 3) return null;
    const age = daysSince(state.settings.lastBackup);
    if (age === null) return state.people.length >= 3 ? { mai: true } : null;
    return age >= 14 ? { giorni: age } : null;
  }

  function markBackup() {
    state.settings.lastBackup = nowISO();
    state.settings.snoozeBackup = "";
    saveLocal();
  }
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  const parseISO = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);

  function mondayOf(d) {
    const x = new Date(d);
    const wd = (x.getDay() + 6) % 7;
    x.setDate(x.getDate() - wd);
    x.setHours(0, 0, 0, 0);
    return x;
  }

  const fmtDay = new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "short" });
  const fmtLong = new Intl.DateTimeFormat("it-IT", { weekday: "long", day: "numeric", month: "long" });
  const dshort = s => (s ? fmtDay.format(parseISO(s)) : "—");

  function relDue(s) {
    if (!s) return null;
    const n = daysBetween(todayISO(), s);
    if (n < 0) return { cls: "late", text: n === -1 ? "ieri" : `${-n} gg in ritardo` };
    if (n === 0) return { cls: "now", text: "oggi" };
    if (n === 1) return { cls: "now", text: "domani" };
    return { cls: "", text: `fra ${n} gg` };
  }

  const stageLabel = p => (p.outcome ? outcomeOf(p.outcome).label : STAGES[p.reached].label);
  const outcomeOf = id => OUTCOMES.find(o => o.id === id) || OUTCOMES[3];
  const planLabel = id => (PLAN_RESULTS.find(r => r.id === id) || {}).label || "";
  const typeLabel = id => (EVENT_TYPES.find(t => t.id === id) || {}).label || id;
  const eventDetail = e => [e.how, e.react].filter(Boolean).join(" · ");
  const isOpen = p => !p.outcome;
  const stageIndexOf = type => STAGES.findIndex(s => s.id === type);
  const byId = id => state.people.find(p => p.id === id);
  const lastTouch = p => p.events.reduce((m, e) => (e.date > m ? e.date : m), p.createdAt);

  /* La fase raggiunta e l'esito vivono nella cronologia: dopo aver cancellato un
     evento vanno ricavati di nuovo da lì, altrimenti la persona resta a una fase
     che non ha più nessun passo a sostenerla. */
  function recompute(p) {
    let reached = 0, outcome = null, mark = null;
    for (const e of p.events) {
      const i = stageIndexOf(e.type);
      if (i > 0) reached = Math.max(reached, i);
      if (e.type === "esito" || e.reopen) {
        if (mark === null || e.date >= mark) { mark = e.date; outcome = e.reopen ? null : (e.outcome || null); }
      }
    }
    p.reached = reached;
    p.outcome = OUTCOMES.some(o => o.id === outcome) ? outcome : null;
  }

  function personTone(p) {
    if (!p.outcome) return "accent";
    return outcomeOf(p.outcome).tone;
  }

  /* ══ Conteggi ═════════════════════════════════════════════════════════ */

  function eventsIn(type, fromISO, toISO) {
    let n = 0;
    for (const p of state.people) for (const e of p.events) {
      if (e.date < fromISO || e.date > toISO) continue;
      if (type === "chiusura") {
        if (e.type === "esito" && OUTCOMES.some(o => o.id === e.outcome && o.positive)) n++;
      } else if (e.type === type) n++;
    }
    return n;
  }

  function weeklySeries(type, weeks) {
    const out = [];
    const thisMon = mondayOf(new Date());
    for (let i = weeks - 1; i >= 0; i--) {
      const from = addDays(thisMon, -7 * i);
      out.push(eventsIn(type, iso(from), iso(addDays(from, 6))));
    }
    return out;
  }

  function funnelCounts() {
    const c = [0, 0, 0, 0, 0, 0];
    for (const p of state.people) {
      for (let i = 0; i <= p.reached; i++) c[i]++;
      if (p.outcome && outcomeOf(p.outcome).positive) c[5]++;
    }
    return c;
  }

  function occupancy() {
    const o = [0, 0, 0, 0, 0];
    for (const p of state.people) if (isOpen(p)) o[p.reached]++;
    return o;
  }

  function allPlans() {
    const out = [];
    for (const p of state.people) for (const e of p.events) if (e.type === "piano") out.push({ e, p });
    return out.sort((a, b) => (a.e.date < b.e.date ? 1 : a.e.date > b.e.date ? -1 : 0));
  }

  function todo() {
    const t = todayISO(), limit = iso(addDays(new Date(), 4));
    const late = [], now = [], soon = [], stale = [];
    for (const p of state.people) {
      if (!isOpen(p) && p.outcome !== "non_ora") continue;
      if (p.nextDate) {
        if (p.nextDate < t) late.push(p);
        else if (p.nextDate === t) now.push(p);
        else if (p.nextDate <= limit) soon.push(p);
      } else if (isOpen(p) && p.reached >= 1 && daysBetween(lastTouch(p), t) >= 14) {
        stale.push(p);
      }
    }
    const byDate = (a, b) => (a.nextDate < b.nextDate ? -1 : a.nextDate > b.nextDate ? 1 : 0);
    return { late: late.sort(byDate), now, soon: soon.sort(byDate), stale: stale.sort((a, b) => (lastTouch(a) < lastTouch(b) ? -1 : 1)) };
  }

  /* ══ Frammenti ════════════════════════════════════════════════════════ */

  function chip(label, tone) {
    return `<span class="chip t-${tone}"><i class="dot"></i>${esc(label)}</span>`;
  }

  function stepper(p) {
    let h = '<span class="stepper" aria-hidden="true">';
    for (let i = 0; i < 5; i++) h += `<i class="${i <= p.reached ? "on" : ""}"></i>`;
    return h + "</span>";
  }

  function sparkline(values, goal) {
    const W = 6, G = 3, H = 22;
    const max = Math.max(1, ...values, goal || 0);
    const w = values.length * (W + G) - G;
    let bars = "";
    values.forEach((v, i) => {
      const h = Math.max(v > 0 ? 2 : 1, Math.round((v / max) * H));
      const last = i === values.length - 1;
      bars += `<rect x="${i * (W + G)}" y="${H - h}" width="${W}" height="${h}" rx="1.5"
        fill="${v > 0 ? "var(--accent)" : "var(--rule)"}" opacity="${last ? 1 : v > 0 ? .34 : 1}"></rect>`;
    });
    let gl = "";
    if (goal > 0) {
      const y = H - (goal / max) * H;
      gl = `<line x1="0" y1="${y.toFixed(1)}" x2="${w}" y2="${y.toFixed(1)}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="2 2" opacity=".6"></line>`;
    }
    return `<svg width="${w}" height="${H}" viewBox="0 0 ${w} ${H}" role="img"
      aria-label="Ultime ${values.length} settimane: ${values.join(", ")}">${gl}${bars}</svg>`;
  }

  function kpiTile(key, title, goal) {
    const mon = mondayOf(new Date());
    const wk = eventsIn(key, iso(mon), iso(addDays(mon, 6)));
    const prev = eventsIn(key, iso(addDays(mon, -7)), iso(addDays(mon, -1)));
    const m0 = new Date(); m0.setDate(1);
    const month = eventsIn(key, iso(m0), todayISO());
    const d = wk - prev;
    const dcls = d > 0 ? "up" : d < 0 ? "down" : "flat";
    const dtxt = d === 0 ? "= sett. scorsa" : `${d > 0 ? "+" : "−"}${Math.abs(d)} vs sett. scorsa`;
    const pct = goal > 0 ? clamp(Math.round((wk / goal) * 100), 0, 100) : 0;
    return `<div class="kpi">
      <div class="kpi-top">
        <div><div class="eyebrow">${esc(title)}</div><div class="kpi-val">${wk}</div></div>
        ${sparkline(weeklySeries(key, 8), goal)}
      </div>
      ${goal > 0 ? `<div><div class="track thin"><i style="width:${pct}%"></i></div>
        <div class="kpi-goal" style="margin-top:5px">obiettivo ${goal} · ${pct}%</div></div>` : ""}
      <div class="kpi-foot">
        <span class="delta ${dcls}">${esc(dtxt)}</span>
        <span class="muted num">${month} nel mese</span>
      </div>
    </div>`;
  }

  function personRow(p) {
    const due = relDue(p.nextDate);
    const sub = [];
    if (p.origine) sub.push(p.origine);
    if (p.nextNote) sub.push(p.nextNote);
    else if (p.contact) sub.push(p.contact);
    return `<div class="row" data-act="open" data-id="${p.id}" tabindex="0" role="button">
      <div class="row-main">
        <span class="row-name">${esc(p.name)}</span>
        <span class="row-sub">${esc(sub.join(" · ") || "—")}</span>
      </div>
      <div class="row-side">
        ${due ? `<span class="due ${due.cls}">${esc(due.text)}</span>` : ""}
        ${p.outcome ? chip(outcomeOf(p.outcome).label, outcomeOf(p.outcome).tone) : stepper(p)}
        ${p.outcome ? "" : `<span class="chip">${esc(STAGES[p.reached].label)}</span>`}
      </div>
    </div>`;
  }

  /* ══ Vista: Cruscotto ═════════════════════════════════════════════════ */

  function viewCruscotto() {
    const g = state.settings.goals;
    const nome = state.settings.nome.trim();
    const head = `<div class="page-head">
      <div>
        <h1>${nome ? `Ciao ${esc(nome.split(" ")[0])}` : "Cruscotto"}</h1>

      </div>
      <div class="btn-row">
        <button class="btn" data-act="add-one">+ Un nome</button>
        <button class="btn btn-primary" data-act="add-bulk">Aggiungi lista nomi</button>
      </div>
    </div>`;

    if (!state.people.length) {
      return head + `<div class="card">
        <div class="empty">
          <div class="eyebrow">Si parte da qui</div>
          <h2>Scrivi la tua lista nomi</h2>
          <p>Butta dentro tutti i nomi che ti vengono in mente, senza filtrare e senza decidere niente su di loro.
             Poi ogni nome cammina da solo: contatto, invito, piano, follow-up, esito.</p>
          <div class="btn-row">
            <button class="btn btn-primary" data-act="add-bulk">Scrivi la lista</button>
            <button class="btn" data-act="demo">Guarda un esempio</button>
          </div>
        </div>
      </div>`;

    const nudge = backupNudge();
    const promemoria = nudge ? `<div class="nudge">
      <div class="nudge-t">
        ${nudge.mai
          ? "Non hai ancora salvato una copia dei tuoi dati."
          : `Ultima copia salvata ${nudge.giorni} giorni fa.`}
      </div>
      <p class="nudge-d">La lista vive solo nella memoria di questo browser. Se lo pulisci o cambi dispositivo,
        senza una copia non c'è niente da cui recuperarla.</p>
      <div class="btn-row">
        <button class="btn btn-sm btn-primary" data-act="backup-file">Salva una copia</button>
        <button class="btn btn-sm btn-quiet" data-act="snooze-backup">Più tardi</button>
      </div>
    </div>` : "";

    const kpis = promemoria + `<div class="kpis">

    return head + kpis + `<div class="cols">${cardTodo()}${cardFunnel()}</div>

  function cardTodo() {
    const t = todo();
    const total = t.late.length + t.now.length + t.soon.length;
    const group = (label, list) => list.length
      ? `<div class="grp-label"><span class="eyebrow">${esc(label)}</span></div>
         <div class="rows">${list.map(personRow).join("")}</div>` : "";
    const body = total + t.stale.length === 0
      ? `<div class="empty"><p class="muted">Niente in scadenza. Quando registri un passo, imposta il prossimo:
           è quello che tiene in movimento la lista.</p></div>`
      : group("In ritardo", t.late) + group("Oggi", t.now) + group("Prossimi giorni", t.soon)
        + group("Fermi da due settimane", t.stale);
    return `<section class="card">
      <header><h2>Da fare</h2><span class="eyebrow">${total} in scadenza</span></header>
      ${body}
    </section>`;
  }

  function cardFunnel() {
    const c = funnelCounts(), occ = occupancy();
    const max = Math.max(1, c[0]);
    let rows = "";
    for (let i = 0; i < 6; i++) {
      if (i > 0) {
        const prev = c[i - 1];
        const pct = prev > 0 ? Math.round((c[i] / prev) * 100) : 0;
        rows += `<div class="fconv">${prev > 0 ? `↓ ${pct}% · ${c[i]} su ${prev}` : "—"}</div>`;
      }
      rows += `<div class="fstep">
        <div class="fstep-top">
          <span class="fl">${esc(FUNNEL_LABELS[i])}</span>
          ${i < 5 && occ[i] ? `<span class="fhere">ora qui: ${occ[i]}</span>` : ""}
          <span class="fn">${c[i]}</span>
        </div>
        <div class="track"><i style="width:${Math.round((c[i] / max) * 100)}%;${i === 5 ? "background:var(--good)" : ""}"></i></div>
      </div>`;
    }
    return `<section class="card">
      <header><h2>Imbuto</h2><span class="eyebrow">quanti sono arrivati fin qui</span></header>
      <div class="funnel">${rows}</div>
    </section>`;
  }

  function cardOutcomes() {
    const closed = state.people.filter(p => p.outcome);
    const tot = closed.length;
    const rows = OUTCOMES.map(o => {
      const n = closed.filter(p => p.outcome === o.id).length;
      const pct = tot ? Math.round((n / tot) * 100) : 0;
      return `<div class="orow">
        <div class="orow-top">${chip(o.label, o.tone)}<span class="on">${n}${tot ? ` · ${pct}%` : ""}</span></div>
        <div class="track thin"><i style="width:${pct}%;background:var(--${o.tone === "off" ? "off" : o.tone})"></i></div>
      </div>`;
    }).join("");
    const reachedPlan = state.people.filter(p => p.reached >= 3).length;
    const won = closed.filter(p => outcomeOf(p.outcome).positive).length;
    return `<section class="card">
      <header><h2>Come sono andate le chiusure</h2><span class="eyebrow">${tot} chiusi</span></header>
      ${tot ? `<div class="outcomes">${rows}</div>` : `<p class="muted">Ancora nessuna chiusura registrata.</p>`}
      ${reachedPlan ? `<p class="muted" style="font-size:13px">Su ${reachedPlan} person${reachedPlan === 1 ? "a a cui hai fatto" : "e a cui hai fatto"} il piano,
        ${won} ${won === 1 ? "ha" : "hanno"} detto sì — ${Math.round((won / reachedPlan) * 100)}%.</p>` : ""}
    </section>`;
  }

  function cardRecentPlans() {
    const plans = allPlans().slice(0, 5);
    return `<section class="card">
      <header><h2>Ultimi piani</h2>${plans.length ? `<button class="btn btn-sm btn-quiet" data-act="nav" data-view="piani">Tutti</button>` : ""}</header>

        <div class="row" data-act="open" data-id="${p.id}" tabindex="0" role="button">
          <div class="row-main">
            <span class="row-name">${esc(p.name)}</span>
            <span class="row-sub">${esc(e.note || planLabel(e.plan) || "—")}</span>

  /* ══ Vista: Nomi ══════════════════════════════════════════════════════ */

  function viewNomi() {
    const filters = [
      { id: "tutti", label: `Tutti ${state.people.length}` },
      ...STAGES.map((s, i) => ({ id: s.id, label: `${s.label} ${state.people.filter(p => isOpen(p) && p.reached === i).length}` })),
      { id: "chiusi", label: `Chiusi ${state.people.filter(p => p.outcome).length}` },
      { id: "riprendere", label: `Da riprendere ${state.people.filter(p => p.outcome === "non_ora").length}` },
    ];

    let list = state.people.slice();
    if (filter === "chiusi") list = list.filter(p => p.outcome);
    else if (filter === "riprendere") list = list.filter(p => p.outcome === "non_ora");
    else if (filter !== "tutti") {
      const i = stageIndexOf(filter);
      list = list.filter(p => isOpen(p) && p.reached === i);
    }
    if (query.trim()) {
      const q = query.trim().toLowerCase();
      list = list.filter(p => [p.name, p.contact, p.origine, p.note, p.nextNote].join(" ").toLowerCase().includes(q));
    }
    list.sort((a, b) => {
      const ao = isOpen(a) ? 0 : 1, bo = isOpen(b) ? 0 : 1;
      if (ao !== bo) return ao - bo;
      const ad = a.nextDate || "9999", bd = b.nextDate || "9999";
      if (ad !== bd) return ad < bd ? -1 : 1;
      return a.name.localeCompare(b.name, "it");
    });

    return `<div class="page-head">
        <div><h1>Nomi</h1><p class="lede">Ogni riga è una persona e il punto in cui si trova.</p></div>
        <div class="btn-row">
          <button class="btn" data-act="add-bulk">Aggiungi lista</button>

        `<button class="fchip" data-act="filter" data-f="${f.id}" aria-pressed="${filter === f.id}">${esc(f.label)}</button>`).join("")}</div>
      <section class="card">
        ${list.length ? `<div class="rows">${list.map(personRow).join("")}</div>`
          : `<div class="empty"><p class="muted">${state.people.length ? "Nessun nome con questo filtro." : "La lista è vuota."}</p>
             ${state.people.length ? "" : `<button class="btn btn-primary" data-act="add-bulk">Scrivi la lista</button>`}</div>`}
