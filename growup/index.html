<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Growup</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#14181f; --ink2:#5b6472; --ink3:#8b95a3;
  --line:#e3e7ec; --accent:#1f6feb; --accent-ink:#ffffff;
  --verde:#1a9c5b; --giallo:#c98a00; --rosso:#d64545; --stella:#8b5cf6;
  --r:14px; --pad:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1116; --card:#171a21; --ink:#eef1f5; --ink2:#a3adbb; --ink3:#6f7987;
    --line:#252a33; --accent:#4b8ef7;
    --verde:#3ec27f; --giallo:#e2a93b; --rosso:#f0736f; --stella:#a78bfa;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1116; --card:#171a21; --ink:#eef1f5; --ink2:#a3adbb; --ink3:#6f7987;
  --line:#252a33; --accent:#4b8ef7;
  --verde:#3ec27f; --giallo:#e2a93b; --rosso:#f0736f; --stella:#a78bfa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
.wrap{max-width:640px;margin:0 auto;padding:var(--pad)}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:22px;letter-spacing:-.01em}
h2{font-size:17px}
h3{font-size:15px}
p{margin:.5em 0}
small,.small{font-size:13px;color:var(--ink2)}
.muted{color:var(--ink2)}
.faint{color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin:12px 0}
.card.tight{padding:12px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:10px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;
  text-decoration:none;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn.small{min-height:38px;padding:0 12px;font-size:14px;font-weight:600}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;pointer-events:none}
a{color:var(--accent)}
input,select,textarea{
  font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:46px;
}
textarea{min-height:90px;resize:vertical}
label.field{display:block;margin:12px 0 0}
label.field>span{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.v{color:var(--verde);border-color:color-mix(in srgb,var(--verde) 35%,transparent)}
.pill.g{color:var(--giallo);border-color:color-mix(in srgb,var(--giallo) 35%,transparent)}
.pill.r{color:var(--rosso);border-color:color-mix(in srgb,var(--rosso) 35%,transparent)}
.pill.s{color:var(--stella);border-color:color-mix(in srgb,var(--stella) 40%,transparent)}
.dot{width:9px;height:9px;border-radius:99px;background:var(--ink3);flex:none}
.dot.v{background:var(--verde)} .dot.g{background:var(--giallo)} .dot.r{background:var(--rosso)}
.dot.n{background:transparent;box-shadow:inset 0 0 0 2px var(--ink3)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps .mark{width:22px;flex:none;text-align:center;color:var(--ink3);font-weight:700}
.steps li.done .mark{color:var(--verde)}
.steps li.now{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 9%,transparent),transparent);
  margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:10px}
.steps li.now .mark{color:var(--accent)}
.steps li.future .t{color:var(--ink3)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
.tabs button{flex:1;background:none;border:0;color:var(--ink3);font:inherit;font-size:11px;font-weight:600;
  padding:6px 2px;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tabs button b{font-size:19px;line-height:1;font-weight:400}
.tabs button.on{color:var(--accent)}
.sheet{position:fixed;inset:0;background:rgba(8,10,14,.5);z-index:50;display:flex;align-items:flex-end}
.sheet-box{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;
  max-height:88vh;display:flex;flex-direction:column}
.sheet-head{padding:14px var(--pad);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sheet-body{padding:var(--pad);overflow:auto;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.x{margin-left:auto;background:none;border:0;color:var(--ink2);font-size:24px;line-height:1;
  width:44px;height:44px;cursor:pointer}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:11px;color:var(--ink2);display:block;line-height:1.3}
.person{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);
  width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;
  text-align:left;cursor:pointer;min-height:60px}
.person:first-of-type{border-top:0}
.person .chev{color:var(--ink3);flex:none}
.nodo-riga{display:flex;align-items:center;gap:2px}
.rami{margin-left:9px;padding-left:7px;border-left:1px solid var(--line)}
.tw{flex:none;width:24px;min-height:44px;background:none;border:0;color:var(--ink3);
  font-size:13px;cursor:pointer;padding:0}
.tw.vuoto{pointer-events:none;opacity:.35}
.nodo-riga .person{border-top:0;padding:9px 0;min-height:52px}
.sotto{font-size:11px;font-weight:700;color:var(--ink2);background:var(--bg);
  border:1px solid var(--line);border-radius:99px;padding:2px 7px;white-space:nowrap}
.tag{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.warn{background:color-mix(in srgb,var(--giallo) 12%,var(--card));border-color:color-mix(in srgb,var(--giallo) 35%,var(--line))}
.micro{list-style:none;margin:8px 0 2px;padding:0}
.micro li{display:flex;gap:8px;padding:3px 0;font-size:14px;color:var(--ink)}
.micro li.ok{color:var(--ink2)}
.micro .m{width:14px;flex:none;color:var(--ink3);font-weight:700}
.micro li.ok .m{color:var(--verde)}
.micro small{display:block;color:var(--ink3)}
.btn.tolgo{background:transparent;border-color:transparent;color:var(--rosso);font-weight:600}
.sec{margin-top:22px}
.sec>.tag{display:block;margin-bottom:6px}
.empty{text-align:center;color:var(--ink2);padding:28px 8px}
.empty b{display:block;color:var(--ink);margin-bottom:6px}
.chk{display:flex;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line);min-height:52px}
.chk:first-child{border-top:0}
.chk input{width:24px;height:24px;min-height:0;flex:none}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;letter-spacing:.08em;
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:inline-block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;
  z-index:80;max-width:88%;text-align:center}
@media (max-width:560px){ .btn{min-height:48px} .kpi b{font-size:18px} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs"></nav>

<script>
"use strict";

/* ============================================================
   GROWUP — funnel comportamentale, tre ruoli (nuovo / sponsor / leader)
   Un file solo. I dati vivono nel browser (localStorage).
   Le fasi NON sono temporali: la fase è il punto più avanzato raggiunto,
   il tempo dice soltanto se sei in linea, lento o veloce.
   ============================================================ */

/* ---- 1. Configurazione: le sei fasi, le finestre, le dichiarazioni ---- */

const FASI = [
  /* La fase in cui sei e' l'obiettivo su cui stai lavorando, non uno gia' raggiunto:
     in Fase 2 stai andando verso il Path to Bronze, non ce l'hai.
     `domanda` e' la lingua del leader (serve a giudicare), `traguardo` quella di chi
     il percorso lo sta facendo. Non vanno mai scambiate di schermata. */
  { n:0, nome:"Inizio",            breve:"Inizio",      finestra:14,
    traguardo:"Iscrizione e primo ordine",  domanda:"Ha iniziato davvero?" },
  { n:1, nome:"Attivazione",       breve:"Attivazione", finestra:14,
    traguardo:"100 VP e il primo cliente",  domanda:"Fa ciò che ha detto di voler fare?" },
  { n:2, nome:"Path to Bronze",    breve:"Path to Bronze", finestra:90,
    traguardo:"3 linee da 100 VP e 100 tuoi", domanda:"Sta costruendo la sua base?" },
  { n:3, nome:"Bronze Foundation", breve:"Foundation",  finestra:180,
    traguardo:"9% — 1.200 VP di gruppo",     domanda:"Le sue persone camminano da sole?" },
  { n:4, nome:"Bronze Builder",    breve:"Builder",     finestra:null,
    traguardo:"15% — 4.000 VP di gruppo",    domanda:"Fa lavorare altre persone?" },
  { n:5, nome:"Argento",           breve:"Argento",     finestra:null,
    traguardo:"21% — 10.000 VP di gruppo",   domanda:"" }
];

/* Soglie del semaforo e della pipeline. Qui si tarano, in un posto solo. */
const SOGLIE = {
  vpAttivazione: 100,
  /* Parametri di qualifica presi dai documenti ufficiali CumLaude21 (02-05).
     Valgono TUTTI nello stesso mese commerciale. */
  ptb:        { linee:3, vpLinea:100, vpPersonali:100 },                    // Path to Bronze
  foundation: { linee:3, vpLinea:200, vpPersonali:100, vpGruppo:1200 },     // 9%
  builder:    { linee:3, vpLinea:600, vpPersonali:200, vpGruppo:4000 },     // 15%
  argento:    { linee:2,               vpGruppo:10000 },                    // 21%
  verdeGiorni: 7,          // ultimo aggiornamento entro N giorni -> verde
  gialloGiorni: 14,        // oltre -> rosso
  freqAperture: 4,         // aperture negli ultimi 14 gg per il segnale "usa il sistema"
  personeSegnale: 2,       // sponsorizzazioni per il segnale "porta persone"
  segnaliPerPipeline: 3    // quanti segnali accesi servono per entrare in pipeline
};

/* I traguardi dichiarabili: fatti, non sensazioni. */
const FATTI = [
  { t:"primo_ordine",   label:"Primo ordine fatto",       fase:0 },
  { t:"primo_cliente",  label:"Primo cliente che compra", fase:1 },
  { t:"path_to_bronze", label:"Path to Bronze",           fase:2 },
  { t:"foundation",     label:"Bronze Foundation",        fase:3 },
  { t:"builder",        label:"Bronze Builder",           fase:4 },
  { t:"argento",        label:"Argento",                  fase:5 }
];

/* ---- 2. Stato e persistenza ---- */

/* L'indirizzo del foglio e' scritto qui dentro: cosi' ogni installazione sa gia' dove
   sincronizzarsi, e puo' CHIEDERE al foglio se un capofila esiste gia' prima di lasciarne
   nascere un secondo. Non e' un segreto: viaggia comunque in ogni link d'invito. */
const FOGLIO_URL = "https://script.google.com/macros/s/AKfycbz_3sBMgoKh-6MjqiwmMdKP4AvexV_WX0yK2_pmrwFFMvlkSuog-0lv75kiNTzzLHkT/exec";

const CHIAVE = "growup.v1";
const CHIAVE_VECCHIA = "avanti.v1";   // l'app si chiamava Avanti: si travasa una volta e basta
const OGGI = () => new Date();

let S = carica();
let vista = "oggi";
let apertoId = null;      // scheda persona aperta
let foglio = null;        // foglio ancorato in basso
let chiusi = new Set();   // rami dell'albero collassati

function vuoto(){
  return { me:null, leader:null, persone:{}, eventi:[], aperture:{}, cancellati:{},
           sync:{ url:FOGLIO_URL, ultimo:null } };
}

function carica(){
  try{
    let raw = localStorage.getItem(CHIAVE);
    if(!raw){
      const vecchio = localStorage.getItem(CHIAVE_VECCHIA);
      if(!vecchio) return vuoto();
      localStorage.setItem(CHIAVE, vecchio);      // travaso, l'originale resta come rete
      raw = vecchio;
    }
    const s = Object.assign(vuoto(), JSON.parse(raw));
    for(const k in vuoto()) if(s[k]===undefined) s[k]=vuoto()[k];
    if(!s.sync.url) s.sync.url = FOGLIO_URL;
    return s;
  }catch(e){ return vuoto(); }
}

let salvaKo = false;
function salva(){
  try{ localStorage.setItem(CHIAVE, JSON.stringify(S)); salvaKo=false; }
  catch(e){ salvaKo = true; }
}

/* ---- 3. Utilità ---- */

function codice(){
  const alfabeto = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "";
  try{
    const b = new Uint8Array(6); crypto.getRandomValues(b);
    for(const x of b) out += alfabeto[x % alfabeto.length];
  }catch(e){
    for(let i=0;i<6;i++) out += alfabeto[Math.floor(Math.random()*alfabeto.length)];
  }
  return out;
}
function uid(){ return codice()+codice(); }
function iso(d){ return new Date(d).toISOString(); }
function giorno(d){ const t = valida(d); return t===null ? "" : new Date(t).toISOString().slice(0,10); }
function valida(d){ const t = new Date(d).getTime(); return isNaN(t) ? null : t; }
function giorniTra(a,b){
  const ta = valida(a), tb = valida(b);
  if(ta===null || tb===null) return 0;
  const ms = new Date(giorno(tb)) - new Date(giorno(ta));
  return Math.round(ms/86400000);
}
function dataIt(d){
  if(!d) return "—";
  return new Date(d).toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"});
}
/* wa.me vuole solo cifre con prefisso internazionale. Se il numero non ce l'ha,
   non si indovina: si lascia solo "Chiama", che con qualunque formato funziona. */
function whatsapp(tel){
  if(!tel) return null;
  const t = String(tel).trim();
  const cifre = t.replace(/[^0-9]/g,"");
  if(t.startsWith("+")) return cifre;
  if(cifre.startsWith("00")) return cifre.slice(2);
  return null;
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
/* toLocaleString("it-IT") non separa i numeri di quattro cifre: 4000 restava "4000". */
function num(n){ return String(Math.round(Number(n)||0)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
function plur(n,uno,molti){ return n===1?`${n} ${uno}`:`${n} ${molti}`; }

let toastT = null;
function toast(msg){
  document.querySelectorAll(".toast").forEach(n=>n.remove());
  const d = document.createElement("div");
  d.className="toast"; d.textContent = msg; document.body.appendChild(d);
  clearTimeout(toastT); toastT = setTimeout(()=>d.remove(), 2600);
}

/* ---- 4. Il modello: eventi come fatti, tutto il resto dedotto ---- */

function aggiungiEvento(personaId, tipo, valore, autore){
  S.eventi.push({
    id: uid(), persona: personaId, tipo, valore: valore==null?null:valore,
    at: iso(OGGI()), by: autore || S.me || personaId
  });
}
function eventiDi(id){ return S.eventi.filter(e => e.persona===id && !S.cancellati[e.id]); }
function primoEvento(id, tipo){
  return eventiDi(id).filter(e=>e.tipo===tipo).sort((a,b)=>a.at<b.at?-1:1)[0] || null;
}
function ha(id, tipo){ return !!primoEvento(id, tipo); }
/* I VP sono un dato MENSILE: ogni qualifica si valuta dentro il mese commerciale.
   Un evento `vp` dice "a oggi, questo mese, sono a tanto": vale l'ultimo del mese. */
function mese(d){ const t = valida(d); return t===null ? "" : new Date(t).toISOString().slice(0,7); }
function meseOra(){ return mese(OGGI()); }

function vpMese(id, m){
  const v = eventiDi(id).filter(e=>e.tipo==="vp" && mese(e.at)===m).sort((a,b)=>a.at<b.at?-1:1);
  return v.length ? Number(v[v.length-1].valore)||0 : 0;
}
/* vpDi = i VP del mese in corso: e' il numero su cui si misurano le qualifiche. */
function vpDi(id){ return vpMese(id, meseOra()); }

/* Il massimo mai raggiunto in un mese: serve al traguardo d'attivazione, che si prende una volta. */
function vpMaiRaggiunti(id){
  let max = 0;
  for(const e of eventiDi(id)) if(e.tipo==="vp") max = Math.max(max, Number(e.valore)||0);
  return max;
}
/* Volume di gruppo del mese: i propri VP piu' quelli di tutto il ramo. */
function vpGruppo(id){
  return vpDi(id) + discendenti(id).reduce((t,x)=>t+vpDi(x.id), 0);
}
/* Volume di una linea frontale nel mese: quella persona piu' tutto cio' che ha sotto. */
function vpLinea(id){
  return vpDi(id) + discendenti(id).reduce((t,x)=>t+vpDi(x.id), 0);
}
/* Quante linee frontali hanno fatto almeno tot VP nel mese. */
function lineeCon(id, soglia){ return figliDi(id).filter(x=>vpLinea(x.id) >= soglia).length; }
function contaEventi(id, tipo){ return eventiDi(id).filter(e=>e.tipo===tipo).length; }
function figliDi(id){
  return Object.values(S.persone).filter(p => p.sponsor===id && !S.cancellati[p.id]);
}
function discendenti(id, out){
  out = out || [];
  for(const f of figliDi(id)){ out.push(f); discendenti(f.id, out); }
  return out;
}
function attivato(id){ return vpMaiRaggiunti(id) >= SOGLIE.vpAttivazione && ha(id,"primo_cliente"); }
function haDuplicato(id){ return figliDi(id).some(f => vpMaiRaggiunti(f.id) >= SOGLIE.vpAttivazione); }

/* La fase e' l'obiettivo su cui stai lavorando: sali quando chiudi il precedente.
   I nomi vecchi (pct15/pct21/platino) restano accettati per non perdere dati. */
function haBuilder(id){ return ha(id,"builder") || ha(id,"pct15"); }
function haArgento(id){ return ha(id,"argento") || ha(id,"pct21") || ha(id,"platino"); }

function faseDi(id){
  if(haBuilder(id))          return 5;   // verso Argento
  if(ha(id,"foundation"))    return 4;   // verso Bronze Builder
  if(ha(id,"path_to_bronze")) return 3;  // verso Bronze Foundation
  if(attivato(id))           return 2;   // verso Path to Bronze
  if(ha(id,"primo_ordine"))  return 1;   // verso l'attivazione
  return 0;                              // verso il primo ordine
}
/* Chi ha chiuso anche l'ultimo: la scala e' finita. */
function scalaFinita(id){ return haArgento(id); }

/* Quante persone del proprio primo livello sono attivate (100 VP + primo cliente). */
function attivatiSotto(id){ return figliDi(id).filter(x=>attivato(x.id)).length; }

/* Le date di inizio di ogni fase. null = fase non ancora raggiunta.
   Da qui escono sia il ritmo della fase aperta sia la velocita' delle fasi chiuse. */
function inizioFasi(p){
  const primo = t => { const x = primoEvento(p.id,t); return x?x.at:null; };
  const d = [p.creato, null, null, null, null, null];
  d[1] = primo("primo_ordine");
  const soglia = eventiDi(p.id).filter(x=>x.tipo==="vp" && Number(x.valore)>=SOGLIE.vpAttivazione)
                   .sort((a,b)=>a.at<b.at?-1:1)[0];
  const cli = primo("primo_cliente");
  if(soglia && cli) d[2] = soglia.at > cli ? soglia.at : cli;
  d[3] = primo("path_to_bronze");
  d[4] = primo("foundation");
  d[5] = primo("builder") || primo("pct15");
  /* una fase raggiunta implica le precedenti: riempie i buchi guardando indietro */
  for(let i=1;i<d.length;i++) if(d[i] && !d[i-1]) d[i-1] = d[i];
  /* e le date devono salire: chi segna un traguardo e solo dopo aggiorna i VP avrebbe
     l'attivazione datata dopo il Path to Bronze, e i giorni verrebbero negativi */
  for(let i=1;i<d.length;i++) if(d[i] && d[i-1] && d[i] < d[i-1]) d[i] = d[i-1];
  return d;
}
function inizioFase(p){ return inizioFasi(p)[faseDi(p.id)] || p.creato; }

/* Il ritmo della fase APERTA: in linea o in ritardo. Mai "veloce":
   una fase in corso non si può ancora dire chiusa in fretta. */
function ritmoDi(p){
  const f = FASI[faseDi(p.id)];
  if(!f.finestra) return null;
  const g = giorniTra(inizioFase(p), OGGI());
  if(g <= f.finestra) return { k:"linea", txt:`in linea (giorno ${g} su ${f.finestra})`, g, finestra:f.finestra };
  return { k:"lento", txt:`in ritardo di ${g-f.finestra} giorni`, g, finestra:f.finestra };
}

/* La velocità: solo fasi effettivamente CHIUSE, e chiuse in meno di metà finestra. */
function fasiVeloci(p){
  const d = inizioFasi(p), out = [];
  for(let i=0;i<d.length-1;i++){
    if(!d[i] || !d[i+1] || !FASI[i].finestra) continue;
    const g = giorniTra(d[i], d[i+1]);
    if(g >= 0 && g <= FASI[i].finestra*0.5) out.push({ fase:i, giorni:g, finestra:FASI[i].finestra });
  }
  return out;
}

/* Ultimo aggiornamento registrato dalla persona stessa */
function ultimoTocco(id){
  const suoi = eventiDi(id).filter(e => e.by===id);
  const ap = (S.aperture[id]||[]);
  const date = suoi.map(e=>e.at).concat(ap);
  if(!date.length) return null;
  return date.sort()[date.length-1];
}
/* Il semaforo misura l'attività REGISTRATA NELL'APP. Mai scritto "fermo". */
function semaforo(id){
  const t = ultimoTocco(id);
  const p = S.persone[id];
  if(!t){
    /* invitata di recente e mai entrata: è il dato del funnel, non un fallimento */
    const g0 = p ? giorniTra(p.creato, OGGI()) : 999;
    return g0 <= FASI[0].finestra
      ? { k:"n", g:g0, txt:"non ha ancora aperto l'app" }
      : { k:"r", g:g0, txt:`invitata ${g0} giorni fa, non ha mai aperto l'app` };
  }
  const g = giorniTra(t, OGGI());
  const txt = g===0 ? "ha aggiornato oggi"
            : g===1 ? "ha aggiornato ieri"
            : `non aggiorna da ${g} giorni`;
  if(g <= SOGLIE.verdeGiorni)  return { k:"v", g, txt };
  if(g <= SOGLIE.gialloGiorni) return { k:"g", g, txt };
  return { k:"r", g, txt };
}

/* I segnali: due si misurano da soli, gli altri sono dichiarati. */
function segnaliDi(id){
  const p = S.persone[id]; if(!p) return [];
  const out = [];
  const ap = (S.aperture[id]||[]).filter(d => giorniTra(d, OGGI()) <= 14).length;
  if(ap >= SOGLIE.freqAperture)
    out.push({ k:"frequenza", misurato:true, txt:`ha aperto l'app ${ap} volte in 14 giorni` });

  const vel = fasiVeloci(p);
  if(vel.length){
    const u = vel[vel.length-1];
    out.push({ k:"velocita", misurato:true,
      txt:`ha chiuso la Fase ${u.fase} in ${u.giorni} giorni su ${u.finestra}` +
          (vel.length>1?` (${vel.length} fasi in anticipo)`:"") });
  }

  const figli = figliDi(id);
  if(figli.length >= SOGLIE.personeSegnale)
    out.push({ k:"persone", misurato:false, txt:`ha portato ${plur(figli.length,"persona","persone")}` });

  if(haDuplicato(id)){
    const chi = figli.filter(f=>vpDi(f.id)>=SOGLIE.vpAttivazione).map(f=>f.nome);
    out.push({ k:"duplicazione", misurato:false,
      txt:`${chi.join(", ")} ${chi.length===1?"ha":"hanno"} superato i 100 VP` });
  }
  const tutti = eventiDi(id);
  const suoi = tutti.filter(e=>e.by===id).length;
  if(tutti.length >= 4 && suoi/tutti.length >= 0.8)
    out.push({ k:"iniziativa", misurato:true, txt:"registra da solo quello che fa" });

  const pres = contaEventi(id,"presentazione");
  if(pres >= 3) out.push({ k:"presentazioni", misurato:false, txt:`${pres} presentazioni segnate` });
  return out;
}
/* Tre gruppi e uno solo per persona, in quest'ordine di priorita':
   chi ha bisogno adesso viene prima di chi va bene, sempre. */
function valuta(id){
  const p = S.persone[id]; if(!p) return null;
  const f = faseDi(id), s = semaforo(id), vp = vpDi(id);
  const figli = figliDi(id), attivi = attivatiSotto(id);
  const daLeader = (figli.length >= 2 && attivi >= 1) || !!inPipeline(id);
  const motivi = [];

  if(s.k === "n" || s.k === "r") motivi.push(s.txt);
  if(f === 1 && vp > 0 && vp < SOGLIE.vpAttivazione && s.k !== "v")
    motivi.push(`è a ${vp} VP e si è fermata`);
  if(f === 1 && ha(id,"primo_cliente") === false && vp >= SOGLIE.vpAttivazione)
    motivi.push("ha i VP, le manca solo il primo cliente");
  if(f === 2 && figli.length > 0 && attivi < 3 && s.k !== "v")
    motivi.push(`ha ${plur(figli.length,"persona","persone")}, ${attivi} partite su 3`);
  if(f === 2 && figli.length === 0 && giorniTra(inizioFase(p), OGGI()) <= FASI[2].finestra)
    motivi.push("attivata, non ha ancora portato nessuno");
  if(motivi.length) return { gruppo:"seguire", motivi, stella:daLeader };

  if(daLeader) return { gruppo:"crescere", motivi:segnaliDi(id).map(x=>x.txt), stella:true };
  return { gruppo:"tempi", motivi:[s.txt], stella:false };
}

function inPipeline(id){
  const s = segnaliDi(id);
  if(s.some(x=>x.k==="duplicazione") && s.length >= 2) return s;
  return s.length >= SOGLIE.segnaliPerPipeline ? s : null;
}

/* Ha fatto ciò che ha detto? Confronto dichiarazione / fatti. */
function promesse(p){
  const d = p.dichiarato || {};
  const out = [];
  if(d.giorni100vp){
    const scadenza = new Date(new Date(p.creato).getTime() + d.giorni100vp*86400000);
    const raggiunto = eventiDi(p.id).filter(e=>e.tipo==="vp"&&Number(e.valore)>=100)
                        .sort((a,b)=>a.at<b.at?-1:1)[0];
    out.push({
      txt:`100 VP entro ${d.giorni100vp} giorni`,
      fatto: !!raggiunto,
      esito: raggiunto
        ? (raggiunto.at <= iso(scadenza) ? "mantenuta" : "in ritardo")
        : (OGGI() <= scadenza ? "in corso" : "scaduta")
    });
  }
  if(d.personeDaSentire){
    const n = contaEventi(p.id,"conversazione");
    const scaduta = giorniTra(p.creato, OGGI()) > FASI[1].finestra;
    out.push({
      txt:`parlare con ${d.personeDaSentire} persone nelle prime due settimane`,
      fatto: n >= d.personeDaSentire,
      esito: n >= d.personeDaSentire ? "mantenuta"
           : scaduta ? `${n} su ${d.personeDaSentire}, tempo scaduto`
           : `${n} su ${d.personeDaSentire}`
    });
  }
  return out;
}

/* Cosa manca per chiudere la fase in cui sei. La domanda della fase serve al leader,
   a chi ci sta dentro serve l'elenco di quello che gli manca. */
/* I criteri di una fase qualsiasi: serve per mostrare il traguardo di costruzione
   anche a chi e' ancora all'inizio e non ci e' arrivato. */
function mancanti(p){ return criteri(p, faseDi(p.id)); }

function criteri(p, f){
  const out = [];
  const vpM = vpDi(p.id), gruppo = vpGruppo(p.id), figli = figliDi(p.id);
  const riga = (txt, fatto, nota) => out.push({ txt, fatto, nota: fatto?null:nota });

  if(f===0){
    riga("Iscrizione completata", true);
    riga("Il primo ordine", false);
    riga("Il tuo obiettivo scritto", !!(p.dichiarato && (p.dichiarato.euroMese || p.dichiarato.perche)));
  }

  if(f===1){
    const mai = vpMaiRaggiunti(p.id);
    riga(`Arrivare a ${SOGLIE.vpAttivazione} VP in un mese`, mai>=SOGLIE.vpAttivazione,
         `sei a ${mai}, ne mancano ${Math.max(0,SOGLIE.vpAttivazione-mai)}`);
    riga("Il primo cliente che compra", ha(p.id,"primo_cliente"));
    const parlati = contaEventi(p.id,"conversazione");
    const bersaglio = (p.dichiarato && p.dichiarato.personeDaSentire) || 5;
    riga(`Parlare con ${bersaglio} persone`, parlati>=bersaglio, `${parlati} su ${bersaglio}`);
  }

  if(f===2){
    const c = SOGLIE.ptb, qualificate = lineeCon(p.id, c.vpLinea);
    riga(`${c.linee} prime linee tue`, figli.length>=c.linee, `ne hai ${figli.length}`);
    riga(`Ognuna a ${c.vpLinea} VP questo mese`, qualificate>=c.linee,
         `${qualificate} su ${c.linee} ci sono arrivate`);
    riga(`${c.vpPersonali} VP personali tuoi questo mese`, vpM>=c.vpPersonali, `sei a ${vpM}`);
    riga("Segnare il Path to Bronze quando arriva", false);
  }

  if(f===3 || f===4){
    const c = f===3 ? SOGLIE.foundation : SOGLIE.builder;
    const nome = f===3 ? "la Bronze Foundation" : "il Bronze Builder";
    const livello = f===3 ? "9%" : "15%";
    const qualificate = lineeCon(p.id, c.vpLinea);
    riga(`${num(c.vpGruppo)} VP di gruppo questo mese (livello ${livello})`, gruppo>=c.vpGruppo, `siete a ${num(gruppo)}`);
    riga(`${c.linee} linee frontali`, figli.length>=c.linee, `ne hai ${figli.length}`);
    riga(`Ognuna a ${c.vpLinea} VP questo mese`, qualificate>=c.linee,
         `${qualificate} su ${c.linee} ci sono arrivate`);
    riga(`${c.vpPersonali} VP personali tuoi questo mese`, vpM>=c.vpPersonali, `sei a ${vpM}`);
    riga(`Segnare ${nome} quando arriva`, false);
  }

  if(f===5 && !scalaFinita(p.id)){
    const c = SOGLIE.argento, qualificate = lineeCon(p.id, 1);
    riga(`${num(c.vpGruppo)} VP di gruppo questo mese (livello 21%)`, gruppo>=c.vpGruppo, `siete a ${num(gruppo)}`);
    riga(`Volume su almeno ${c.linee} linee`, qualificate>=c.linee, `${qualificate} linee attive`);
    riga("Segnare l'Argento quando arriva", false);
  }
  return out;
}

/* La strada gia' fatta: le fasi chiuse, quando e in quanti giorni. */
function strada(p){
  const d = inizioFasi(p), f = faseDi(p.id), out = [];
  for(let i=0;i<f;i++){
    if(!d[i] || !d[i+1]) continue;
    out.push({ fase:i, nome:FASI[i].nome, quando:d[i+1],
               giorni:giorniTra(d[i], d[i+1]), finestra:FASI[i].finestra });
  }
  return out;
}

/* Il traguardo di costruzione: da Fase 2 in su e' la fase stessa; chi e' ancora
   all'inizio guarda comunque il Path to Bronze, che e' il primo. */
function faseCostruzione(id){
  if(scalaFinita(id)) return null;
  return Math.min(5, Math.max(2, faseDi(id)));
}

/* La prossima cosa da fare: UNA, e sempre dentro l'obiettivo della fase. */
function prossimaAzione(p){
  const f = faseDi(p.id);
  const vp = vpDi(p.id);
  const figli = figliDi(p.id);
  const attivi = attivatiSotto(p.id);

  /* Il capofila non deve rifare i primi 100 VP: deve far partire le persone. */
  if(p.id===S.leader && !figli.length) return {
    titolo:"Invita la prima persona",
    perche:"Mandale il tuo link: quando entra, la vedi comparire qui.", azione:"invita" };

  if(f===0) return { titolo:"Fai il tuo primo ordine",
    perche:"È il gesto che trasforma l'iscrizione in un inizio.", azione:"primo_ordine" };

  if(f===1){
    /* Il traguardo d'attivazione si prende una volta: si guarda il massimo mai fatto,
       non il mese in corso, altrimenti il primo del mese sembra di ripartire da zero. */
    const mai = vpMaiRaggiunti(p.id);
    if(mai < SOGLIE.vpAttivazione) return {
      titolo:`Arriva a ${SOGLIE.vpAttivazione} VP`,
      perche:`Te ne mancano ${SOGLIE.vpAttivazione-mai}.`, azione:"vp" };
    return { titolo:"Trova il tuo primo cliente",
      perche:"La prima persona che compra da te è la prova che funziona.", azione:"primo_cliente" };
  }

  /* Dalla Fase 2 in su l'obiettivo e' mensile: la prossima cosa e' il criterio che manca. */
  if(f>=2 && !scalaFinita(p.id)){
    const c = f===2 ? SOGLIE.ptb : f===3 ? SOGLIE.foundation : f===4 ? SOGLIE.builder : SOGLIE.argento;
    const nome = f===2 ? "il Path to Bronze" : f===3 ? "la Bronze Foundation"
               : f===4 ? "il Bronze Builder" : "l'Argento";
    const chiave = f===2 ? "path_to_bronze" : f===3 ? "foundation" : f===4 ? "builder" : "argento";
    const vpM = vpDi(p.id), gruppo = vpGruppo(p.id);

    if(c.linee && figli.length < c.linee) return {
      titolo: figli.length ? "Porta un'altra persona" : "Porta la prima persona",
      perche:`Per ${nome} ti servono ${c.linee} linee tue: ne hai ${figli.length}.`, azione:"invita" };

    if(c.vpLinea){
      const indietro = figli.filter(x=>vpLinea(x.id) < c.vpLinea)
        .sort((a,b)=>vpLinea(b.id)-vpLinea(a.id));
      if(figli.length - indietro.length < c.linee && indietro.length) return {
        titolo:`Aiuta ${indietro[0].nome.split(" ")[0]} ad arrivare a ${c.vpLinea} VP`,
        perche:`Questo mese la sua linea è a ${vpLinea(indietro[0].id)}. Per ${nome} servono ${c.linee} linee da ${c.vpLinea}.`,
        azione:null };
    }
    if(c.vpPersonali && vpM < c.vpPersonali) return {
      titolo:`Arriva a ${c.vpPersonali} VP tuoi`,
      perche:`Questo mese sei a ${vpM}. Per ${nome} ne servono ${c.vpPersonali} personali.`, azione:"vp" };
    if(c.vpGruppo && gruppo < c.vpGruppo) return {
      titolo:"Fai crescere il volume di gruppo",
      perche:`Questo mese siete a ${num(gruppo)} VP dei ${num(c.vpGruppo)} che servono per ${nome}.`, azione:null };

    return { titolo:`Segna ${nome}`,
      perche:"Hai tutti i criteri: quando la qualifica arriva, segnala qui.", azione:chiave };
  }
  return { titolo:"Continua così", perche:"", azione:null };
}


/* ---- 5. Ruoli ---- */
function io(){ return S.me ? S.persone[S.me] : null; }
function sonoLeader(){ return S.me && S.leader===S.me; }
function hoPersone(){ return S.me ? figliDi(S.me).length>0 : false; }

/* ---- 6. Render ---- */

function render(){
  const app = document.getElementById("app");
  const y = window.scrollY;
  const sb = document.querySelector(".sheet-body");
  const sy = sb ? sb.scrollTop : 0;

  if(!S.me){ app.innerHTML = vistaIngresso(); }
  else{
    switch(vista){
      case "oggi":     app.innerHTML = vistaOggi(); break;
      case "percorso": app.innerHTML = vistaPercorso(); break;
      case "persone":  app.innerHTML = vistaPersone(); break;
      case "valuta":   app.innerHTML = vistaValuta(); break;
      case "dati":     app.innerHTML = vistaDati(); break;
      default:         app.innerHTML = vistaOggi();
    }
  }
  disegnaTabs();
  disegnaFoglio();
  window.scrollTo(0,y);
  const sb2 = document.querySelector(".sheet-body");
  if(sb2) sb2.scrollTop = sy;
}

function disegnaTabs(){
  const t = document.getElementById("tabs");
  if(!S.me){ t.style.display="none"; return; }
  t.style.display="flex";
  const voci = [
    { k:"oggi", i:"◉", l:"Oggi" },
    { k:"percorso", i:"↗", l:"Percorso" }
  ];
  if(hoPersone() || sonoLeader()){
    voci.push({ k:"persone", i:"◍", l:"Persone" });
    voci.push({ k:"valuta",  i:"◈", l:"Chi seguire" });
  }
  voci.push({ k:"dati", i:"≡", l:"Dati" });
  t.innerHTML = voci.map(v =>
    `<button class="${vista===v.k?"on":""}" data-tab="${v.k}"><b>${v.i}</b>${esc(v.l)}</button>`
  ).join("");
}

/* --- Oggi: la schermata più importante. Una sola azione. --- */
function vistaOggi(){
  const p = io();
  const f = faseDi(p.id);

  const az = prossimaAzione(p);
  const vp = vpDi(p.id);
  const g = giorniTra(p.creato, OGGI());
  const r = ritmoDi(p);
  const prom = promesse(p);

  if(f===1){

               vp!==mai ? ` · ${vp} questo mese` : ""}</div>`;
  }

  const daSeguire = figli.map(x=>({x, s:semaforo(x.id)}))
                         .filter(o=>o.s.k!=="v" || vpDi(o.x.id)<SOGLIE.vpAttivazione);

  return `
  <div class="spread" style="margin:6px 0 2px">
    <h1>Ciao ${esc(p.nome.split(" ")[0])} 👋</h1>

  <p class="small">Giorno ${g} · Fase ${f} · ${esc(fase.nome)}
    ${r?` · <span class="${r.k==="lento"?"":""}">${esc(r.txt)}</span>`:""}</p>

  <div class="card">
    <span class="tag">La prossima cosa</span>
    <h2 style="margin-top:6px">${esc(az.titolo)}</h2>
    ${az.perche?`<p class="small">${esc(az.perche)}</p>`:``}
    ${barra}
    <div class="row wrap" style="margin-top:12px">
      ${az.azione==="vp"
        ? `<button class="btn primary grow" data-act="apri-vp">Aggiorna i VP del mese</button>`
        : az.azione==="invita"
          ? `<button class="btn primary grow" data-act="apri-invita">Invita una persona</button>`
          : az.azione
          ? `<button class="btn primary grow" data-act="fatto" data-t="${az.azione}">L'ho fatto</button>`
          : ``}
      <button class="btn" data-act="apri-registra">Registra altro</button>
    </div>
  </div>

  ${prom.length ? `
  <div class="card tight">
    <span class="tag">Quello che hai detto di voler fare</span>
    <ul class="steps" style="margin-top:8px">
      ${prom.map(x=>`<li class="${x.fatto?"done":""}">
        <span class="mark">${x.fatto?"✓":"○"}</span>
        <span class="grow"><span class="t">${esc(x.txt)}</span>
        <br><small>${esc(x.esito)}</small></span></li>`).join("")}
    </ul>
  </div>`:``}

  ${(() => {
    /* Il traguardo di costruzione, coi suoi parametri: e' il perche' di tutto il resto,
       e avanza da solo quando la qualifica precedente e' segnata. */
    const fc = faseCostruzione(p.id);
    if(fc === null) return "";
    const lista = criteri(p, fc).filter(x => !/^Segnare /.test(x.txt));
    const presi = lista.filter(x=>x.fatto).length;
    return `
    <div class="card">
      <div class="spread">
        <span class="tag">Il traguardo da costruire</span>
        <span class="pill">${presi} su ${lista.length}</span>
      </div>
      <h2 style="margin-top:6px">${esc(FASI[fc].nome)}</h2>
      <p class="small">${esc(FASI[fc].traguardo)}${fc>faseDi(p.id)?" — ci arrivi dopo l'attivazione":""}</p>
      <ul class="micro" style="margin-top:10px">
        ${lista.map(m=>`<li class="${m.fatto?"ok":""}">
          <span class="m">${m.fatto?"✓":"○"}</span>
          <span>${esc(m.txt)}${m.nota?`<small>${esc(m.nota)}</small>`:``}</span></li>`).join("")}
      </ul>
      ${criteri(p,fc).every(x=>x.fatto || /^Segnare /.test(x.txt)) && fc===faseDi(p.id)
        ? `<button class="btn primary wide" style="margin-top:14px" data-act="fatto"
             data-t="${fc===2?"path_to_bronze":fc===3?"foundation":fc===4?"builder":"argento"}">
             Ho raggiunto ${esc(FASI[fc].nome)}</button>` : ``}
    </div>`;
  })()}

  ${daSeguire.length ? `
  <div class="sec">
    <span class="tag">Chi ha bisogno di te</span>
    ${daSeguire.map(o=>rigaPersona(o.x)).join("")}
  </div>`:``}

  ${p.dichiarato && p.dichiarato.perche ? `
  <div class="card tight">
    <span class="tag">Il tuo perché</span>
    <p style="margin:6px 0 0">${esc(p.dichiarato.perche)}</p>
  </div>`:``}

  ${az.azione!=="invita" ? `
  <div class="sec">
    <button class="btn wide ghost" data-act="apri-invita">Invita una persona</button>
    <p class="small faint" style="margin-top:8px;text-align:center">Il tuo link: chi lo apre
    entra nel tuo gruppo e comincia il suo percorso.</p>
  </div>`:``}

  ${salvaKo?`<div class="card warn"><b>Questo browser non salva.</b>
    <p class="small">Se sei in navigazione privata quello che segni sparisce alla chiusura.</p></div>`:``}
  `;
}

/* --- Percorso: si vede il futuro, si è guidati sul presente. --- */
function vistaPercorso(){
  const p = io();
  const f = faseDi(p.id);
  const manca = mancanti(p);
  const fatta = strada(p);
  return `
  <h1>Il mio percorso</h1>
  <p class="small">La fase in cui sei è l'obiettivo su cui stai lavorando adesso. Il resto lo vedi, ma non ti riguarda ancora.</p>
  <div class="card">
    <ul class="steps">
    ${FASI.map(x=>{
      const cls = x.n<f ? "done" : x.n===f ? "now" : "future";
      const mark = x.n<f ? "✓" : x.n===f ? "●" : "○";
      return `<li class="${cls}">
        <span class="mark">${mark}</span>
        <span class="grow">
          <span class="t"><b>Fase ${x.n} · ${esc(x.nome)}</b></span>
          ${x.n===f
            ? `<br><small>Sei qui — per chiudere questa fase:</small>
               <ul class="micro">${manca.map(m=>`<li class="${m.fatto?"ok":""}">
                 <span class="m">${m.fatto?"✓":"○"}</span>
                 <span>${esc(m.txt)}${m.nota?`<small>${esc(m.nota)}</small>`:``}</span></li>`).join("")}</ul>`
            : `<br><small class="faint">${esc(x.traguardo)}</small>`}
        </span></li>`;
    }).join("")}
    </ul>
  </div>
  <div class="card tight">
    <span class="tag">Fatti registrati</span>
    <ul class="steps" style="margin-top:8px">
      ${FATTI.filter(x => x.fase <= f+1 || primoEvento(p.id,x.t)).map(x=>{
        const e = primoEvento(p.id,x.t);
        return `<li class="${e?"done":"future"}"><span class="mark">${e?"✓":"○"}</span>
          <span class="grow"><span class="t">${esc(x.label)}</span>
          ${e?`<br><small>${dataIt(e.at)}</small>`:``}</span></li>`;
      }).join("")}
    </ul>
  </div>
  ${fatta.length ? `
  <div class="card tight">
    <span class="tag">La strada che hai fatto</span>
    <p style="margin:8px 0 2px"><b>${plur(fatta.length,"fase chiusa","fasi chiuse")}</b>
      in ${plur(giorniTra(p.creato, fatta[fatta.length-1].quando),"giorno","giorni")}.</p>
    <ul class="steps" style="margin-top:8px">
      ${fatta.map(x=>`<li class="done"><span class="mark">✓</span>
        <span class="grow"><span class="t">Fase ${x.fase} · ${esc(x.nome)}</span>
        <br><small>chiusa il ${dataIt(x.quando)}, in ${plur(x.giorni,"giorno","giorni")}${
          x.finestra && x.giorni <= x.finestra/2 ? " — in anticipo" : ""}</small></span></li>`).join("")}
    </ul>
  </div>`:``}
  <button class="btn wide" data-act="apri-registra">Registra un fatto</button>`;
}

/* --- L'albero: chi hai portato, e chi hanno portato loro, a qualunque profondita'. --- */
const PESO = { r:0, n:1, g:2, v:3 };
function ordinaPersone(a,b){
  return PESO[semaforo(a.id).k] - PESO[semaforo(b.id).k]
      || giorniTra(b.creato,OGGI()) - giorniTra(a.creato,OGGI());
}

function nodoAlbero(x, prof){
  const figli = figliDi(x.id).sort(ordinaPersone);
  const sotto = discendenti(x.id).length;
  const s = semaforo(x.id), f = faseDi(x.id), pipe = inPipeline(x.id);
  const chiuso = chiusi.has(x.id);
  const leva = figli.length
    ? `<button class="tw" data-toggle="${x.id}" aria-label="apri o chiudi">${chiuso?"▶":"▼"}</button>`
    : `<span class="tw vuoto">•</span>`;
  return `<div class="nodo">
    <div class="nodo-riga">${leva}
      <button class="person" data-persona="${x.id}">
        <span class="dot ${s.k}"></span>
        <span class="grow">
          <b>${esc(x.nome)}</b>${pipe?` <span class="pill s">★</span>`:``}
          ${sotto?` <span class="sotto">${sotto} sotto</span>`:``}
          <br><small>Giorno ${giorniTra(x.creato,OGGI())} · Fase ${f} · ${vpDi(x.id)} VP</small>
          <br><small class="faint">${esc(s.txt)}</small>
        </span>
        <span class="chev">›</span></button>
    </div>
    ${figli.length && !chiuso
      ? `<div class="rami">${figli.map(k=>nodoAlbero(k, prof+1)).join("")}</div>` : ``}
  </div>`;
}
function alberoDi(radiceId){
  const figli = figliDi(radiceId).sort(ordinaPersone);
  return figli.length ? figli.map(x=>nodoAlbero(x,0)).join("") : "";
}

function rigaPersona(x, mostraSponsor){
  const s = semaforo(x.id);
  const f = faseDi(x.id);
  const g = giorniTra(x.creato, OGGI());
  const pipe = inPipeline(x.id);
  return `<button class="person" data-persona="${x.id}">
    <span class="dot ${s.k}"></span>
    <span class="grow">
      <b>${esc(x.nome)}</b>${pipe?` <span class="pill s">★</span>`:``}
      <br><small>Giorno ${g} · Fase ${f} ${esc(FASI[f].breve)} · ${vpDi(x.id)} VP</small>
      <br><small class="faint">${esc(s.txt)}${mostraSponsor&&x.sponsor&&S.persone[x.sponsor]?` · sponsor ${esc(S.persone[x.sponsor].nome.split(" ")[0])}`:""}</small>
    </span>
    <span class="chev">›</span></button>`;
}

  const attivi = tutti.filter(x=>attivato(x.id)).length;

  return `
  <h1>Le mie persone</h1>
  <p class="small">${plur(diretti.length,"persona","persone")} in prima linea${
    tutti.length>diretti.length?`, ${tutti.length} in tutto il tuo ramo`:""}.</p>
  ${sonoLeader() ? `
  <div class="card">
    <span class="tag">Il funnel</span>
    <ul class="steps" style="margin-top:8px">
    ${FASI.map(x=>{
      const n = tutti.filter(q=>faseDi(q.id)>=x.n).length;

    ${(() => { const mai = tutti.filter(q=>faseDi(q.id)===0 && !ultimoTocco(q.id));
      return mai.length?`<p class="small" style="margin-top:12px"><b>${plur(mai.length,"persona","persone")}</b>
        non ha mai aperto l'app dopo l'invito.</p>`:``; })()}
  </div>`:``}
  <div class="card tight">
    <div class="kpi">
      <div><b>${tutti.length}</b><span>nel tuo ramo</span></div>
      <div><b>${attivi}</b><span>a 100 VP</span></div>
      <div><b>${duplicano}</b><span>che duplicano</span></div>
    </div>
    ${daSeguire?`<p class="small" style="margin:10px 0 0">${plur(daSeguire,"persona","persone")}
      non aggiorna da più di ${SOGLIE.gialloGiorni} giorni.</p>`:``}
  </div>
  <div class="card">
    ${tutti.length ? alberoDi(S.me)
      : `<div class="empty"><b>Ancora nessuno</b>Invita la prima persona: appena entra la vedi qui,
         senza doverla inserire.</div>`}
  </div>
  <div class="stack">
    <button class="btn primary wide" data-act="apri-invita">Invita una persona</button>
    <button class="btn wide ghost" data-act="apri-nuovo">Aggiungi chi non usa l'app</button>
  </div>
  <p class="small faint" style="margin-top:12px">Il semaforo dice se la persona
  <b>aggiorna l'app</b>, non se sta lavorando. Chi lavora senza aggiornare diventa rosso:
  chiedilo, non darlo per fatto.</p>
  ${S.sync.url?``:`<div class="card warn" style="margin-top:12px"><b>Manca il collegamento al foglio.</b>
    <p class="small">Senza, chi apre il tuo link non ti compare qui da solo:
    lo vedi solo se ti manda il codice a mano. Si mette una volta in <b>Dati</b>.</p></div>`}`;
}

/* --- Chi seguire: la valutazione delle persone del gruppo. --- */
function rigaValutata(x, v){
  return `<button class="person" data-persona="${x.id}">
    <span class="dot ${semaforo(x.id).k}"></span>
    <span class="grow">
      <b>${esc(x.nome)}</b>${v.stella?` <span class="pill s">★</span>`:``}
      <br><small>Giorno ${giorniTra(x.creato,OGGI())} · Fase ${faseDi(x.id)} ${esc(FASI[faseDi(x.id)].breve)}</small>
      <br><small class="faint">${esc(v.motivi.filter(Boolean).join(" · ") || "—")}</small>
    </span>
    <span class="chev">›</span></button>`;
}

function vistaValuta(){
  const tutti = discendenti(S.me);
  const gruppi = { seguire:[], crescere:[], tempi:[] };
  tutti.forEach(x => { const v = valuta(x.id); if(v) gruppi[v.gruppo].push({x, v}); });
  const ord = a => a.sort((p,q)=>PESO[semaforo(p.x.id).k]-PESO[semaforo(q.x.id).k]);
  ord(gruppi.seguire); ord(gruppi.tempi);
  gruppi.crescere.sort((p,q)=>q.v.motivi.length-p.v.motivi.length);

  const blocco = (titolo, spiega, lista, vuoto) => `
    <div class="sec">
      <span class="tag">${titolo}</span>
      <p class="small" style="margin:2px 0 8px">${spiega}</p>
      <div class="card">${lista.length
        ? lista.map(o=>rigaValutata(o.x,o.v)).join("")
        : `<div class="empty">${vuoto}</div>`}</div>
    </div>`;

  return `
  <h1>Chi seguire</h1>
  <p class="small">${tutti.length
    ? `${plur(tutti.length,"persona","persone")} nel tuo ramo, divise per quello che serve loro adesso.`
    : "Quando avrai persone nel gruppo, qui trovi chi ha bisogno di te."}</p>

  ${blocco("Da seguire adesso",
    "Si sono fermate, o sono a un passo da un traguardo. Una telefonata cambia qualcosa.",
    gruppi.seguire, "Nessuno è fermo. È una buona notizia.")}

  ${blocco("Da far crescere",
    "Portano persone e le fanno partire. Su queste vale il tuo tempo migliore.",
    gruppi.crescere, "Nessuno, per ora. Sono pochi per definizione.")}

  ${blocco("Ai loro tempi",
    "Si muovono, ma senza costruire. Vanno lasciate andare al loro passo: inseguirle non le accelera.",
    gruppi.tempi, "Nessuno qui.")}

  <p class="small faint" style="margin-top:16px">I gruppi si rifanno da soli a ogni apertura,
  su quello che le persone segnano. Nessuno sa in quale gruppo è: lo vedi solo tu.</p>`;
}

/* ---- 7. Fogli ancorati in basso ---- */

function apriFoglio(tipo, dati){ foglio = { tipo, dati:dati||{} }; render(); }
function chiudiFoglio(){ foglio = null; render(); }

function disegnaFoglio(){
  document.querySelectorAll(".sheet").forEach(n=>n.remove());
  if(!foglio) return;
  const box = document.createElement("div");
  box.className="sheet";
  box.innerHTML = `<div class="sheet-box">
    <div class="sheet-head"><h2>${esc(contenutoFoglio().titolo)}</h2>
      <button class="x" data-act="chiudi">×</button></div>
    <div class="sheet-body">${contenutoFoglio().body}</div>
    ${contenutoFoglio().foot?`<div class="sheet-foot">${contenutoFoglio().foot}</div>`:``}
  </div>`;
  box.addEventListener("click", e => { if(e.target===box) chiudiFoglio(); });
  document.body.appendChild(box);
}

function contenutoFoglio(){
  const t = foglio.tipo;

  if(t==="primo-ordine"){
    const p = S.persone[foglio.dati.id] || io();
    const suo = p.id===S.me;
    return { titolo:"Il primo ordine", body:`
      <p class="small">${suo?"Quanti VP hai fatto con questo ordine?":`Quanti VP ha fatto ${esc(p.nome.split(" ")[0])} con il primo ordine?`}
      Il numero sta sulla conferma dell'ordine.</p>
      <label class="field"><span>VP dell'ordine</span>
        <input id="poVp" type="number" inputmode="numeric" placeholder="es. 50"></label>
      <p class="small faint" style="margin-top:12px">Se il numero non è esatto non è un problema:
      i VP si aggiornano quando vuoi.</p>`,
      foot:`<button class="btn primary wide" data-act="salva-primo-ordine" data-id="${p.id}">Salva</button>` };
  }

  if(t==="vp"){
    const p = S.persone[foglio.dati.id] || io();
    return { titolo:"Aggiorna i VP", body:`
      <p class="small">Scrivi i VP che hai fatto <b>in questo mese</b>. Le qualifiche si contano
      mese per mese, quindi il primo del mese si riparte da zero.</p>
      <label class="field"><span>VP di ${new Date().toLocaleDateString("it-IT",{month:"long",year:"numeric"})}</span>
        <input id="vpVal" type="number" inputmode="numeric" value="${vpDi(p.id)}"></label>`,
      foot:`<button class="btn primary wide" data-act="salva-vp" data-id="${p.id}">Salva</button>` };
  }

  if(t==="registra"){
    const p = S.persone[foglio.dati.id] || io();
    const f = faseDi(p.id);
    return { titolo:"Registra", body:`
      <p class="small">Solo fatti. Le sensazioni non stanno qui.</p>
      <div class="stack" style="margin-top:12px">
        <button class="btn wide" data-act="conta" data-t="conversazione" data-id="${p.id}">
          Ho parlato con una persona <small>(${contaEventi(p.id,"conversazione")})</small></button>
        <button class="btn wide" data-act="conta" data-t="presentazione" data-id="${p.id}">
          Ho fatto una presentazione <small>(${contaEventi(p.id,"presentazione")})</small></button>
        <button class="btn wide" data-act="apri-vp" data-id="${p.id}">VP di questo mese (${vpDi(p.id)})</button>
      </div>
      <div class="sec"><span class="tag">Traguardi</span>
      ${(() => {
        /* si mostrano solo quelli a portata: uno che comincia non deve leggere "Platino" */
        const f = faseDi(p.id);
        const visibili = FATTI.filter(x => x.fase <= f+1 || primoEvento(p.id,x.t));
        const nascosti = FATTI.length - visibili.length;
        return visibili.map(x=>{
          const e = primoEvento(p.id,x.t);
          return `<label class="chk"><input type="checkbox" ${e?"checked":""}
            data-fatto="${x.t}" data-id="${p.id}">
            <span class="grow">${esc(x.label)}${e?`<br><small class="faint">${dataIt(e.at)}</small>`:``}</span></label>`;
        }).join("") + (nascosti?`<p class="small faint" style="margin-top:12px">
          Gli altri traguardi compaiono quando ti avvicini.</p>`:``);
      })()}</div>` };
  }

  if(t==="nuovo"){
    return { titolo:"Ho sponsorizzato qualcuno", body:`
      <p class="small">Inseriscila anche se non è sicura di partire: sapere quante persone
      non partono è il motivo per cui questa app esiste.</p>
      <label class="field"><span>Nome</span>
        <input id="nvNome" type="text" autocomplete="name" placeholder="Nome e cognome"></label>
      <label class="field"><span>Data della sponsorizzazione</span>
        <input id="nvData" type="date" value="${giorno(OGGI())}"></label>
      <label class="field"><span>Numero (facoltativo)</span>
        <input id="nvTel" type="tel" inputmode="tel" placeholder="+39 333 1234567"></label>`,
      foot:`<button class="btn primary wide" data-act="salva-nuovo">Crea e prendi il link</button>` };
  }

  if(t==="invita"){
    const link = linkSponsor(S.me);
    return { titolo:"Invita una persona", body:`
      <p class="small">Un link solo, sempre lo stesso, per chiunque tu sponsorizzi.
      Chi lo apre si iscrive da sé e ti compare in <b>Le mie persone</b>: non devi inserirlo.
      Le ultime sei lettere sono il tuo codice: è quello che vi collega.</p>
      <label class="field"><span>Il tuo link</span><textarea id="linkBox" readonly>${esc(link)}</textarea></label>
      <div class="stack" style="margin-top:12px">
        <button class="btn primary wide" data-act="copia-mio-link">Copia il link</button>

function etichettaEvento(e){
  const m = {
    iscrizione:"Sponsorizzata", primo_ordine:"Primo ordine", primo_cliente:"Primo cliente",
    conversazione:"Ha parlato con una persona", presentazione:"Presentazione",
    sponsorizzazione:"Ha sponsorizzato", path_to_bronze:"Path to Bronze",
    foundation:"Bronze Foundation", pct15:"15%", pct18:"18%", pct21:"21%", platino:"Platino"
  };
  if(e.tipo==="vp") return `VP a ${e.valore}`;
  return m[e.tipo] || e.tipo;
}

/* ---- 8. Invito: il link porta con sé la scheda, così funziona prima della sync ---- */

/* Il link che lo sponsor manda a chiunque: non contiene una scheda gia' fatta,
   contiene CHI invita e DOVE si sincronizza. Chi lo apre si iscrive da se'
   e risulta agganciato allo sponsor senza che lo sponsor inserisca niente. */
function linkSponsor(id){
  /* Solo il codice dopo il cancelletto. L'indirizzo del foglio l'app lo sa da sola (FOGLIO_URL),
     e il nome dello sponsor arriva con la prima sincronizzazione: portarli nel link lo allungava
     al doppio senza aggiungere niente. */
  return location.origin + location.pathname + "#" + id;
}

function linkInvito(p){
  const base = location.origin + location.pathname;
  const sp = p.sponsor && S.persone[p.sponsor] ? S.persone[p.sponsor].nome : "";
  const q = new URLSearchParams({ i:p.id, n:p.nome, s:p.sponsor||"", sn:sp, d:giorno(p.creato) });
  return base + "#" + q.toString();
}
const FORMA_CODICE = /^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{6}$/;
function invitoDaHash(){
  const h = location.hash.replace(/^#/,"");
  if(!h) return null;
  /* forma corta: #WZUXYT */
  if(FORMA_CODICE.test(h.toUpperCase())) return { tipo:"sponsor", sp:h.toUpperCase(), spn:"", u:"" };
  const q = new URLSearchParams(h);
  /* forma lunga, per i link gia' mandati in giro: #sp=...&spn=...&u=... */
  if(q.get("sp")) return { tipo:"sponsor", sp:q.get("sp"), spn:q.get("spn")||"", u:q.get("u")||"" };
  if(q.get("i") && q.get("n")) return { tipo:"scheda", i:q.get("i"), n:q.get("n"),
    s:q.get("s")||null, sn:q.get("sn")||"", d:q.get("d")||giorno(OGGI()) };
  return null;
}

/* ---- 9. Unione: mai sostituire. Idempotente. ---- */

function unisci(altro){
  if(!altro || typeof altro!=="object") throw new Error("formato");
  Object.assign(S.cancellati, altro.cancellati||{});
  for(const id in (altro.persone||{})){
    if(S.cancellati[id]) continue;
    const a = altro.persone[id], b = S.persone[id];
    if(!b) S.persone[id] = a;
    else if((a.updatedAt||"") > (b.updatedAt||"")) S.persone[id] = Object.assign({}, b, a);
  }
  const visti = new Set(S.eventi.map(e=>e.id));
  for(const e of (altro.eventi||[])){
    if(!visti.has(e.id) && !S.cancellati[e.id]){ S.eventi.push(e); visti.add(e.id); }
  }
  for(const id in (altro.aperture||{})){
    const set = new Set((S.aperture[id]||[]).concat(altro.aperture[id]||[]));
    S.aperture[id] = Array.from(set).sort().slice(-60);
  }
  if(!S.leader && altro.leader) S.leader = altro.leader;
  salva();
}
function pacchetto(){
  return { v:1, leader:S.leader, persone:S.persone, eventi:S.eventi,
           aperture:S.aperture, cancellati:S.cancellati };
}
function pacchettoMio(){
  const mieId = new Set([S.me].concat(discendenti(S.me).map(p=>p.id)));
  const persone = {}; for(const id of mieId) if(S.persone[id]) persone[id]=S.persone[id];
  const aperture = {}; for(const id of mieId) if(S.aperture[id]) aperture[id]=S.aperture[id];
  return { v:1, leader:S.leader, persone,
           eventi:S.eventi.filter(e=>mieId.has(e.persona) || mieId.has(e.by)),
           aperture, cancellati:S.cancellati };
}

/* ---- 10. Sincronizzazione (foglio Google via Apps Script) ---- */

/* Il foglio Google impiega 6-20 secondi a rispondere: e' il costo di Sheets e non si abbassa.
   Percio' la sincronizzazione non deve MAI far aspettare nessuno — parte da sola in sottofondo,
   non si sovrappone a se stessa, e in silenzio non disturba se la rete non c'e'. */
let sincronizzando = false;
let syncProgrammata = null;

async function sincronizza(opzioni){
  const zitto = !!(opzioni && opzioni.silenzioso);
  const riprova = !(opzioni && opzioni.senzaRiprova);
  if(!S.sync.url){ if(!zitto) toast("Manca l'indirizzo"); return; }
  if(sincronizzando) return;                 // due giri insieme si pesterebbero i piedi
  sincronizzando = true; render();
  try{
    const res = await fetch(S.sync.url, {
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" }, // evita il preflight CORS
      body: JSON.stringify({ azione:"sync", me:S.me, dati:pacchettoMio() })
    });
    const out = await res.json();
    if(!out || out.errore) throw new Error(out && out.errore ? out.errore : "risposta vuota");
    if(out.dati) unisci(out.dati);
    S.sync.ultimo = iso(OGGI()); salva();
    if(!zitto) toast("Fatto");
  }catch(e){
    /* Niente e' perduto: quello che hai segnato resta sul telefono e riparte al prossimo giro.
       Un tentativo solo in piu', poi si lascia stare: insistere peggiora la coda. */
    if(riprova){
      sincronizzando = false;
      await new Promise(r=>setTimeout(r, 6000));
      return sincronizza({ silenzioso:zitto, senzaRiprova:true });
    }
    if(!zitto) toast(String(e).includes("blocco") || String(e).includes("occupato")
      ? "Il foglio è occupato, riprovo più tardi" : "Non riesco a collegarmi");
  }
  sincronizzando = false;
  render();
}

/* Dopo ogni cosa registrata: manda in sottofondo, senza che l'utente ci pensi.
   Aspetta qualche secondo cosi' tre spunte di fila diventano una chiamata sola. */
function programmaSync(){
  if(!S.sync.url) return;
  clearTimeout(syncProgrammata);
  syncProgrammata = setTimeout(()=>sincronizza({silenzioso:true}), 2500);
}

/* Google concede a uno script circa 90 minuti di esecuzione al giorno, per tutti insieme, e ogni
   chiamata ne consuma 6-20 secondi. Quindi le chiamate a vuoto non sono gratis: sono il margine
   che serve quando le persone saranno molte. Si sincronizza all'apertura solo se c'e' davvero
   qualcosa da mandare, o se i dati che si hanno sono vecchi. Il pulsante manuale non guarda nulla
   di tutto questo: quando lo premi, parte. */
const FRESCHEZZA_MINUTI = 20;

function qualcosaDaMandare(){
  const ultimo = S.sync.ultimo;
  if(!ultimo) return true;
  const mieId = new Set([S.me].concat(discendenti(S.me).map(p=>p.id)));
  for(const e of S.eventi) if((mieId.has(e.persona) || mieId.has(e.by)) && e.at > ultimo) return true;
  for(const id of mieId){
    const p = S.persone[id];
    if(p && (p.updatedAt||"") > ultimo) return true;
  }
  for(const id in S.cancellati) if(S.cancellati[id] > ultimo) return true;
  const ap = S.aperture[S.me] || [];
  return ap.some(d => d > ultimo);
}

function datiVecchi(){
  if(!S.sync.ultimo) return true;
  return (Date.now() - new Date(S.sync.ultimo).getTime()) > FRESCHEZZA_MINUTI*60000;
}

/* Chiede al foglio senza scrivere nulla. Restituisce l'archivio, o null se non si arriva. */
async function chiediAlFoglio(chi){
  if(!S.sync.url) return null;
  try{
    const res = await fetch(S.sync.url, {
      method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify({ azione:"sync", me:chi||null,
                             dati:{ v:1, persone:{}, eventi:[], aperture:{}, cancellati:{} } })
    });
    const out = await res.json();
    if(!out || out.errore) return null;      // un errore non e' una risposta
    return out.dati || null;
  }catch(e){ return null; }
}

/* ---- 11. Azioni ---- */

function segnaApertura(){
  if(!S.me) return;
  const l = S.aperture[S.me] || [];
  const oggi = giorno(OGGI());
  if(!l.some(d=>giorno(d)===oggi)){ l.push(iso(OGGI())); S.aperture[S.me]=l.slice(-60); salva(); }
}

function creaPersona(nome, sponsor, data){
  const id = codice();
  S.persone[id] = { id, nome:nome.trim(), sponsor:sponsor||null,
    creato: iso(new Date(data||OGGI())), dichiarato:null, updatedAt: iso(OGGI()) };
  const quando = iso(new Date(data||OGGI()));
  S.eventi.push({ id:uid(), persona:id, tipo:"iscrizione", valore:null, at:quando, by:sponsor||id });
  if(sponsor) S.eventi.push({ id:uid(), persona:sponsor, tipo:"sponsorizzazione",
                              valore:nome.trim(), at:quando, by:sponsor });
  salva();
  return id;
}

function scarica(nome, testo){
  const b = new Blob([testo], {type:"application/json"});
  const u = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href=u; a.download=nome; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(u), 2000);
}
async function copia(testo){
  try{ await navigator.clipboard.writeText(testo); toast("Copiato"); }
  catch(e){ toast("Copia a mano dal riquadro"); }
}

document.addEventListener("click", async ev => {
  const tab = ev.target.closest("[data-tab]");
  if(tab){ vista = tab.dataset.tab; apertoId=null; render(); window.scrollTo(0,0); return; }

  const tg = ev.target.closest("[data-toggle]");
  if(tg){
    const k = tg.dataset.toggle;
    if(chiusi.has(k)) chiusi.delete(k); else chiusi.add(k);
    render(); return;
  }

  const pb = ev.target.closest("[data-persona]");
  if(pb){ apriFoglio("persona", { id: pb.dataset.persona }); return; }

  const b = ev.target.closest("[data-act]");
  if(!b) return;
  const a = b.dataset.act, id = b.dataset.id;

  if(a==="chiudi") return chiudiFoglio();

  if(a==="crea-leader"){
    const nome = (document.getElementById("leadName").value||"").trim();
    if(!nome) return toast("Scrivi il tuo nome");
    /* Seconda serratura: anche chi conoscesse questo indirizzo non puo' creare un secondo
       capofila, perche' prima si chiede al foglio se ce n'e' gia' uno. Un secondo capofila
       farebbe nascere un'organizzazione parallela che non si unira' mai alla prima. */
    b.disabled = true; b.textContent = "Controllo…";
    const gia = await chiediAlFoglio(null);
    b.disabled = false; b.textContent = "Apro io l'organizzazione";
    if(gia === null) return alert("Non riesco a controllare il foglio, e senza quel controllo "
      + "non apro niente: due capofila spaccherebbero l'organizzazione in due.\n\nRiprova fra un momento.");
    if(gia.leader && gia.persone && gia.persone[gia.leader])
      return alert("L'organizzazione esiste già: l'ha aperta "
        + gia.persone[gia.leader].nome + ".\n\nPer entrare serve il link del tuo sponsor.");
    const nid = creaPersona(nome, null, OGGI());
    S.me = nid; S.leader = nid; salva(); segnaApertura(); vista="tutti"; return render();
  }

  if(a==="entra-codice"){
    const c = (document.getElementById("codeIn").value||"").trim().toUpperCase();
    if(!c) return toast("Incolla il codice");
    if(S.persone[c]){ S.me=c; salva(); segnaApertura(); return render(); }
    b.disabled = true; b.textContent = "Cerco…";
    const dati = await chiediAlFoglio(c);
    b.disabled = false; b.textContent = "Ritrova il mio percorso";
    if(dati === null) return toast("Non riesco a collegarmi, riprova");
    if(!dati.persone || !dati.persone[c]) return toast("Codice sconosciuto");
    unisci(dati); S.me = c; salva(); segnaApertura();
    toast("Bentornato, " + (S.persone[c].nome||"").split(" ")[0]);
    return render();
  }

  if(a==="accetta-sponsor"){
    const inv = invitoDaHash(); if(!inv) return;
    const nome = (document.getElementById("s0").value||"").trim();
    if(!nome) return toast("Scrivi il tuo nome");
    const g = n => Number((document.getElementById(n).value||"").trim())||null;
    const nid = codice();
    const ora = iso(OGGI());
    S.persone[nid] = { id:nid, nome, sponsor:inv.sp, creato:ora,
      tel:(document.getElementById("s1").value||"").trim()||null,
      dichiarato:{ euroMese:g("d1"), giorni100vp:g("d2"), personeDaSentire:g("d3"),
                   perche:(document.getElementById("d4").value||"").trim()||null },
      updatedAt: ora };
    /* segnaposto per lo sponsor: updatedAt vuoto, cosi' la scheda vera vince all'unione */
    if(!S.persone[inv.sp]) S.persone[inv.sp] = { id:inv.sp, nome:inv.spn||"Il mio sponsor",
      sponsor:null, creato:ora, dichiarato:null, updatedAt:"" };
    S.eventi.push({ id:uid(), persona:nid, tipo:"iscrizione", valore:null, at:ora, by:nid });
    /* L'indirizzo del foglio resta quello dell'app: un link non puo' dirottarla altrove. */
    S.me = nid; salva(); segnaApertura();
    history.replaceState(null,"",location.pathname);
    vista="oggi"; render();
    if(S.sync.url) sincronizza();   // cosi' lo sponsor lo vede comparire subito
    return;
  }

  if(a==="accetta-invito"){
    const inv = invitoDaHash(); if(!inv) return;
    const g = n => Number((document.getElementById(n).value||"").trim())||null;
    S.persone[inv.i] = { id:inv.i, nome:inv.n, sponsor:inv.s, creato:iso(new Date(inv.d)),
      tel:(document.getElementById("s1").value||"").trim()||null,
      dichiarato:{ euroMese:g("d1"), giorni100vp:g("d2"), personeDaSentire:g("d3"),

  if(a==="salva-primo-ordine"){
    const grezzo = (document.getElementById("poVp").value||"").trim();
    if(grezzo==="") return toast("Scrivi quanti VP");
    const v = Number(grezzo);
    if(isNaN(v) || v<0) return toast("Numero non valido");
    aggiungiEvento(id, "primo_ordine");
    aggiungiEvento(id, "vp", v);
    salva(); programmaSync(); chiudiFoglio();
    return toast(v>=SOGLIE.vpAttivazione ? "Bene, e sei già a " + v + " VP" : "Bene, sei partito");
  }

  if(a==="conta"){ aggiungiEvento(id, b.dataset.t); salva(); programmaSync(); render(); return toast("Segnato"); }

  if(a==="salva-nuovo"){
    const nome = (document.getElementById("nvNome").value||"").trim();
    const data = document.getElementById("nvData").value;
    if(!nome) return toast("Serve il nome");
    const nid = creaPersona(nome, S.me, data);
    const tel = (document.getElementById("nvTel").value||"").trim();
    if(tel){ S.persone[nid].tel = tel; S.persone[nid].updatedAt = iso(OGGI()); salva(); }
    return apriFoglio("invito", { id:nid });
  }

  if(a==="togli-persona"){
    const p = S.persone[id];
    if(!p) return;
    if(id===S.me || id===S.leader) return toast("Questa persona non si può togliere");
    if(!p.sponsor || !S.persone[p.sponsor])
      return toast("Non so a chi attaccare le sue persone: sincronizza e riprova");

    /* Chi chiude con Amway sparisce e le sue prime linee salgono al suo sponsor.
       E' come funziona davvero: il ramo non si perde, si accorcia di un anello. */
    const sotto = figliDi(id);
    const su = S.persone[p.sponsor];
    let avviso = "Togli " + p.nome + " dal gruppo.\n\n";
    if(sotto.length) avviso += (sotto.length===1
        ? "La sua persona passa a " : "Le sue " + sotto.length + " persone passano a ")
      + su.nome + " (" + sotto.map(x=>x.nome).join(", ") + "), con tutta "
      + (sotto.length===1 ? "la sua storia" : "la loro storia") + ".\n\n";
    avviso += "Sparisce dall'albero e dai conteggi, su tutti i telefoni. "
      + "Se sta ancora usando l'app, continuerà a vederla ma quello che segna non arriverà più.\n\n"
      + "Non si annulla dall'app.";
    if(!confirm(avviso)) return;

    const ora = iso(OGGI());
    /* prima si risale il ramo, poi si mette la pietra: invertendo, i figli non si troverebbero piu' */
    for(const f of sotto){
      S.persone[f.id] = Object.assign({}, S.persone[f.id], { sponsor: p.sponsor, updatedAt: ora });
    }
    S.cancellati[id] = ora;
    salva(); programmaSync(); chiudiFoglio();
    return toast(sotto.length
      ? p.nome.split(" ")[0] + " tolta, " + plur(sotto.length,"persona passata","persone passate") + " a " + su.nome.split(" ")[0]
      : p.nome.split(" ")[0] + " tolta dal gruppo");
  }

  if(a==="copia-link") return copia(linkInvito(S.persone[id]));
  if(a==="copia-mio-link") return copia(linkSponsor(S.me));

  if(a==="esporta"){
    scarica(`growup-${giorno(OGGI())}.json`, JSON.stringify(pacchetto()));
    return toast("Copia salvata");
  }
  if(a==="salva-tel"){
    const t = (document.getElementById("mioTel").value||"").trim();
    S.persone[S.me].tel = t || null;
    S.persone[S.me].updatedAt = iso(OGGI()); salva(); render();
    if(S.sync.url) sincronizza();
    return toast(t?"Numero salvato":"Numero tolto");
  }
  if(a==="sincronizza") return sincronizza();

  if(a==="reset"){
    if(!confirm("Cancella tutti i dati da questo telefono. Sicuro?")) return;
    localStorage.removeItem(CHIAVE); S = vuoto(); vista="oggi"; foglio=null; return render();
  }
});

document.addEventListener("change", ev => {
  const c = ev.target.closest("[data-fatto]");
  if(c){
    const tipo = c.dataset.fatto, pid = c.dataset.id;
    const e = primoEvento(pid, tipo);
    if(c.checked && !e){
      if(tipo==="primo_ordine"){ render(); return apriFoglio("primo-ordine", { id:pid }); }
      aggiungiEvento(pid, tipo);
    }
    else if(!c.checked && e) S.cancellati[e.id] = iso(OGGI());
    salva(); programmaSync(); render(); return;
  }
  const f = ev.target.closest("#fileIn");
  if(f && f.files && f.files[0]){
    const r = new FileReader();
    r.onload = () => {
      try{ unisci(JSON.parse(r.result)); chiudiFoglio(); toast("Unito"); }
      catch(e){ toast("File non leggibile"); }
    };
    r.readAsText(f.files[0]);
  }
});

/* ---- 12. Avvio ---- */
segnaApertura();
render();                                  // prima si disegna: la rete non deve far aspettare nessuno
if(S.me && S.sync.url && (qualcosaDaMandare() || datiVecchi()))
  sincronizza({ silenzioso:true });        // poi si sincronizza, in sottofondo, solo se serve
</script>
</body>
</html>
