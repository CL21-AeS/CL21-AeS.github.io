      const d = document.createElement("div"); d.id = "modal-layer"; document.body.appendChild(d); return d;
    })();
    layer.innerHTML = `<div class="scrim modal-scrim" data-act="close-modal"></div>
      <div class="modal-box" role="dialog" aria-modal="true">${html}</div>`;
    const box = layer.querySelector(".modal-box");
    if (onMount) onMount(box);
    const first = box.querySelector("input:not([type=hidden]), select, textarea");
    if (first && window.matchMedia("(min-width: 561px)").matches) first.focus();
  }

  function closeModal() {
    const layer = document.getElementById("modal-layer");
    if (layer) layer.innerHTML = "";
  }

  function toast(msg) {
    document.querySelectorAll(".toast").forEach(n => n.remove());
    const n = document.createElement("div");
    n.className = "toast"; n.setAttribute("role", "status"); n.textContent = msg;
    document.body.appendChild(n);
    clearTimeout(toastT);
    toastT = setTimeout(() => n.remove(), 2600);
  }

  function modalConfirm(title, body, label, onYes) {
    openModal(`<h2>${esc(title)}</h2><p class="row-sub" style="margin-top:6px">${esc(body)}</p>
      <div class="modal-actions" style="margin-top:18px">
        <button class="btn" data-act="close-modal">Annulla</button>
        <button class="btn btn-danger" id="yes">${esc(label)}</button>
      </div>`, box => {
      box.querySelector("#yes").addEventListener("click", () => { closeModal(); onYes(); render(); });
    });
  }

  function modalClient(c) {
    const nuovo = !c;
    const bd = c && c.birthday ? { mm: Number(c.birthday.slice(0, 2)), gg: Number(c.birthday.slice(3, 5)) } : null;
    openModal(`<div class="eyebrow">${nuovo ? "Nuovo cliente" : "Modifica"}</div>
      <h2>${nuovo ? "Chi è" : esc(c.name)}</h2>
      <form class="modal-form" id="f-client">
        <div class="field"><label for="c-name">Nome</label>
          <input id="c-name" type="text" required value="${esc(c ? c.name : "")}" placeholder="nome e cognome"></div>
        <div class="field"><label for="c-contact">Telefono o email</label>
          <input id="c-contact" type="text" value="${esc(c ? c.contact : "")}" placeholder="333 1234567">
          <span class="hint">Se metti il numero, dalla scheda lo chiami con un tocco.</span></div>
        <div class="field"><label for="c-origine">Come l'hai conosciuto</label>
          <input id="c-origine" type="text" value="${esc(c ? c.origine : "")}" placeholder="palestra, collega di Ale…"></div>
        <div class="field"><label>Compleanno</label>
          <div class="field-2">
            <select id="c-bg" aria-label="Giorno">
              <option value="">giorno</option>
              ${Array.from({ length: 31 }, (_, i) => `<option value="${i + 1}"
                ${bd && bd.gg === i + 1 ? "selected" : ""}>${i + 1}</option>`).join("")}
            </select>
            <select id="c-bm" aria-label="Mese">
              <option value="">mese</option>
              ${MESI.map((m, i) => `<option value="${i + 1}" ${bd && bd.mm === i + 1 ? "selected" : ""}>${m}</option>`).join("")}
            </select>
          </div>
          <span class="hint">Senza anno: serve solo il giorno. Ti avviso qualche giorno prima.</span></div>
        <div class="field"><label for="c-note">Note</label>
          <textarea id="c-note" placeholder="cosa gli serve, allergie, abitudini…">${esc(c ? c.note : "")}</textarea></div>
        <div class="modal-actions">
          <button type="button" class="btn" data-act="close-modal">Annulla</button>
          <button type="submit" class="btn btn-primary">${nuovo ? "Aggiungi" : "Salva"}</button>
        </div>
      </form>`, box => {
      box.querySelector("#f-client").addEventListener("submit", ev => {
        ev.preventDefault();
        const name = box.querySelector("#c-name").value.trim();
        if (!name) return;
        const gg = parseInt(box.querySelector("#c-bg").value, 10);
        const mm = parseInt(box.querySelector("#c-bm").value, 10);
        const dati = {
          name,
          contact: box.querySelector("#c-contact").value.trim(),
          origine: box.querySelector("#c-origine").value.trim(),
          note: box.querySelector("#c-note").value.trim(),
          birthday: gg && mm ? `${String(mm).padStart(2, "0")}-${String(gg).padStart(2, "0")}` : "",
        };
        if (nuovo) {
          const nc = {
            id: uid(), ...dati, closed: "", nextDate: "", nextNote: "", fromLista: "", augurato: "",
            createdAt: todayISO(), updatedAt: nowISO(), dropped: [], orders: [],
          };
          state.clients.push(nc);
          openId = nc.id;
        } else Object.assign(c, dati), touch(c);
        save(); closeModal(); render();
        toast(nuovo ? "Cliente aggiunto — ora registra cosa ha preso" : "Salvato");
        if (nuovo) modalOrder(byId(openId));
      });
    });
  }

  /* La finestra dell'ordine è il gesto che si ripete di più: dev'essere corta.
     Per questo arriva già compilata con quello che il cliente usa — riordinare
     «come l'ultima volta» è un tocco — e i prodotti che non esistono ancora si
     scrivono qui, senza passare dal catalogo. */
  function modalOrder(c, prefill) {
    if (!c) return;
    const sh = shelf(c).filter(x => !x.dropped);
    let draft = (prefill && prefill.length ? prefill : sh.filter(x => x.daysTo <= state.settings.preavviso).map(x => x.productId))
      .map(pid => ({ productId: pid, qty: (sh.find(x => x.productId === pid) || {}).qty || 1, nome: "" }));
    if (!draft.length) draft = [{ productId: sh.length ? sh[0].productId : (state.products[0] ? state.products[0].id : "__new"), qty: 1, nome: "" }];

    const opzioni = sel => state.products
      .slice().sort((a, b) => a.name.localeCompare(b.name, "it"))
      .map(p => `<option value="${p.id}" ${sel === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")
      + `<option value="__new" ${sel === "__new" ? "selected" : ""}>+ nuovo prodotto…</option>`;

    openModal(`<div class="eyebrow">${esc(c.name)}</div>
      <h2>Ordine</h2>
      <form class="modal-form" id="f-order">
        <div class="field"><label>Prodotti</label><div id="ol" style="display:flex;flex-direction:column;gap:8px"></div>
          <div><button type="button" class="btn btn-sm" id="ol-add">+ Aggiungi riga</button></div></div>
        <div class="field-2">
          <div class="field"><label for="o-date">Quando</label>
            <input id="o-date" type="date" value="${todayISO()}" required></div>
          <div class="field"><label for="o-importo">Importo (facoltativo)</label>
            <input id="o-importo" type="number" min="0" step="0.01" placeholder="€"></div>
        </div>
        <div class="field"><label for="o-note">Note</label>
          <input id="o-note" type="text" placeholder="consegnato a mano, ordine fatto da lui…"></div>
        <div class="modal-actions">
          <button type="button" class="btn" data-act="close-modal">Annulla</button>
          <button type="submit" class="btn btn-primary">Registra l'ordine</button>
        </div>
      </form>`, box => {
      const ol = box.querySelector("#ol");

      /* Si legge dal contenitore della riga, non dalla griglia: il campo del nome
         del prodotto nuovo sta fuori dalla griglia — cercarlo lì dentro lo
         lasciava sempre vuoto, e l'ordine non si registrava. */
      const leggi = () => {
        [...ol.querySelectorAll(".oitem")].forEach((item, i) => {
          if (!draft[i]) return;
          draft[i].productId = item.querySelector("[data-role=p]").value;
          draft[i].qty = clamp(parseInt(item.querySelector("[data-role=q]").value, 10) || 1, 1, 99);
          const n = item.querySelector("[data-role=n]");
          if (n) draft[i].nome = n.value;
        });
      };

      const dipingi = () => {
        ol.innerHTML = draft.map((l, i) => `<div class="oitem">
          <div class="oline" data-i="${i}">
            <select data-role="p" aria-label="Prodotto">${opzioni(l.productId)}</select>
            <input data-role="q" type="number" min="1" max="99" value="${l.qty}" aria-label="Quantità">
            <button type="button" class="btn btn-sm btn-quiet" data-role="x" aria-label="Togli la riga">✕</button>
          </div>
          ${l.productId === "__new" ? `<input data-role="n" type="text" value="${esc(l.nome)}"
            placeholder="nome del prodotto nuovo" style="margin-top:8px">` : ""}
        </div>`).join("");
      };

      dipingi();
      ol.addEventListener("change", ev => {
        if (ev.target.dataset.role === "p") { leggi(); dipingi(); }
      });
      ol.addEventListener("click", ev => {
        const x = ev.target.closest("[data-role=x]");
        if (!x) return;
        const i = Number(x.closest(".oline").dataset.i);
        leggi(); draft.splice(i, 1);
        if (!draft.length) draft = [{ productId: "__new", qty: 1, nome: "" }];
        dipingi();
      });
      box.querySelector("#ol-add").addEventListener("click", () => {
        leggi(); draft.push({ productId: state.products[0] ? state.products[0].id : "__new", qty: 1, nome: "" }); dipingi();
      });

      box.querySelector("#f-order").addEventListener("submit", ev => {
        ev.preventDefault();
        leggi();
        const lines = [];
        let creati = 0;
        for (const l of draft) {
          let pid = l.productId;
          if (pid === "__new") {
            const nome = (l.nome || "").trim();
            if (!nome) continue;
            const esiste = state.products.find(p => p.name.trim().toLowerCase() === nome.toLowerCase());
            if (esiste) pid = esiste.id;
            else {
              /* Nato di corsa dentro un ordine: prende una durata di ripiego e un
                 segno che chiede di controllarla, perché da quel numero dipendono
                 tutte le scadenze di questo prodotto. */
              const np = { id: uid(), name: nome, days: DEFAULTS.durataNuovo, check: true, note: "", updatedAt: nowISO() };
              state.products.push(np); pid = np.id; creati++;
            }
          }
          const gia = lines.find(x => x.productId === pid);
          if (gia) gia.qty = clamp(gia.qty + l.qty, 1, 99);
          else lines.push({ productId: pid, qty: l.qty });
        }
        if (!lines.length) { toast("Scegli almeno un prodotto"); return; }

        pushOrder(c, lines, {
          date: box.querySelector("#o-date").value || todayISO(),
          importo: box.querySelector("#o-importo").value,
          note: box.querySelector("#o-note").value.trim(),
        });
        closeModal(); render();
        toast(creati ? `Ordine registrato — controlla la durata ${creati === 1 ? "del prodotto nuovo" : "dei prodotti nuovi"}` : "Ordine registrato");
      });
    });
  }

  /* ══ Messaggi ══════════════════════════════════════════════════════════

     Qui l'app esce per un momento dal suo mestiere di calendario. Non è una
     raccolta di messaggi — quella è roba di SofIA — ma le tre righe che servono
     nell'istante esatto in cui questa pagina ti dice di scrivere: arrivano già
     col nome e col prodotto dentro, si correggono, si copiano, e da qui parte
     WhatsApp. Restano modificabili perché la voce è tua.                     */

  const primoNome = c => String(c.name || "").trim().split(/\s+/)[0] || c.name;

  /* Copiare da dentro la cornice della piattaforma non è scontato: l'API moderna
     degli appunti chiede un permesso che l'artifact non ha e rifiuta senza fare
     rumore — per questo l'avviso diceva «copiato» quando negli appunti non c'era
     niente. Il vecchio `execCommand`, dentro un tocco dell'utente, passa dove
     l'altra non passa: si prova prima quello. E se non passa nessuna delle due,
     si dice come stanno le cose invece di annunciare una copia che non esiste. */
  /* Si copia sempre da una casella temporanea fuori vista, mai dal campo che si
     sta guardando: selezionare quello gli darebbe il fuoco e su un telefono
     farebbe salire la tastiera a ogni «Copia». La casella è di sola lettura, che
     la tastiera non la chiama, e sparisce subito. */
  async function copiaStringa(testo) {
    const t = document.createElement("textarea");
    t.value = testo;
    t.readOnly = true;
    t.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
    document.body.appendChild(t);
    try {
      t.focus();
      t.setSelectionRange(0, testo.length);
      if (document.execCommand && document.execCommand("copy")) return true;
    } catch (e) { /* si prova l'altra strada */ }
    finally { t.remove(); }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(testo);
        return true;
      }
    } catch (e) { /* appunti negati */ }
    return false;
  }

  /* Ultima via quando entrambe le strade sono chiuse: il testo resta selezionato
     e glielo si dice, invece di annunciare una copia che non è avvenuta. */
  function selezionaPerMano(el) {
    if (!el) return;
    try { el.focus(); el.setSelectionRange(0, el.value.length); } catch (e) {}
  }

  function testiMessaggio(c, tipo) {
    const n = primoNome(c);
    const sh = shelf(c).filter(x => !x.dropped);

    if (tipo === "checkin") {
      const v = verifichePendenti(c)[0];
      const prod = v ? v.nuovi.map(prodName).join(" e ") : "quello che hai preso";
      const gg = v ? daysBetween(v.order.date, todayISO()) : state.settings.dopoAcquisto;
      return {
        titolo: "Come ti sei trovato",
        guida: `Sono passati ${plur(gg, "giorno", "giorni")} dall'ordine: il prodotto ha avuto il tempo di
          farsi giudicare, e se qualcosa non va sei ancora in tempo a sistemarlo. Questo messaggio non
          chiede niente — ed è per questo che funziona: è il punto in cui uno che ha provato diventa uno
          che ricompra.`,
        azione: "Fatto, gliel'ho chiesto",
        varianti: [
          { label: "Aperto", testo: `Ciao ${n}, sono passati ${gg} giorni da quando hai preso ${prod}: come ti stai trovando?\n\nSe c'è qualcosa che non ti torna dimmelo pure — mi interessa più sapere com'è andata che venderti altro.` },
          { label: "Pratico", testo: `Ciao ${n}, ti scrivo per sapere come va con ${prod}. Riesci a usarlo tutti i giorni? Se hai dubbi su quanto prenderne o su quando, chiedimi: sono due minuti.` },
          { label: "Corto", testo: `Ciao ${n}, tutto bene con ${prod}?` },
        ],
      };
    }

    if (tipo === "proposta") {
      const suggerito = sh.length ? sh[0].name : "quello che usa di solito";
      return {
        titolo: "Il pensiero di compleanno",
        guida: `Gli auguri glieli hai già fatti: questa è la proposta, che arriva dopo e per questo non
          sembra il conto del ristorante. Le parentesi quadre vanno riempite, e prometti solo quello che
          puoi mantenere davvero — uno sconto inventato si paga più caro del regalo.`,
        azione: "Fatto, gliel'ho mandata",
        varianti: [
          { label: "Il regalo", testo: `Ciao ${n}, ti devo ancora il regalo di compleanno. Ho pensato a [scrivi cosa: un campione, un prodotto in omaggio, lo sconto che puoi fare]: se ti va te lo porto con il prossimo ordine.` },
          { label: "Sul prodotto", testo: `Ciao ${n}, per il tuo compleanno volevo farti un pensiero: su ${suggerito} posso lasciarti [scrivi cosa] fino a [data]. Dimmi se ti interessa e te lo metto da parte.` },
        ],
      };
    }

    if (tipo === "auguri") {
      const b = compleanno(c);
      const suggerito = sh.length ? sh[0].name : "quello che usa di solito";
      return {
        titolo: "Auguri",
        guida: `Gli auguri restano auguri. Se ci attacchi un'offerta diventano il pretesto per vendere, e si
          sente subito. La proposta, se vuoi farla, va qualche giorno dopo: qui sotto c'è il testo, e l'app
          te la ricorda.`,
        azione: "Auguri fatti",
        varianti: [
          { label: "Semplice", testo: `Buon compleanno ${n}! Ti auguro una giornata come la vuoi tu.` },
          { label: "Caldo", testo: `Tanti auguri ${n}! Spero che oggi ti facciano festeggiare come si deve. Un abbraccio.` },
        ],
        dopo: {
          titolo: "La proposta, qualche giorno dopo",
          avviso: `Le parentesi quadre vanno riempite, e prometti solo quello che puoi mantenere davvero:
            uno sconto inventato si paga più caro del regalo.`,
          varianti: [
            { label: "Il regalo", testo: `Ciao ${n}, ti devo ancora il regalo di compleanno. Ho pensato a [scrivi cosa: un campione, un prodotto in omaggio, lo sconto che puoi fare]: se ti va te lo porto con il prossimo ordine.` },
            { label: "Sul prodotto", testo: `Ciao ${n}, per il tuo compleanno volevo farti un pensiero: su ${suggerito} posso lasciarti [scrivi cosa] fino a [data]. Dimmi se ti interessa e te lo metto da parte.` },
          ],
          promemoria: b ? 3 : 3,
        },
      };
    }

    const x = sh[0];
    const prod = x ? x.name : "quello che prendi di solito";
    const quanti = x && x.qty > 1 ? ` Te ne riporto ${x.qty} come l'altra volta?` : "";
    return {
      titolo: "Sta finendo",
      guida: x
        ? `Secondo i conti ${prod} è finito ${relDue(x.daysTo)}. Chiedere non è insistere: se dice che ne ha
           ancora, usa «Rimanda» e la data si sposta senza perdere niente.`
        : `Chiedere non è insistere: se dice che ne ha ancora, usa «Rimanda» e la data si sposta.`,
      azione: "",
      varianti: [
        { label: "Diretto", testo: `Ciao ${n}, se non ho sbagliato i conti ${prod} ti sta finendo in questi giorni. Te ne serve ancora?${quanti}` },
        { label: "Con l'ordine", testo: `Ciao ${n}, sto per fare un ordine: ti aggiungo ${prod}? Dovrebbe essere più o meno il momento in cui finisce.` },
        { label: "Dopo un silenzio", testo: `Ciao ${n}, mi sono accorto che non ci sentiamo da un po'. Come stai?\n\nIl ${prod} l'hai finito o hai deciso di lasciarlo? Dimmelo tranquillamente, non me la prendo — mi serve solo per non farti telefonate a vuoto.` },
      ],
    };
  }

  /* Un blocco = pastiglie per scegliere il tono, il testo modificabile, copia e
     WhatsApp. Ne servono due nella stessa finestra (auguri e proposta), quindi
     è una funzione sola usata due volte. */
  function bloccoMessaggio(id, varianti, link, etichetta) {
    return `<div class="field" style="margin-top:14px">
      <label for="${id}-t">${esc(etichetta || "Il messaggio")}</label>
      <div class="opts" style="margin-bottom:2px">${varianti.map((v, i) =>
        `<input type="radio" name="${id}-v" id="${id}-v${i}" value="${i}" ${i === 0 ? "checked" : ""}>
         <label for="${id}-v${i}">${esc(v.label)}</label>`).join("")}</div>
      <textarea id="${id}-t" style="min-height:152px">${esc(varianti[0].testo)}</textarea>
      <div class="btn-row" style="margin-top:2px">
        <button type="button" class="btn btn-sm ${link ? "" : "btn-primary"}" data-copy="${id}">Copia</button>
        ${link ? `<a class="btn btn-sm btn-primary" id="${id}-wa" target="_blank" rel="noopener"
          href="https://wa.me/${esc(link.num)}">Apri WhatsApp</a>
        ${dentroCornice ? "" : `<a class="btn btn-sm" id="${id}-tg" target="_blank" rel="noopener"
          href="https://t.me/+${esc(link.num)}">Copia e apri Telegram</a>`}` : ""}
      </div>
    </div>`;
  }

  function collegaBlocco(box, id, varianti, link) {
    const ta = box.querySelector("#" + id + "-t");
    const wa = box.querySelector("#" + id + "-wa");
    const tg = box.querySelector("#" + id + "-tg");
    /* WhatsApp apre la chat della persona col messaggio già dentro. Telegram non
       sa fare le due cose insieme, e delle sue due mezze strade una sola funziona
       davvero sul telefono: `t.me/+numero` apre la chat giusta — provato dalla
       scheda del cliente — mentre `t.me/share/url?text=` non passa la mano all'app
       e resta lì. Quindi il testo lo portano gli appunti, che ora sono affidabili:
       un tocco copia e apre la conversazione, e resta da incollare. */
    const aggiorna = () => {
      if (wa) wa.href = `https://wa.me/${link.num}?text=${encodeURIComponent(ta.value)}`;
    };
    if (tg) tg.addEventListener("click", async () => {
      toast(await copiaStringa(ta.value)
        ? "Testo copiato: in Telegram tieni premuto e incolla"
        : "Appunti bloccati: copia il testo a mano prima di scrivergli");
    });
    aggiorna();
    ta.addEventListener("input", aggiorna);
    box.querySelectorAll(`input[name="${id}-v"]`).forEach(r => r.addEventListener("change", () => {
      ta.value = varianti[Number(r.value)].testo;
      aggiorna();
    }));
    const copia = box.querySelector(`[data-copy="${id}"]`);
    copia.addEventListener("click", async () => {
      if (await copiaStringa(ta.value)) { toast("Messaggio copiato"); return; }
      selezionaPerMano(ta);
      toast("Appunti bloccati: il testo è selezionato, copialo a mano");
    });
  }

  function modalMessaggio(c, tipo) {
    const m = testiMessaggio(c, tipo);
    const link = telLink(c.contact);
    const b = compleanno(c);
    openModal(`<div class="eyebrow">${esc(c.name)}</div>
      <h2>${esc(m.titolo)}</h2>
      <p class="row-sub" style="margin-top:6px">${m.guida}</p>
      ${bloccoMessaggio("msg", m.varianti, link)}
      ${!link ? `<p class="row-sub">Senza numero in scheda non si apre né WhatsApp né Telegram: copia il
        testo, o aggiungi il numero con «Modifica».</p>`
        : dentroCornice ? `<p class="row-sub" style="font-size:12px">Per Telegram qui non c'è il pulsante:
          da questa anteprima porterebbe alla sua pagina web che chiede l'accesso. Tocca <b>Copia</b> e
          passa a Telegram a mano — gli appunti funzionano. Dal link del sito il pulsante c'è e apre
          l'app.</p>` : ""}
      ${m.dopo ? `<details class="fold" style="margin-top:16px"><summary>${esc(m.dopo.titolo)}</summary>
        <div class="fold-body">
          <p class="row-sub">${m.dopo.avviso}</p>
          ${bloccoMessaggio("dopo", m.dopo.varianti, link, "La proposta")}
          <label style="display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer">
            <input type="checkbox" id="msg-prom" checked style="width:auto;margin-top:3px">
            <span>Ricordami fra ${m.dopo.promemoria} giorni di mandargliela</span>
          </label>
        </div></details>` : ""}
      <div class="modal-actions" style="margin-top:16px">
        <button type="button" class="btn" data-act="close-modal">Chiudi</button>
        ${m.azione ? `<button type="button" class="btn" id="msg-done">${esc(m.azione)}</button>` : ""}
      </div>`, box => {
      collegaBlocco(box, "msg", m.varianti, link || { wa: "" });
      if (m.dopo) collegaBlocco(box, "dopo", m.dopo.varianti, link || { wa: "" });
      const done = box.querySelector("#msg-done");
      if (!done) return;
      done.addEventListener("click", () => {
        if (tipo === "proposta") {
          c.nextDate = ""; c.nextNote = ""; c.nextKind = "rimanda";
          touch(c); save(); closeModal(); render(); toast("Segnato: gliel'hai mandata");
          return;
        }
        if (tipo === "checkin") {
          const v = verifichePendenti(c)[0];
          if (v) v.order.checkin = todayISO();
          touch(c); save(); closeModal(); render(); toast("Segnato: gliel'hai chiesto");
          return;
        }
        if (tipo === "auguri") {
          if (b) c.augurato = String(b.anno);
          const prom = box.querySelector("#msg-prom");
          const giorni = m.dopo ? m.dopo.promemoria : 3;
          let messo = false;
          if (prom && prom.checked) {
            /* Non sovrascrivo un promemoria già tuo: quello che ti eri scritto vale
               più di quello che ti propongo io. */
            if (c.nextDate && c.nextDate > todayISO()) messo = false;
            else {
              c.nextDate = iso(addDays(new Date(), giorni));
              c.nextNote = "il pensiero di compleanno";
              c.nextKind = "nota";
              messo = true;
            }
          }
          touch(c); save(); closeModal(); render();
          toast(messo ? `Auguri segnati — te lo ricordo il ${fmtDate(c.nextDate)}`
            : "Auguri segnati" + (prom && prom.checked ? " — avevi già un promemoria, l'ho lasciato" : ""));
        }
      });
    });
  }

  function modalSnooze(c) {
    const opts = [[3, "3 giorni"], [7, "una settimana"], [14, "due settimane"], [30, "un mese"]];
    openModal(`<div class="eyebrow">${esc(c.name)}</div>
      <h2>Quando lo risenti</h2>
      <p class="row-sub" style="margin-top:6px">Fino a quel giorno non lo trovi più fra chi va sentito.</p>
      <div class="opts" style="margin-top:14px">${opts.map(([n, l], i) =>
        `<input type="radio" name="sn" id="sn${i}" value="${n}" ${i === 1 ? "checked" : ""}>
         <label for="sn${i}">${l}</label>`).join("")}</div>
      <div class="modal-form">
        <div class="field"><label for="sn-note">Perché</label>
          <input id="sn-note" type="text" value="${esc(c.nextNote)}" placeholder="ne ha ancora, in vacanza…"></div>
        <div class="modal-actions">
          <button type="button" class="btn" data-act="close-modal">Annulla</button>
          <button type="button" class="btn btn-primary" id="ok">Rimanda</button>
        </div>
      </div>`, box => {
      box.querySelector("#ok").addEventListener("click", () => {
        const n = Number((box.querySelector("input[name=sn]:checked") || {}).value || 7);
        c.nextDate = iso(addDays(new Date(), n));
        c.nextNote = box.querySelector("#sn-note").value.trim();
        c.nextKind = "rimanda";
        touch(c); save(); closeModal(); render();
        toast("Rimandato al " + fmtDate(c.nextDate));
      });
    });
  }

  function modalClose(c) {
    openModal(`<div class="eyebrow">${esc(c.name)}</div>
      <h2>Chiudere il cliente</h2>
      <p class="row-sub" style="margin-top:6px">Resta nell'elenco con la sua storia, ma non compare più
        fra chi va sentito.</p>
      <div class="opts" style="margin-top:14px">${CLOSED.map((x, i) =>
        `<input type="radio" name="cl" id="cl${i}" value="${x.id}" ${i === 0 ? "checked" : ""}>
         <label for="cl${i}">${esc(x.label)}</label>`).join("")}</div>
      <div class="modal-actions" style="margin-top:18px">
        <button type="button" class="btn" data-act="close-modal">Annulla</button>
        <button type="button" class="btn btn-primary" id="ok">Chiudi</button>
      </div>`, box => {
      box.querySelector("#ok").addEventListener("click", () => {
        c.closed = (box.querySelector("input[name=cl]:checked") || {}).value || "perso";
        c.nextDate = ""; c.nextNote = "";
        touch(c); save(); closeModal(); render(); toast("Cliente chiuso");
      });
    });
  }

  function modalPickClient() {
    const list = [...state.clients].filter(c => !c.closed).sort((a, b) => a.name.localeCompare(b.name, "it"));
    if (!list.length) { toast("Aggiungi prima un cliente"); return; }
    openModal(`<h2>Per chi è l'ordine</h2>
      <form class="modal-form" id="f-pick">
        <div class="field"><label for="pk">Cliente</label>
          <select id="pk">${list.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div>
        <div class="modal-actions">
          <button type="button" class="btn" data-act="close-modal">Annulla</button>
          <button type="submit" class="btn btn-primary">Avanti</button>
        </div>
      </form>`, box => {
      box.querySelector("#f-pick").addEventListener("submit", ev => {
        ev.preventDefault();
        const c = byId(box.querySelector("#pk").value);
        closeModal();
        if (c) { openId = c.id; modalOrder(c); }
      });
    });
  }

  /* Registrare un ordine non è solo aggiungere una riga: risponde al promemoria
     che c'era, riapre chi era stato dato per perso e rimette fra i seguiti un
     prodotto che era stato messo da parte. Un punto solo, perché queste tre cose
     valgono sia dalla finestra dell'ordine sia dal tocco singolo sulla scheda. */
  function pushOrder(c, lines, opts) {
    const o = {
      id: uid(),
      date: (opts && opts.date) || todayISO(),
      importo: Math.max(0, Number(opts && opts.importo) || 0),
      note: (opts && opts.note) || "",
      checkin: "",
      lines,
    };
    c.orders.push(o);
    c.orders.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    if (c.nextDate && c.nextDate <= o.date) { c.nextDate = ""; c.nextNote = ""; }
    if (c.closed === "perso") c.closed = "";
    /* Chi ricompra ha già risposto alla domanda «come ti sei trovato»: la verifica
       su quel vecchio ordine non serve più. Quella dell'ordine appena registrato
       resta in piedi — la si esclude per identificativo. */
    for (const v of verifichePendenti(c)) {
      if (v.order.id !== o.id && v.nuovi.some(pid => lines.some(l => l.productId === pid))) v.order.checkin = "no";
    }
    c.dropped = c.dropped.filter(x => !lines.some(l => l.productId === x.productId));
    touch(c); save();
    return o;
  }

  /* ══ Copie ════════════════════════════════════════════════════════════ */

  /* Due strade, e servono entrambe. Aperta dal link, la pagina non può scaricare
     da sé: il salvataggio passa dalla piattaforma, che chiede il permesso al
     volo. Aperta come file dal computer quella strada non esiste e si scarica
     alla vecchia maniera. Quando siamo nel link e la piattaforma non concede il
     salvataggio, il vecchio metodo non funziona affatto: lì si dice di copiare il
     testo, invece di far finta di aver salvato. */
  async function backupFile() {
    const data = JSON.stringify(state, null, 2);
    const name = `clienti-riordini-${todayISO()}.json`;
    const ospitata = !!(window.claude && claude.use);
    let dl = null;
    try { dl = ospitata ? await claude.use("downloads") : null; } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename: name, data }); markBackup(); render(); toast("Copia salvata"); }
      catch (err) {
        const code = err && err.code;
        if (code === "declined") return;
        if (code === "rate_limited") { toast("Aspetta un attimo e riprova"); return; }
        if (code === "too_large") { toast("Archivio troppo grande: copia il testo"); return; }
        toast("Non è stato possibile salvare: copia il testo");
      }
      return;
    }
    if (ospitata) { toast("Qui il download non è disponibile: copia il testo"); return; }
    try {
      const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
      const a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      markBackup(); render(); toast("Copia salvata");
    } catch (e) { toast("Download non disponibile: copia il testo"); }
  }

  async function copyJSON() {
    const el = document.getElementById("json-out");
    if (!el) return;
    if (await copiaStringa(el.value)) { markBackup(); toast("Copiato"); return; }
    selezionaPerMano(el);
    toast("Appunti bloccati: il testo è selezionato, copialo a mano");
  }

  /* L'unione non toglie niente, quindi si applica e poi si racconta cosa è
     cambiato: chiedere conferma prima costringerebbe a decidere alla cieca. */
  function applyIncoming(d, from) {
    if (!d || typeof d !== "object") { toast("Non è un file valido"); return false; }
    /* Il file dell'altra app ha «people» al posto di «clients»: si riconosce da
       sé e prende un'altra strada, invece di dire che non è valido. */
    if (!Array.isArray(d.clients) && Array.isArray(d.people)) return importFromLista(d, from);
    if (!Array.isArray(d.clients)) { toast("Non è una copia di questa app"); return false; }
    const res = mergeStates(state, normalize(d));
    state = res.state;
    /* Aver caricato un archivio da un file dimostra che una copia esiste fuori da
       questo browser: vale come copia salvata, e il promemoria può tacere. */
    markBackup();
    save(); render();
    const { nuovi, aggiornati, rimossi, prodotti } = res.stats;
    const righe = [
      `${plur(state.clients.length, "cliente", "clienti")} in totale`,
      nuovi ? `${plur(nuovi, "cliente nuovo arrivato", "clienti nuovi arrivati")}` : "",
      aggiornati ? `${plur(aggiornati, "scheda aggiornata", "schede aggiornate")}` : "",
      prodotti ? `${plur(prodotti, "prodotto nuovo nel catalogo", "prodotti nuovi nel catalogo")}` : "",
      rimossi ? `${plur(rimossi, "cancellazione rispettata", "cancellazioni rispettate")}` : "",
    ].filter(Boolean);
    if (!nuovi && !aggiornati && !rimossi && !prodotti) righe.push("Era già tutto allineato");
    openModal(`<div class="eyebrow">${esc(from || "Unione")}</div>
      <h2>Archivi uniti</h2>
      <ul class="sum">${righe.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
      ${res.dupes.length ? `<div class="banner" style="margin-top:14px"><div>
        <b>${res.dupes.length === 1 ? "Un nome compare due volte" : "Alcuni nomi compaiono due volte"}:</b>
        ${esc(res.dupes.join(", "))}. Succede quando la stessa persona è stata scritta a mano su due
        dispositivi: hanno due schede separate e non le unisco da sola, per non fondere due omonimi.
        Aprine una, riporta quello che serve e cancella l'altra.</div></div>` : ""}
      <div class="modal-actions" style="margin-top:16px">
        <button class="btn btn-primary" data-act="close-modal">Va bene</button>
      </div>`);
    return true;
  }

  /* Quando le due app stanno sullo stesso indirizzo, la lista nomi è a portata di
     mano: si legge il suo archivio dal browser e i clienti arrivano con un tocco,
     senza esportare e ricaricare un file. Dove non c'è — il link dell'artifact,
     un altro dominio, un telefono dove la lista non è mai stata aperta — questa
     funzione torna niente e il blocco non compare: nessun errore da spiegare. */
  const CHIAVE_LISTA = "dalla-lista-al-si.v1";

  function listaVicina() {
    let raw = null;
    try { raw = localStorage.getItem(CHIAVE_LISTA); } catch (e) { return null; }
    if (!raw) return null;
    let d = null;
    try { d = JSON.parse(raw); } catch (e) { return null; }
    if (!d || !Array.isArray(d.people)) return null;
    const src = d.people.filter(p => p && p.outcome === "cliente" && String(p.name || "").trim());
    if (!src.length) return null;
    const nuovi = src.filter(p => !state.clients.some(c =>
      (p.id && c.fromLista === p.id) || c.name.trim().toLowerCase() === String(p.name).trim().toLowerCase()));
    return { d, tutti: src.length, nuovi: nuovi.length };
  }

  /* Ponte con «Dalla Lista al Sì»: da lì arrivano le persone chiuse come
     cliente. Non tocco nient'altro — le liste nomi restano affare di quell'app. */
  function importFromLista(d, from) {
    const src = d.people.filter(p => p && p.outcome === "cliente");
    let nuovi = 0, gia = 0;
    for (const p of src) {
      const nome = String(p.name || "").trim();
      if (!nome) continue;
      const esiste = state.clients.find(c =>
        (p.id && c.fromLista === p.id) || c.name.trim().toLowerCase() === nome.toLowerCase());
      if (esiste) { gia++; continue; }
      const chiusura = (Array.isArray(p.events) ? p.events : []).filter(e => e.type === "esito").pop();
      state.clients.push({
        id: uid(), name: nome,
        contact: p.contact || "",
        origine: p.origine || "",
        note: [p.note, chiusura && chiusura.note].filter(Boolean).join(" · "),
        closed: "", nextDate: p.nextDate || "", nextNote: p.nextNote || "",
        birthday: "", augurato: "", fromLista: p.id || "",
        createdAt: (chiusura && chiusura.date) || p.createdAt || todayISO(),
        updatedAt: nowISO(), dropped: [], orders: [],
      });
      nuovi++;
    }
    save(); render();
    openModal(`<div class="eyebrow">${esc(from || "Dalla Lista al Sì")}</div>
      <h2>${nuovi ? "Clienti importati" : "Niente da importare"}</h2>
      <ul class="sum">
        <li>${plur(src.length, "persona chiusa come cliente", "persone chiuse come cliente")} in quel file</li>
        ${nuovi ? `<li>${plur(nuovi, "portata qui", "portate qui")}</li>` : ""}
        ${gia ? `<li>${plur(gia, "era già in elenco", "erano già in elenco")}</li>` : ""}
      </ul>
      ${nuovi ? `<p class="row-sub" style="margin-top:10px">Ora sono senza ordini: registra cosa hanno
        preso e le scadenze partono.</p>` : ""}
      <div class="modal-actions" style="margin-top:16px">
        <button class="btn btn-primary" data-act="close-modal">Va bene</button>
      </div>`);
    return true;
  }

  function importPasted() {
    const el = document.getElementById("json-in");
    const raw = (el && el.value || "").trim();
    if (!raw) { toast("Incolla prima il testo della copia"); return; }
    let d;
    try { d = JSON.parse(raw); } catch (e) { toast("Il testo non è una copia valida"); return; }
    if (applyIncoming(d, "Dal testo incollato")) el.value = "";
  }

  async function importPickedFile(input) {
    const f = input.files && input.files[0];
    if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      applyIncoming(d, f.name);
    } catch (e) { toast("Il file non è una copia valida"); }
    input.value = "";
  }

  /* ══ Esempio ══════════════════════════════════════════════════════════

     Nomi e prodotti inventati, con durate verosimili: serve a vedere come si
     muove l'app, non a dire quanto dura un prodotto vero.                  */

  function demoData() {

        ], { birthday: B(0) }),

        ], { birthday: B(200) }),
        C("Marta Bo", "", "Le ho lasciato provare la crema, non l'ho più risentita.", [

        ]),

        ]),

        ]),

        C("Paolo Riva", "", "È partito con l'attività, ordina da sé.", [

      ],
    };
  }

  /* ══ Impalcatura ══════════════════════════════════════════════════════ */

  function renderRail() {
    const t = todo();
    const dueN = t.promemoria.length + t.ritardo.length + t.ora.length
      + t.verifiche.length + t.compleanni.length;
    const items = [
      { id: "oggi", label: "Oggi", icon: "◧", tally: dueN ? String(dueN) : "", hot: !!t.ritardo.length },
      { id: "clienti", label: "Clienti", icon: "☰", tally: String(state.clients.length) },
      { id: "prodotti", label: "Catalogo", icon: "◈", tally: String(state.products.length) },
      { id: "dati", label: "Dati", icon: "⚙", tally: "" },
    ];
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    document.getElementById("rail").innerHTML = `
      <div class="brand"><b>Clienti e Riordini</b><span class="eyebrow">${esc(state.settings.nome || "chi compra, e quando richiamarlo")}</span></div>
      ${items.map(i => `<button class="rail-btn" data-act="nav" data-view="${i.id}"
        ${view === i.id ? 'aria-current="page"' : ""}>
        <span aria-hidden="true" style="font-size:13px;width:14px;text-align:center">${i.icon}</span>
        <span>${i.label}</span>${i.tally ? `<span class="tally ${i.hot ? "hot" : ""}">${i.tally}</span>` : ""}</button>`).join("")}
      <div class="rail-foot">
        <button class="btn btn-sm btn-quiet" data-act="theme">${dark ? "☀ Chiaro" : "☾ Scuro"}</button>
        <span class="eyebrow" style="line-height:1.4">I dati restano su questo dispositivo</span>
      </div>`;
  }

  function render() {
    renderRail();
    const body = view === "clienti" ? viewClienti() : view === "prodotti" ? viewProdotti()
      : view === "dati" ? viewDati() : viewOggi();
    const banner = (!storageOk && view !== "dati")
      ? `<div class="banner"><div><b>Questo browser non salva i dati.</b>
         Chiudendo la pagina perdi tutto — vai in <b>Dati</b> e salva una copia.</div></div>` : "";
    document.getElementById("main").innerHTML = `<div class="wrap">${banner}${body}</div>`;
    renderSheet();
    if (view === "dati") bindDati();
  }

  function bindDati() {
    const fi = document.getElementById("file-in");
    if (fi) fi.addEventListener("change", () => importPickedFile(fi));
    const nome = document.getElementById("s-nome");
    if (nome) nome.addEventListener("change", () => {
      state.settings.nome = nome.value.trim(); save(); renderRail();
      toast(state.settings.nome ? `Ciao ${state.settings.nome.split(" ")[0]}` : "Nome tolto");
    });
    const pre = document.getElementById("s-preavviso");
    if (pre) pre.addEventListener("change", () => {
      state.settings.preavviso = clamp(parseInt(pre.value, 10) || 0, 0, 90);
      pre.value = state.settings.preavviso; save(); renderRail();
    });
    const fer = document.getElementById("s-fermo");
    if (fer) fer.addEventListener("change", () => {
      state.settings.fermoDopo = clamp(parseInt(fer.value, 10) || DEFAULTS.fermoDopo, 7, 365);
      fer.value = state.settings.fermoDopo; save(); renderRail();
    });
    const dop = document.getElementById("s-dopo");
    if (dop) dop.addEventListener("change", () => {
      state.settings.dopoAcquisto = clamp(parseInt(dop.value, 10) || DEFAULTS.dopoAcquisto, 1, 90);
      dop.value = state.settings.dopoAcquisto; save(); renderRail();
    });
    const cmp = document.getElementById("s-compl");
    if (cmp) cmp.addEventListener("change", () => {
      state.settings.compleanno = clamp(parseInt(cmp.value, 10) || 0, 0, 60);
      cmp.value = state.settings.compleanno; save(); renderRail();
    });
  }

  /* ══ Eventi ═══════════════════════════════════════════════════════════ */

  document.addEventListener("click", ev => {
    const el = ev.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    const c = el.dataset.id ? byId(el.dataset.id) : null;
    const p = el.dataset.pid ? prodById(el.dataset.pid) : null;

    switch (act) {
      case "nav": view = el.dataset.view; query = ""; filter = "tutti"; render(); window.scrollTo(0, 0); break;
      case "filter": filter = el.dataset.f; render(); break;
      case "open": if (c) { openId = c.id; renderSheet(); } break;
      case "close-layer": openId = null; document.getElementById("layer").innerHTML = ""; break;
      case "close-modal": closeModal(); break;

      case "add-client": modalClient(null); break;
      case "edit-client": if (c) modalClient(c); break;
      case "add-order": modalPickClient(); break;
      case "order": if (c) { openId = c.id; modalOrder(c); } break;
      case "snooze": if (c) modalSnooze(c); break;
      case "msg": if (c) modalMessaggio(c, el.dataset.tipo); break;
      case "copy-num": {
        if (!c) break;
        const l = telLink(c.contact);
        if (!l) break;
        (async () => {
          toast(await copiaStringa(l.tel) ? "Numero copiato: " + l.tel : "Il numero è " + l.tel);
        })();
        break;
      }
      case "checkin-done":
      case "checkin-skip":
        if (c) {
          const o = c.orders.find(x => x.id === el.dataset.oid);
          if (o) o.checkin = act === "checkin-skip" ? "no" : todayISO();
          touch(c); save(); render();
          toast(act === "checkin-skip" ? "Non te lo chiedo più per questo ordine" : "Segnato: gliel'hai chiesto");
        }
        break;
      case "auguri-done":
        if (c) {
          const b = compleanno(c);
          if (b) c.augurato = String(b.anno);
          touch(c); save(); render(); toast("Auguri segnati");
        }
        break;

      case "reorder-one": {
        if (!c || !p) break;
        const x = shelf(c).find(y => y.productId === p.id);
        pushOrder(c, [{ productId: p.id, qty: x ? x.qty : 1 }], {});
        render(); toast(`${p.name}: riordinato oggi`);
        break;
      }
      case "drop":
        if (c && p) {
          c.dropped.push({ productId: p.id, at: nowISO() });
          touch(c); save(); render(); toast(`${p.name} non lo segui più`);
        }
        break;
      case "undrop":
        if (c && p) {
          c.dropped = c.dropped.filter(x => x.productId !== p.id);
          touch(c); save(); render(); toast(`${p.name} torna fra i seguiti`);
        }
        break;

      case "save-next": {
        if (!c) break;
        c.nextDate = document.getElementById("np-date").value || "";
        c.nextNote = document.getElementById("np-note").value.trim();
        c.nextKind = "rimanda";
        touch(c); save(); render(); toast("Promemoria salvato"); break;
      }
      case "clear-next": if (c) { c.nextDate = ""; c.nextNote = ""; c.nextKind = "rimanda"; touch(c); save(); render(); } break;
      case "del-order":
        if (c) {
          c.orders = c.orders.filter(o => o.id !== el.dataset.oid);
          touch(c); save(); render(); toast("Ordine eliminato");
        }
        break;
      case "close-client": if (c) modalClose(c); break;
      case "reopen":
        if (c) { c.closed = ""; touch(c); save(); render(); toast("Cliente riaperto"); }
        break;
      case "del-client":
        if (c) modalConfirm(`Eliminare ${c.name}?`, "Spariscono la scheda e tutti i suoi ordini. Non si torna indietro.",
          "Elimina", () => {
            state.clients = state.clients.filter(x => x.id !== c.id);
            state.deleted.push({ id: c.id, at: nowISO() });
            openId = null; save(); toast("Eliminato");
          });
        break;

      case "add-product": modalProduct(null); break;
      case "edit-product": if (p) modalProduct(p); break;
      case "use-observed":
        if (p) {
          p.days = clamp(parseInt(el.dataset.days, 10) || p.days, 1, 3650);
          p.check = false; p.updatedAt = nowISO();
          save(); render(); toast(`${p.name}: ${p.days} giorni`);
        }
        break;

      case "backup-file": backupFile(); break;
      case "copy-json": copyJSON(); break;
      case "import": importPasted(); break;
      case "pick-import": document.getElementById("file-in").click(); break;
      case "import-lista": {
        const l = listaVicina();
        if (!l) { toast("Non trovo la lista nomi su questo dispositivo"); break; }
        if (!l.nuovi) { toast("Sono già tutti qui"); break; }
        importFromLista(l.d, "Dalla lista nomi su questo telefono");
        break;
      }
      case "snooze-backup":
        state.settings.snoozeBackup = nowISO(); save(); render();
        toast("Te lo richiedo fra tre giorni"); break;
      case "demo":
        modalConfirm("Caricare i dati di esempio?", "Sostituisce quello che c'è ora con otto clienti inventati.",
          "Carica esempio", () => { state = normalize(demoData()); view = "oggi"; openId = null; save(); toast("Esempio caricato"); });
        break;
      case "reset":
        modalConfirm("Cancellare tutto?", "Clienti, ordini e catalogo. Salva prima una copia se non sei sicuro.",
          "Cancella tutto", () => { state = emptyState(); openId = null; save(); toast("Tutto cancellato"); });
        break;
      case "theme": {
        const root = document.documentElement;
        const cur = root.getAttribute("data-theme");
        const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const next = cur ? (cur === "dark" ? "light" : "dark") : (sysDark ? "light" : "dark");
        root.setAttribute("data-theme", next);
        try { localStorage.setItem(KEY + ".theme", next); } catch (e) {}
        renderRail();
        if (view === "dati") render();
        break;
      }
    }
  });

  document.addEventListener("input", ev => {
    if (ev.target.id !== "q") return;
    query = ev.target.value;
    const pos = ev.target.selectionStart;
    render();
    const q = document.getElementById("q");
    if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) {} }
  });

  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape") {
      if (document.querySelector(".modal-box")) closeModal();
      else if (openId) { openId = null; document.getElementById("layer").innerHTML = ""; }
    }
    if (ev.key === "Enter" || ev.key === " ") {
      const r = ev.target.closest && ev.target.closest('.row[data-act="open"]');
      if (r) { ev.preventDefault(); openId = r.dataset.id; renderSheet(); }
    }
  });

  /* ══ Avvio ════════════════════════════════════════════════════════════ */

  try {
    const th = localStorage.getItem(KEY + ".theme");
    if (th === "dark" || th === "light") document.documentElement.setAttribute("data-theme", th);
  } catch (e) {}

  load();
  render();

  /* Chiede al browser di trattare questi dati come persistenti: senza, può
     buttare i dati dei siti quando il dispositivo è a corto di spazio. Contro la
     cancellazione manuale non protegge — niente lo fa — e per questo resta il
     promemoria della copia. */
  (async () => {
    try {
      if (!navigator.storage || !navigator.storage.persist) return;
      persistent = await navigator.storage.persisted();
      if (!persistent) persistent = await navigator.storage.persist();
      if (view === "dati") render();
    } catch (e) { /* funzione assente: si continua senza */ }
  })();

})();
</script>
