<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Growup Team</title>
<meta name="description" content="Pianifica la settimana e segui il tuo percorso fino ad Argento.">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Growup">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#14181f; --ink2:#5b6472; --ink3:#7d8794;
  --line:#e3e7ec; --accent:#1f6feb; --accent-ink:#ffffff; --accent-wash:#e8f0fe;
  --verde:#1a9c5b; --giallo:#b07900; --rosso:#d64545; --stella:#8b5cf6;
  --r:14px; --pad:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1116; --card:#171a21; --ink:#eef1f5; --ink2:#a3adbb; --ink3:#7f8997;
    --line:#252a33; --accent:#4b8ef7; --accent-ink:#06101f; --accent-wash:#16233a;
    --verde:#3ec27f; --giallo:#e2a93b; --rosso:#f0736f; --stella:#a78bfa;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1116; --card:#171a21; --ink:#eef1f5; --ink2:#a3adbb; --ink3:#7f8997;
  --line:#252a33; --accent:#4b8ef7; --accent-ink:#06101f; --accent-wash:#16233a;
  --verde:#3ec27f; --giallo:#e2a93b; --rosso:#f0736f; --stella:#a78bfa;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
body.con-azioni{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;padding:var(--pad)}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:22px;letter-spacing:-.01em}
h2{font-size:17px}
h3{font-size:15px}
p{margin:.5em 0}
small,.small{font-size:13px;color:var(--ink2)}
.muted{color:var(--ink2)}
.faint{color:var(--ink3)}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin:12px 0}
.card.tight{padding:12px 14px}
.card.visione{background:linear-gradient(135deg,color-mix(in srgb,var(--stella) 12%,var(--card)),var(--card))}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:10px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;
  text-decoration:none;-webkit-tap-highlight-color:transparent;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn.small{min-height:38px;padding:0 12px;font-size:14px}
.btn.ghost{background:transparent}
.btn.link{border:0;background:none;color:var(--accent);padding:0 4px;min-height:38px}
.btn[disabled]{opacity:.45;pointer-events:none}
a{color:var(--accent)}
input,select,textarea{
  font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:46px;
}
input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}
input::placeholder{color:var(--ink3);opacity:.8}
input.codice{font-size:26px;letter-spacing:.35em;text-align:center;font-variant-numeric:tabular-nums}
label.field{display:block;margin:14px 0 0}
textarea{resize:vertical;min-height:72px}
label.field>span{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px}
label.check{display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;font-size:14px;color:var(--ink2)}
label.check input{width:22px;min-height:22px;height:22px;margin:1px 0 0;flex:none}
.scelte{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.scelte label{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.scelte input{width:20px;min-height:20px;height:20px;margin:0;flex:none}
.scelte label:has(input:checked){border-color:var(--accent);background:var(--accent-wash)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.bar.fatto>i{background:var(--verde)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.v{color:var(--verde);border-color:color-mix(in srgb,var(--verde) 35%,transparent)}
.pill.g{color:var(--giallo);border-color:color-mix(in srgb,var(--giallo) 35%,transparent)}
.pill.s{color:var(--stella);border-color:color-mix(in srgb,var(--stella) 40%,transparent)}
.req{list-style:none;margin:10px 0 0;padding:0}
.req li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.req li:first-child{border-top:0}
.req .mark{width:20px;flex:none;text-align:center;font-weight:700;color:var(--ink3)}
.req li.ok .mark{color:var(--verde)}
.req li.attesa{color:var(--ink3)}
.obiettivo+.obiettivo{margin-top:14px}
.obiettivo .spread{margin-bottom:6px}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.oggi{list-style:none;margin:6px 0 0;padding:0}
.oggi li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.oggi li:first-child{border-top:0}
.oggi .x{border:0;background:none;color:var(--ink3);font-size:20px;width:38px;height:38px;cursor:pointer;border-radius:10px}
.oggi .x:hover{background:var(--bg)}
.schede{display:flex;gap:2px;background:var(--line);border-radius:12px;padding:3px;flex:none}
.schede button{border:0;background:none;color:var(--ink2);font:inherit;font-size:14px;font-weight:600;
  padding:0 14px;min-height:38px;border-radius:9px;cursor:pointer}
.schede button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.fondo{margin:24px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.avviso{margin:10px 0 0;padding:10px 12px;border-radius:10px;font-size:14px;
  background:color-mix(in srgb,var(--giallo) 12%,var(--card));border:1px solid color-mix(in srgb,var(--giallo) 35%,transparent)}
.spinta{margin-top:12px;padding:12px;border-radius:10px;font-size:14px;color:var(--ink2);
  background:var(--accent-wash);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.spinta b{color:var(--ink)}
.linee{list-style:none;margin:10px 0 0;padding:0}
.linee li{display:flex;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.linee li:first-child{border-top:0}
.storico{list-style:none;margin:10px 0 0;padding:0}
.storico li{padding:12px 0;border-top:1px solid var(--line)}
.storico li:first-child{border-top:0}
.storico .dati{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:6px;font-size:14px;color:var(--ink2)}
.storico .dati b{color:var(--ink)}
.imbuto{list-style:none;margin:10px 0 0;padding:0}
.imbuto li{padding:8px 0;border-top:1px solid var(--line)}
.imbuto li:first-child{border-top:0}
.imbuto .small{display:block;margin-top:4px}
.barra-imbuto{height:12px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.barra-imbuto>i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.imbuto li.collo .barra-imbuto>i{background:var(--giallo)}
.btn.pericolo{color:var(--rosso);border-color:color-mix(in srgb,var(--rosso) 40%,transparent)}
.albero .nome{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;background:none;
  color:var(--ink);font:inherit;text-align:left;padding:2px 0;cursor:pointer}
.albero .nome:hover>span:first-child{color:var(--accent)}
.pill.r{color:var(--rosso);border-color:color-mix(in srgb,var(--rosso) 35%,transparent)}
.dati-scheda{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.dati-scheda>div{display:flex;flex-direction:column;padding:10px 12px;background:var(--bg);border-radius:10px}
.dati-scheda b{font-size:18px}
.confronto{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.confronto th{font-size:12px;font-weight:600;color:var(--ink2);text-align:right;padding:4px 0 6px 6px;vertical-align:bottom}
.confronto th span{font-weight:400;color:var(--ink3)}
.confronto td{padding:7px 0;border-top:1px solid var(--line)}
.confronto td.num{text-align:right;padding-left:6px;white-space:nowrap}
.confronto td.faint{font-weight:400}
.confronto td.sotto{color:var(--rosso);font-weight:600}
.griglia-azioni{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.griglia-azioni .btn:last-child:nth-child(odd){grid-column:1 / -1}
.albero{list-style:none;margin:8px 0 0;padding:0}
.albero li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.albero li:first-child{border-top:0}
.albero .btn.link{min-height:32px;padding:0 2px;font-size:13px}
.azioni{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.azioni .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.azioni .btn{min-height:58px;flex-direction:column;gap:0;font-size:15px;padding:0 6px}
.azioni .btn b{font-size:12px;font-weight:600;opacity:.75}
.testata{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 2px}
.menu-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;width:46px;height:46px;font-size:20px;cursor:pointer}
.condividi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.condividi .btn{min-height:50px}
.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.tg{background:#2481cc;border-color:#2481cc;color:#fff}
.linkbox{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;word-break:break-all;margin-top:8px}
.nota{font-size:12px;color:var(--ink3);margin-top:10px}
.errore{color:var(--rosso);font-size:14px;margin-top:10px}
.centro{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
.sheet{position:fixed;inset:0;background:rgba(8,10,14,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-box{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px var(--pad) calc(18px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 10px 10px 16px;border-radius:12px;font-size:14px;font-weight:600;
  display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast button{border:0;background:none;color:var(--bg);font:inherit;font-weight:800;text-decoration:underline;cursor:pointer;min-height:34px;padding:0 6px}
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
        integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"
        crossorigin="anonymous"></script>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Caricamento…</p></div>
<div id="sheet"></div>
<div id="azioni"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
