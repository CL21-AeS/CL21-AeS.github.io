<style>
:root{
  /* Stile H · Smeraldo e rame (scelto il 16 ottobre 2026; tavola in design/tavola-grafica.html) */
  --bg:#f6f3ec; --card:#ffffff; --ink:#10231c; --ink2:#4f5f58; --ink3:#7a8781;
  --line:#e7e0d2; --accent:#0a3a2c; --accent-ink:#f7f0e3; --accent-wash:#e6efe9;
  --verde:#13795b; --giallo:#9a6a00; --rosso:#b42318; --stella:#a8742a;
  --rame:#c26a3d; --rame2:#d98b4f; --eb:#a8552b; --traccia:#efe8da;
  --head:linear-gradient(145deg,#0a3a2c 0%,#13604a 100%); --head-ink:#f7f0e3; --head-ink2:#d9c3a0; --oro:#e2a46f;
  --visione:linear-gradient(135deg,#0a3a2c,#164d3b);
  --b1:#0a3a2c; --b2:#c26a3d; --b3:#13795b;
  --f-titoli:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-testo:"Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r:16px; --pad:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#07130e; --card:#0f1f18; --ink:#eef5f0; --ink2:#a7b8ae; --ink3:#7d8f85;
    --line:#1f3329; --accent:#e2a46f; --accent-ink:#07130e; --accent-wash:#16291f;
    --verde:#34c08f; --giallo:#e2b45a; --rosso:#ff7b6b; --stella:#e2b45a;
    --rame:#e08a5a; --rame2:#f0a76f; --eb:#e2a46f; --traccia:#1c2e25;
    --head:linear-gradient(145deg,#04100b 0%,#0b2c21 100%); --visione:linear-gradient(135deg,#123528,#0c2219);
    --b1:#13604a; --b2:#b8602f; --b3:#1f8a68;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07130e; --card:#0f1f18; --ink:#eef5f0; --ink2:#a7b8ae; --ink3:#7d8f85;
  --line:#1f3329; --accent:#e2a46f; --accent-ink:#07130e; --accent-wash:#16291f;
  --verde:#34c08f; --giallo:#e2b45a; --rosso:#ff7b6b; --stella:#e2b45a;
  --rame:#e08a5a; --rame2:#f0a76f; --eb:#e2a46f; --traccia:#1c2e25;
  --head:linear-gradient(145deg,#04100b 0%,#0b2c21 100%); --visione:linear-gradient(135deg,#123528,#0c2219);
  --b1:#13604a; --b2:#b8602f; --b3:#1f8a68;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 var(--f-testo);
  -webkit-text-size-adjust:100%;
}
body.con-azioni{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;padding:var(--pad)}
h1,h2,h3{margin:0;line-height:1.25}
h1,h2{font-family:var(--f-titoli);font-weight:700;letter-spacing:0;text-wrap:balance}
h1{font-size:28px}
h2{font-size:22px}
h3{font-size:15px}
p{margin:.5em 0}
small,.small{font-size:13px;color:var(--ink2)}
.muted{color:var(--ink2)}
.faint{color:var(--ink3)}
.eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--eb)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin:12px 0}
.card.tight{padding:12px 14px}
.card.visione{background:var(--visione);border-color:transparent;color:var(--head-ink)}
.card.visione .eyebrow{color:var(--oro)}
.card.visione .small,.card.visione .nota{color:var(--head-ink2)}
.card.visione .num{color:var(--oro);font-size:24px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:10px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;
  text-decoration:none;-webkit-tap-highlight-color:transparent;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn.small{min-height:38px;padding:0 12px;font-size:14px}
.btn.ghost{background:transparent}
.btn.link{border:0;background:none;color:var(--accent);padding:0 4px;min-height:38px}
.btn[disabled]{opacity:.45;pointer-events:none}
a{color:var(--accent)}
input,select,textarea{
  font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:46px;
}
input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}
input::placeholder{color:var(--ink3);opacity:.8}
input[data-vuoto]::placeholder{color:var(--ink3);opacity:.55}
input.codice{font-size:26px;letter-spacing:.35em;text-align:center;font-variant-numeric:tabular-nums}
label.field{display:block;margin:14px 0 0}
textarea{resize:vertical;min-height:72px}
label.field>span{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px}
label.check{display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;font-size:14px;color:var(--ink2)}
label.check input{width:22px;min-height:22px;height:22px;margin:1px 0 0;flex:none}
.scelte{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.scelte label{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.scelte input{width:20px;min-height:20px;height:20px;margin:0;flex:none}
.scelte label:has(input:checked){border-color:var(--accent);background:var(--accent-wash)}
.bar{height:10px;border-radius:99px;background:var(--traccia);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--rame),var(--rame2));border-radius:99px;transition:width .25s}
.bar.fatto>i{background:var(--verde)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.v{color:var(--verde);border-color:color-mix(in srgb,var(--verde) 35%,transparent)}
.pill.g{color:var(--giallo);border-color:color-mix(in srgb,var(--giallo) 35%,transparent)}
.pill.s{color:var(--stella);border-color:color-mix(in srgb,var(--stella) 40%,transparent)}
.req{list-style:none;margin:10px 0 0;padding:0}
.req li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.req li:first-child{border-top:0}
.req .mark{width:20px;flex:none;text-align:center;font-weight:700;color:var(--ink3)}
.req li.ok .mark{color:var(--verde)}
.req li.attesa{color:var(--ink3)}
.obiettivo+.obiettivo{margin-top:14px}
.obiettivo .spread{margin-bottom:6px}
.num{font-family:var(--f-titoli);font-variant-numeric:lining-nums tabular-nums;font-weight:700;font-size:1.15em;line-height:1.1}
.oggi{list-style:none;margin:6px 0 0;padding:0}
.oggi li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.oggi li:first-child{border-top:0}
/* import dal report Amway */
.imp-sezione{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.imp-sezione .small{margin:4px 0 0}
ul.imp{list-style:none;margin:6px 0 0;padding:0}
ul.imp li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
ul.imp li:first-child{border-top:0}
.imp-sezione details summary{cursor:pointer;margin-top:6px}
.scelte-rapide .btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.oggi .x,.persone .x{border:0;background:none;color:var(--ink3);font-size:20px;width:38px;height:38px;cursor:pointer;border-radius:10px}
.oggi .x:hover,.persone .x:hover{background:var(--bg)}
.schede{display:flex;gap:2px;background:rgba(255,255,255,.10);border:1px solid rgba(217,195,160,.35);border-radius:12px;padding:3px;flex:none}
.schede button{border:0;background:none;color:var(--head-ink2);font:inherit;font-size:14px;font-weight:700;
  padding:0 14px;min-height:38px;border-radius:9px;cursor:pointer}
.schede button.on{background:var(--oro);color:#0a3a2c}
.fondo{margin:24px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.copia-dati{text-align:center;margin-top:12px}
.avviso{margin:10px 0 0;padding:10px 12px;border-radius:10px;font-size:14px;
  background:color-mix(in srgb,var(--giallo) 12%,var(--card));border:1px solid color-mix(in srgb,var(--giallo) 35%,transparent)}
.spinta{margin-top:12px;padding:12px;border-radius:12px;font-size:14px;color:var(--ink2);background:var(--traccia)}
.spinta b{color:var(--ink)}
.linee{list-style:none;margin:10px 0 0;padding:0}
.linee li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.linee li .num{margin-left:auto;text-align:right;white-space:nowrap;font:700 14px/1.2 var(--f-testo);font-variant-numeric:tabular-nums}
.linee li:first-child{border-top:0}
.nome-linea{all:unset;flex:1;min-width:0;cursor:pointer;color:var(--accent);font-weight:600;min-height:28px}
.nome-linea:focus-visible{outline:2px solid currentColor;outline-offset:2px;border-radius:4px}
.storico{list-style:none;margin:10px 0 0;padding:0}
.storico li{padding:12px 0;border-top:1px solid var(--line)}
.storico li:first-child{border-top:0}
.storico .dati{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:6px;font-size:14px;color:var(--ink2)}
.storico .dati b{color:var(--ink)}
.obiettivo-breve{cursor:pointer}
.perche{margin:10px 0 0;font-family:var(--f-titoli);font-size:19px;line-height:1.35;font-style:italic}
.percorso{list-style:none;margin:10px 0 0;padding:0}
.percorso>li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.percorso>li:first-child{border-top:0}
.percorso>li>.mark{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;
  background:var(--traccia);color:var(--ink2)}
.percorso>li.fatta>.mark{background:var(--verde);color:#fff}
.percorso>li.attuale>.mark{background:var(--rame);color:#fff}
.percorso>li.meta>.mark{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--stella)}
.percorso>li.fatta{color:var(--ink3)}
.percorso .pill{margin-left:4px}
.preferiti{list-style:none;margin:8px 0 0;padding:0}
.preferiti li{padding:12px 0;border-top:1px solid var(--line)}
.preferiti li:first-child{border-top:0}
.preferiti .nome{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;background:none;
  color:var(--ink);font:inherit;font-weight:700;text-align:left;padding:2px 0;cursor:pointer}
.preferiti .nome .small{font-weight:400}
.preferiti .obiettivo{margin-top:8px}
.preferiti .obiettivo .spread{margin-bottom:4px;font-size:14px}
.preferiti .obiettivo.debole .spread>span:first-child{color:var(--giallo);font-weight:700}
.preferiti .obiettivo.debole .bar>i{background:var(--giallo)}
.stella{border:1px solid var(--line);background:var(--card);color:var(--ink3);border-radius:12px;width:40px;height:38px;font-size:20px;line-height:1;cursor:pointer;flex:none}
.stella.on{color:var(--stella);border-color:color-mix(in srgb,var(--stella) 55%,transparent)}
.imbuto{list-style:none;margin:10px 0 0;padding:0}
.imbuto li{padding:8px 0;border-top:1px solid var(--line)}
.imbuto li:first-child{border-top:0}
.imbuto .small{display:block;margin-top:4px}
.barra-imbuto{height:12px;border-radius:99px;background:var(--traccia);overflow:hidden;margin-top:6px}
.barra-imbuto>i{display:block;height:100%;background:var(--verde);border-radius:99px}
.imbuto li.collo .barra-imbuto>i{background:var(--giallo)}
.btn.pericolo{color:var(--rosso);border-color:color-mix(in srgb,var(--rosso) 40%,transparent)}
.albero .nome{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;background:none;
  color:var(--ink);font:inherit;text-align:left;padding:2px 0;cursor:pointer}
.albero .nome:hover>span:first-child{color:var(--accent)}
.pill.r{color:var(--rosso);border-color:color-mix(in srgb,var(--rosso) 35%,transparent)}
.dati-scheda{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.dati-scheda>div{display:flex;flex-direction:column;padding:10px 12px;background:var(--bg);border-radius:10px}
.dati-scheda b{font-size:18px}
.passi{margin:10px 0 0;padding-left:20px;font-size:14px;color:var(--ink2)}
.passi li{margin:6px 0}
.passi b{color:var(--ink)}
.confronto{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.confronto th{font-size:12px;font-weight:600;color:var(--ink2);text-align:right;padding:4px 0 6px 6px;vertical-align:bottom}
.confronto th span{font-weight:400;color:var(--ink3)}
.confronto td{padding:7px 0;border-top:1px solid var(--line)}
.confronto td.num{text-align:right;padding-left:6px;white-space:nowrap}
.confronto td.faint{font-weight:400}
.confronto.mesi tbody tr{cursor:pointer}
.confronto.mesi td .btn.link{min-height:0;padding:0;font-weight:600}
.storico .dati b.sotto{color:var(--rosso)}
.confronto td.sotto{color:var(--rosso);font-weight:600}
.griglia-azioni{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.griglia-azioni .btn:last-child:nth-child(odd){grid-column:1 / -1}
.albero{list-style:none;margin:8px 0 0;padding:0}
.albero li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.albero li:first-child{border-top:0}
.albero .btn.link{min-height:32px;padding:0 2px;font-size:13px}
.albero li.liv{padding-left:var(--rientro)}
.albero li.io .nome{cursor:default;font-weight:700}
.albero li.piegato{display:none}
.albero.in-ricerca li.piegato{display:flex}
.albero li.fuori{display:none !important}
.albero li.trovato .nome>span:first-child{color:var(--rame);font-weight:800}
.cerca{margin-top:12px}
.livello{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;
  font-variant-numeric:tabular-nums;color:#fff;background:var(--lv)}
.livello.l0{--lv:#0a3a2c} .livello.l1{--lv:#c26a3d} .livello.l2{--lv:#13795b} .livello.l3{--lv:#8a6414}
:root[data-theme="dark"] .livello.l0{--lv:#1f7a5c}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .livello.l0{--lv:#1f7a5c} }
.piega{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:99px;
  font:inherit;font-size:12px;font-weight:700;padding:3px 9px;min-height:30px;cursor:pointer;white-space:nowrap}
.azioni{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.azioni .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.azioni .btn{min-height:58px;flex-direction:column;gap:0;font-size:15px;font-weight:800;padding:0 6px;border:0;border-radius:16px;color:#ffffff}
.azioni .btn.c1{background:var(--b1)} .azioni .btn.c2{background:var(--b2)} .azioni .btn.c3{background:var(--b3)}
.azioni .btn b{font-size:12px;font-weight:600;opacity:.75}
.testata{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:calc(-1 * var(--pad)) calc(-1 * var(--pad)) 4px;padding:calc(18px + env(safe-area-inset-top, 0px)) var(--pad) 20px;
  background:var(--head);color:var(--head-ink);border-radius:0 0 22px 22px}
.testata .eyebrow{color:var(--head-ink2)}
/* tre pagine: le schede stanno in una riga sotto il titolo, a tutta larghezza */
.testata{flex-wrap:wrap;row-gap:14px}
.testata>.schede{order:2;width:100%}
.testata>.schede button{flex:1;padding:0 6px}
.testata h1{color:var(--head-ink)}
.testata .small{color:var(--head-ink2)}
.testata .btn.link{color:var(--oro)}
.menu-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;width:46px;height:46px;font-size:20px;cursor:pointer}
.condividi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.condividi .btn{min-height:50px}
.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.tg{background:#2481cc;border-color:#2481cc;color:#fff}
.immagini-invito{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.immagini-invito button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:12px;padding:8px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;text-align:left}
.immagini-invito img{width:44px;height:44px;object-fit:cover;border-radius:8px;flex:none}
.immagini-invito button.stato img{width:28px}
.linkbox{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;word-break:break-all;margin-top:8px}
.nota{font-size:12px;color:var(--ink3);margin-top:10px}
.errore{color:var(--rosso);font-size:14px;margin-top:10px}
.centro{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
.sheet{position:fixed;inset:0;background:rgba(8,10,14,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-box{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px var(--pad) calc(18px + env(safe-area-inset-bottom))}
/* Persone: i Clienti */
.avviso-cliente{border-left:4px solid var(--giallo)}
.righe-ordine{list-style:none;margin:0;padding:0}
.righe-ordine li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.righe-ordine li:first-child{border-top:0}
.qta{display:flex;align-items:center;gap:4px}
.qta .btn{min-width:32px;padding:0 8px}
input.mini{width:56px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;background:var(--card);color:var(--ink)}
input.mini.prezzo{width:68px;text-align:right}
.risultati-prodotto{list-style:none;margin:6px 0 0;padding:0;max-height:280px;overflow:auto}
.risultati-prodotto li{border-top:1px solid var(--line)}
.btn.small.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* Persone: il Target */
.sezioni-persone{margin:4px 0 12px}
.sezioni-persone .btn{flex:1}
.contatto{max-width:560px;margin:0 auto;padding-top:16px}
.contatto .card p{margin:0 0 10px}
.avanzamento{height:6px;border-radius:3px;background:var(--traccia);margin:0 0 12px;overflow:hidden}
.avanzamento i{display:block;height:100%;background:var(--accent)}
.risposte-ct{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.risposte-ct .btn{white-space:normal;text-align:left;justify-content:flex-start;min-height:52px;padding:10px 14px;line-height:1.35}
.risposte-ct .btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.esito-t{margin-top:12px;padding:12px;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;gap:4px}
.esito-t.go{border-left:4px solid var(--verde)}
.esito-t.care{border-left:4px solid var(--giallo)}
.esito-t.no{border-left:4px solid var(--rosso)}
.barra-t{height:6px;border-radius:3px;background:var(--traccia);overflow:hidden}
.barra-t i{display:block;height:100%;background:var(--accent)}
.risposte-t{list-style:none;margin:8px 0 0;padding:0}
.risposte-t li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.risposte-t li:first-child{border-top:0}
.risposte-t .num.zero{color:var(--rosso);font-weight:800}
.metodo summary{cursor:pointer;list-style:none}
.metodo summary::after{content:" ▾";color:var(--ink3)}
.metodo h3{font-size:15px;margin:14px 0 6px}
.metodo ul{margin:0;padding-left:18px}
.consigli .promemoria{margin:10px 0 0;padding:8px 10px;border-radius:10px;background:var(--traccia,rgba(0,0,0,.04));font-size:14px}
.consigli p{margin:10px 0 0;font-size:15px}
.tab-consigli{overflow-x:auto;margin-top:12px;-webkit-overflow-scrolling:touch}
.tab-consigli table{border-collapse:collapse;font-size:13px;min-width:100%}
.tab-consigli th{font-size:11px;font-weight:600;color:var(--ink2);text-align:right;padding:4px 0 6px 8px;white-space:nowrap;vertical-align:bottom}
.tab-consigli th:first-child,.tab-consigli td:first-child{text-align:left;padding-left:0;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.tab-consigli td{padding:6px 0 6px 8px;border-top:1px solid var(--line)}
.tab-consigli td.num{text-align:right;white-space:nowrap}
.tab-consigli td.sotto{color:var(--rosso);font-weight:600}
/* Persone: la lista */
.persone{list-style:none;margin:8px 0 0;padding:0}
.persone li{border-top:1px solid var(--line)}
.persone li.su-io{display:flex;align-items:center;gap:6px}
label.check.tutti{margin:8px 0 2px;font-weight:700;color:var(--ink)}
.persone li:first-child{border-top:0}
.persona{display:flex;align-items:center;gap:10px;width:100%;padding:10px 0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.punti{display:flex;gap:3px;flex:none}
.nome-modifica{all:unset;cursor:pointer;font:inherit;color:inherit;text-align:left}
.nome-modifica span{font-size:.6em;color:var(--ink3);vertical-align:middle;margin-left:4px}
.nome-modifica:focus-visible{outline:2px solid currentColor;outline-offset:2px;border-radius:4px}
.etichette{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;flex:none;max-width:62%}
.persona .pill.mini{font-size:11px;padding:1px 7px;margin-left:4px}
.punti i{width:7px;height:7px;border-radius:50%;background:var(--traccia)}
.punti i.on{background:var(--accent)}
.da-fare-t{margin:10px 0 0;font-weight:700}
.percorso-persona{list-style:none;display:flex;gap:4px;margin:14px 0 0;padding:0}
.percorso-persona li{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;text-align:center;color:var(--ink2)}
.percorso-persona li i{width:100%;height:6px;border-radius:3px;background:var(--traccia)}
.percorso-persona li.fatta i,.percorso-persona li.qui i{background:var(--accent)}
.percorso-persona li.qui{color:var(--ink);font-weight:700}
.prossima{display:flex;flex-direction:column;margin-top:14px;padding:10px 12px;background:var(--bg);border-radius:10px}
fieldset.field{border:0;padding:0;margin:14px 0 0;min-width:0}
fieldset.field legend{padding:0;margin-bottom:6px;font-size:13px;font-weight:700;color:var(--ink2)}
fieldset.field input[type=date],fieldset.field input[name=prossima_nota]{margin-top:8px}
.opzioni{display:flex;flex-wrap:wrap;gap:6px}
.opzioni.tipi{margin:4px 0 6px}
.opzioni.tipi .btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:14px;cursor:pointer}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.albero.struttura li.nascosta{opacity:.55}
.imp-filtri{display:none}
form:has(input[name=modo][value=filtri]:checked) .imp-filtri{display:block}
.avviso-interno{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--traccia);border:1px solid var(--rame);font-size:14px}
.captcha{position:fixed;inset:0;z-index:70;background:rgba(8,10,14,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.captcha-box{background:var(--card);color:var(--ink);border-radius:18px;padding:20px;max-width:360px;width:100%;text-align:center}
.captcha-box p{margin:6px 0 14px;color:var(--ink2)}
.captcha-widget{display:flex;justify-content:center;min-height:65px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 10px 10px 16px;border-radius:12px;font-size:14px;font-weight:600;
  display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast button{border:0;background:none;color:var(--bg);font:inherit;font-weight:800;text-decoration:underline;cursor:pointer;min-height:34px;padding:0 6px}
/* Il movimento ("Vivace"; tra le pagine "Sobria", in app.js): i pulsanti si premono e tornano su elastici */
@media (prefers-reduced-motion: no-preference){
  .btn,.azioni .btn,.stella,.schede button{transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
  .btn:active,.azioni .btn:active,.stella:active{transform:scale(.92);transition-duration:.08s}
  button.persona{transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
  button.persona:active{transform:scale(.98);transition-duration:.08s}
}
/* Il passaggio tra le schede "una sopra l'altra": la copia della pagina di prima resta ferma (sotto o sopra) */
html,body{overflow-x:clip}
.pagina-prima{position:fixed;inset:0;z-index:1;overflow:hidden;background:var(--bg);pointer-events:none}
.pagina-prima.sopra{z-index:20;box-shadow:-14px 0 28px rgba(0,0,0,.18)}
#app.in-cima{position:relative;z-index:2;background:var(--bg);min-height:100vh;box-shadow:-14px 0 28px rgba(0,0,0,.18)}
#app.sotto{position:relative;z-index:0;min-height:100vh}
/* I pulsanti che vedono solo gli admin, con la scritta piccola sotto */
.solo-admin-box{display:inline-flex;flex-direction:column;align-items:center;gap:2px;vertical-align:top}
.solo-admin-box.largo{display:flex;align-items:stretch}
.solo-admin{font-size:11px;font-weight:700;color:var(--rame);text-align:center;line-height:1.2}
/* I traguardi: coriandoli su tutto lo schermo e l'annuncio al centro */
.coriandoli{position:fixed;inset:0;width:100%;height:100%;z-index:80;pointer-events:none}
.annuncio-festa{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:81;pointer-events:none;width:min(330px,calc(100% - 32px));
  background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:16px 18px;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.25)}
.annuncio-festa b{display:block;font:700 26px/1.15 var(--f-titoli);text-wrap:balance}
.annuncio-festa span{font-size:13px;color:var(--ink3)}
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
        integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"
        crossorigin="anonymous"></script>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Caricamento…</p></div>
<div id="sheet"></div>
<div id="azioni"></div>
<div id="toast"></div>
<script src="listino.js"></script>
<script src="app.js"></script>
</body>
</html>
